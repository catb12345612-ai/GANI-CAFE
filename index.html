<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe | Smart Ordering Terminal</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    :root {
      --bg-dark: #0a0e17; --card-bg: #141b2d; --accent-gold: #f59e0b;
      --accent-emerald: #10b981; --accent-blue: #3b82f6; --danger: #ef4444;
      --text-light: #f8fafc; --text-muted: #94a3b8; --border-color: #2a364f;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; overflow-x: hidden; }

    header { background: rgba(20, 27, 45, 0.85); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-color); padding: 15px 25px; position: sticky; top: 0; z-index: 100; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .brand-logo { font-size: 1.6rem; font-weight: 800; color: var(--accent-gold); display: flex; align-items: center; gap: 8px; }
    .header-controls { display: flex; align-items: center; gap: 15px; }
    .table-select, .search-input { background: #0a0e17; border: 1px solid var(--border-color); color: #fff; padding: 8px 14px; border-radius: 8px; outline: none; font-size: 0.95rem; }

    .main-layout { display: flex; flex: 1; overflow: hidden; height: calc(100vh - 140px); }
    .menu-area { flex: 1; padding: 20px; overflow-y: auto; display: flex; flex-direction: column; gap: 20px; }
    .categories-bar { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; }
    .cat-btn { background: var(--card-bg); border: 1px solid var(--border-color); color: var(--text-muted); padding: 8px 18px; border-radius: 20px; cursor: pointer; white-space: nowrap; font-weight: 600; transition: all 0.2s; }
    .cat-btn.active, .cat-btn:hover { background: var(--accent-gold); color: #000; border-color: var(--accent-gold); }

    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 18px; }
    .menu-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; overflow: hidden; display: flex; flex-direction: column; position: relative; }
    .item-img { width: 100%; height: 130px; object-fit: cover; background: #1e293b; }
    .item-details { padding: 12px; flex: 1; display: flex; flex-direction: column; justify-content: space-between; }
    .item-title { font-size: 1rem; font-weight: 700; margin-bottom: 4px; }
    .item-cat { font-size: 0.75rem; color: var(--text-muted); margin-bottom: 8px; }
    .item-bottom { display: flex; justify-content: space-between; align-items: center; margin-top: 10px; }
    .item-price { font-size: 1.1rem; font-weight: 800; color: var(--accent-emerald); }
    .btn-add { background: var(--accent-gold); border: none; color: #000; padding: 6px 14px; font-weight: 700; border-radius: 6px; cursor: pointer; }

    .cart-sidebar { width: 380px; background: var(--card-bg); border-left: 1px solid var(--border-color); display: flex; flex-direction: column; }
    .cart-header { padding: 18px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; }
    .cart-items { flex: 1; overflow-y: auto; padding: 15px; display: flex; flex-direction: column; gap: 12px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: #0a0e17; padding: 10px 14px; border-radius: 8px; border: 1px solid var(--border-color); }
    .btn-qty { background: var(--border-color); border: none; color: #fff; width: 26px; height: 26px; border-radius: 4px; cursor: pointer; font-weight: bold; }
    .cart-footer { padding: 18px; border-top: 1px solid var(--border-color); background: #0c1220; display: flex; flex-direction: column; gap: 12px; }
    .price-row { display: flex; justify-content: space-between; font-size: 0.95rem; color: var(--text-muted); }
    .price-row.total { font-size: 1.25rem; font-weight: 800; color: var(--accent-gold); border-top: 1px dashed var(--border-color); padding-top: 10px; }
    .btn-checkout { background: var(--accent-emerald); border: none; color: #fff; padding: 14px; border-radius: 8px; font-weight: 800; font-size: 1rem; cursor: pointer; text-align: center; }
    
    .modal { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.8); z-index: 200; justify-content: center; align-items: center; padding: 20px; }
    .modal.active { display: flex; }
    .modal-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; width: 100%; max-width: 500px; padding: 24px; display: flex; flex-direction: column; gap: 16px; }
    .qr-box { text-align: center; background: #fff; padding: 15px; border-radius: 8px; margin: 10px 0; }
    
    footer { background: #060910; border-top: 1px solid var(--border-color); padding: 12px 25px; text-align: center; font-size: 0.85rem; color: var(--text-muted); }
    footer strong { color: var(--accent-gold); }
    footer a { color: var(--accent-blue); text-decoration: none; }

    @media (max-width: 900px) { .main-layout { flex-direction: column; height: auto; } .cart-sidebar { width: 100%; } }
  </style>
</head>
<body>

  <header>
    <div class="brand-logo">☕ GANI CAFE <span style="font-size: 0.8rem; color: var(--accent-emerald); font-weight: normal;">• SMART AI POS</span></div>
    <div class="header-controls">
      <select id="tableSelector" class="table-select" onchange="playSFX('click')">
        <option value="Takeout">🥡 Takeout Order</option>
        <option value="Table 1">🪑 Table 1</option>
        <option value="Table 2">🪑 Table 2</option>
        <option value="Table 3">🪑 Table 3</option>
        <option value="Table 4">🪑 Table 4</option>
        <option value="Table 5">🪑 Table 5</option>
        <option value="Table 6">🪑 Table 6</option>
        <option value="Table 7">🪑 Table 7</option>
        <option value="Table 8">🪑 Table 8</option>
        <option value="Table 9">🪑 Table 9</option>
        <option value="Table 10">🪑 Table 10</option>
      </select>
      <input type="text" id="searchInput" class="search-input" placeholder="🔍 Search menu..." oninput="renderMenu()">
      <button class="btn-add" style="background: var(--accent-blue); color: #fff;" onclick="toggleOrderTrackerModal(true)">📋 Track Orders</button>
    </div>
  </header>

  <div class="main-layout">
    <div class="menu-area">
      <div class="categories-bar" id="categoryContainer"></div>
      <div class="menu-grid" id="menuGridContainer"></div>
    </div>

    <div class="cart-sidebar">
      <div class="cart-header">
        <h3>Current Order</h3>
        <span id="activeTableLabel" style="font-size: 0.85rem; color: var(--accent-gold);">Takeout</span>
      </div>
      <div class="cart-items" id="cartContainer"></div>
      <div class="cart-footer">
        <div class="price-row"><span>Subtotal</span><span id="subtotalVal">₹0</span></div>
        <div class="price-row total"><span>Total Payable</span><span id="totalVal">₹0</span></div>
        <button class="btn-checkout" onclick="openPaymentModal()">Proceed to Payment & Send Order</button>
      </div>
    </div>
  </div>

  <div class="modal" id="paymentModal">
    <div class="modal-card">
      <h3>Complete Payment & Place Order</h3>
      <select id="paymentMethod" class="table-select" style="width: 100%;" onchange="toggleQRArea()">
        <option value="UPI QR">UPI / PhonePe / GPay / Paytm QR</option>
        <option value="Cash">Cash at Counter</option>
      </select>
      <div class="qr-box" id="qrContainer">
        <p style="font-size: 0.8rem; color: #333; margin-bottom: 5px; font-weight: bold;">Scan with any UPI App</p>
        <img id="upiQrCodeImg" src="" alt="UPI QR Code" style="width: 180px; height: 180px;">
        <p id="qrAmountLabel" style="color: #000; font-weight: bold; margin-top: 5px;"></p>
      </div>
      <button class="btn-checkout" onclick="submitFinalOrder()">Confirm & Send Order to Kitchen</button>
      <button class="cat-btn" style="width: 100%; text-align: center;" onclick="closeModal('paymentModal')">Cancel</button>
    </div>
  </div>

  <div class="modal" id="orderTrackerModal">
    <div class="modal-card" style="max-width: 600px;">
      <div style="display: flex; justify-content: space-between;">
        <h3>Live Orders Tracker</h3>
        <button onclick="closeModal('orderTrackerModal')" style="background: none; border: none; color: #fff; cursor: pointer;">✖</button>
      </div>
      <div id="trackerOrdersList" style="max-height: 400px; overflow-y: auto; display: flex; flex-direction: column; gap: 15px; margin-top: 15px;"></div>
    </div>
  </div>

  <footer>
    Designed & Developed with Premium Features by <strong>Zeeshan Ali</strong> (Z E E S H A A N  A L I)<br>
    Instagram: <a href="https://instagram.com" target="_blank">@zeeshan_ali_dev</a> | © 2026 Gani Cafe.
  </footer>

  <script>
    // Firebase Setup
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    // YOUR GOOGLE APPS SCRIPT URL HERE
    const GAS_WEBAPP_URL = "https://script.google.com/macros/s/AKfycbybeSPXR0ud-SIEYb8FWcovCdrZfaDHwvckXrZDcD9yLbeIHcJDqOVmTg4vWioE-cG0/exec";

    let currentCategory = "All";
    let menuData = [];
    let cart = [];
    let liveOrders = {};

    function initApp() {
      db.ref("menu").on("value", snapshot => {
        const val = snapshot.val();
        if (val) {
          // HARDFIX: Filter out bad data and replace missing 'undefined' values from older Firebase entries
          menuData = Object.values(val)
            .filter(item => item && typeof item === 'object')
            .map(item => ({
              id: item.id || `item_${Math.random()}`,
              name: item.name || "Unnamed Item",
              category: item.category || item.Category || "Other",
              price: Number(item.price) || 0,
              inStock: item.inStock !== false,
              img: item.img || item.image || item.imageUrl || "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=300"
            }));
        } else {
          menuData = [];
        }
        renderCategories();
        renderMenu();
      });

      db.ref("orders").on("value", snapshot => {
        const val = snapshot.val();
        liveOrders = val ? Object.values(val).filter(o => o && typeof o === 'object') : [];
        renderOrdersTracker();
      });

      document.getElementById("tableSelector").addEventListener("change", (e) => {
        document.getElementById("activeTableLabel").innerText = e.target.value;
      });
    }

    function playSFX(type) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain); gain.connect(ctx.destination);
        if (type === 'click') { osc.frequency.setValueAtTime(600, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.1); }
        else if (type === 'add') { osc.frequency.setValueAtTime(800, ctx.currentTime); gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.15); }
        osc.start(); osc.stop(ctx.currentTime + 0.15);
      } catch(e){}
    }

    function renderCategories() {
      const cats = ["All", ...new Set(menuData.map(i => i.category))];
      document.getElementById("categoryContainer").innerHTML = cats.map(c => `
        <button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
      `).join("");
    }

    function setCategory(cat) { currentCategory = cat; playSFX('click'); renderCategories(); renderMenu(); }

    function renderMenu() {
      const query = document.getElementById("searchInput").value.toLowerCase();
      const filtered = menuData.filter(item => 
        (currentCategory === "All" || item.category === currentCategory) &&
        item.name.toLowerCase().includes(query)
      );

      document.getElementById("menuGridContainer").innerHTML = filtered.map(item => `
        <div class="menu-card" style="${!item.inStock ? 'opacity: 0.6;' : ''}">
          <img src="${item.img}" class="item-img" alt="${item.name}" onerror="this.src='https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=300'">
          <div class="item-details">
            <div>
              <div class="item-title">${item.name}</div>
              <div class="item-cat">${item.category}</div>
            </div>
            <div class="item-bottom">
              <span class="item-price">₹${item.price}</span>
              <button class="btn-add" ${!item.inStock ? 'disabled' : ''} onclick="addToCart('${item.id}')">+ Add</button>
            </div>
          </div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const item = menuData.find(i => i.id === id);
      if (!item || !item.inStock) return;
      playSFX('add');
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty++; } else { cart.push({ ...item, qty: 1 }); }
      renderCart();
    }

    function updateCartQty(id, delta) {
      playSFX('click');
      const idx = cart.findIndex(i => i.id === id);
      if (idx > -1) { cart[idx].qty += delta; if (cart[idx].qty <= 0) cart.splice(idx, 1); }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartContainer");
      if (cart.length === 0) { container.innerHTML = `<p style="text-align:center; color: var(--text-muted); margin-top: 30px;">Cart is empty.</p>`; } 
      else {
        container.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div><strong>${item.name}</strong><div style="font-size: 0.8rem; color: var(--accent-emerald);">₹${item.price} x ${item.qty}</div></div>
            <div style="display:flex; align-items:center; gap:8px;">
              <button class="btn-qty" onclick="updateCartQty('${item.id}', -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn-qty" onclick="updateCartQty('${item.id}', 1)">+</button>
            </div>
          </div>
        `).join("");
      }
      const total = cart.reduce((acc, i) => acc + (Number(i.price) * i.qty), 0);
      document.getElementById("subtotalVal").innerText = `₹${total}`;
      document.getElementById("totalVal").innerText = `₹${total}`;
    }

    function openPaymentModal() {
      if (cart.length === 0) return alert("Please add items to cart first!");
      playSFX('click'); toggleQRArea(); document.getElementById("paymentModal").classList.add("active");
    }

    function toggleQRArea() {
      const method = document.getElementById("paymentMethod").value;
      const total = cart.reduce((acc, i) => acc + (Number(i.price) * i.qty), 0);
      const qrBox = document.getElementById("qrContainer");
      if (method === "UPI QR") {
        qrBox.style.display = "block";
        const upiString = `upi://pay?pa=ganicafe@upi&pn=GaniCafe&am=${total}&cu=INR`;
        document.getElementById("upiQrCodeImg").src = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiString)}`;
        document.getElementById("qrAmountLabel").innerText = `Total Payable: ₹${total}`;
      } else { qrBox.style.display = "none"; }
    }

    function closeModal(id) { document.getElementById(id).classList.remove("active"); }

    function submitFinalOrder() {
      const tableNo = document.getElementById("tableSelector").value;
      const payMethod = document.getElementById("paymentMethod").value;
      const totalAmount = cart.reduce((acc, i) => acc + (Number(i.price) * i.qty), 0);
      const orderId = "ORD-" + Math.floor(100000 + Math.random() * 900000);

      const orderPayload = {
        orderId: orderId, tableNo: tableNo, items: cart, totalAmount: totalAmount,
        paymentMethod: payMethod, paymentStatus: payMethod === "Cash" ? "Pending Counter Cash" : "Paid via UPI",
        kitchenStatus: "Pending", clearanceStatus: "Pending Clearance",
        timestamp: Date.now(), dateStr: new Date().toLocaleString()
      };

      // 1. Save to Firebase
      db.ref("orders/" + orderId).set(orderPayload);

      // 2. Google Apps Script POST Execution (Added explicitly here)
      try {
        fetch(GAS_WEBAPP_URL, {
          method: "POST", mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(orderPayload)
        });
      } catch (e) { console.error("Google Script Error", e); }

      alert(`Order ${orderId} successfully placed!`);
      cart = []; renderCart(); closeModal("paymentModal"); toggleOrderTrackerModal(true);
    }

    function toggleOrderTrackerModal(show) {
      if (show) { renderOrdersTracker(); document.getElementById("orderTrackerModal").classList.add("active"); } 
      else { closeModal("orderTrackerModal"); }
    }

    function renderOrdersTracker() {
      const container = document.getElementById("trackerOrdersList");
      const sorted = liveOrders.sort((a,b) => b.timestamp - a.timestamp).slice(0, 5);
      if (sorted.length === 0) { container.innerHTML = `<p style="color:var(--text-muted);">No active orders found.</p>`; return; }

      container.innerHTML = sorted.map(o => `
        <div style="background:#0a0e17; padding:15px; border-radius:8px; border:1px solid var(--border-color);">
          <div style="display:flex; justify-content:space-between;"><strong>${o.orderId} (${o.tableNo})</strong><span style="color:var(--accent-gold);">₹${o.totalAmount}</span></div>
          <p style="font-size:0.8rem; color:var(--text-muted); margin: 8px 0;">${o.items.map(i => `${i.qty}x ${i.name}`).join(", ")}</p>
          <div style="font-size: 0.85rem; color: var(--accent-emerald);">Kitchen Status: ${o.kitchenStatus}</div>
        </div>
      `).join("");
    }

    window.onload = initApp;
  </script>
</body>
</html>
