<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gani Cafe - Customer Order Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-gray-50 text-gray-900 font-sans pb-28">
    <header class="bg-indigo-600 text-white shadow-md sticky top-0 z-50">
        <div class="max-w-4xl mx-auto px-4 py-3 flex justify-between items-center">
            <div>
                <h1 class="text-lg font-bold tracking-tight">Gani Cafe Hub</h1>
                <p id="tableDisplay" class="text-xs text-indigo-200">Table: Loading...</p>
            </div>
            <div class="flex items-center gap-2">
                <button onclick="openFeedbackModal()" class="bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-xs font-medium flex items-center gap-1.5 transition">
                    <i class="fa-solid fa-star text-amber-300"></i> Feedback
                </button>
                <button onclick="toggleCart()" class="relative bg-indigo-700 hover:bg-indigo-800 px-3 py-2 rounded-lg text-sm font-medium flex items-center gap-2 transition">
                    <i class="fa-solid fa-cart-shopping"></i>
                    <span id="cartCount" class="bg-amber-500 text-white text-xs px-2 py-0.5 rounded-full font-bold">0</span>
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-6">
        <div class="mb-6 space-y-4">
            <input type="text" id="searchInput" placeholder="Search delicious menu items..." oninput="filterMenu()" class="w-full px-4 py-2.5 border border-gray-300 rounded-xl focus:outline-none focus:ring-2 focus:ring-indigo-500 text-sm shadow-sm">
            <div id="categoryFilters" class="flex gap-2 overflow-x-auto pb-2 scrollbar-none">
                <button onclick="filterCategory('All')" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold bg-indigo-600 text-white whitespace-nowrap transition shadow-sm">All</button>
                <button onclick="filterCategory('Starters')" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-200 text-gray-700 whitespace-nowrap transition shadow-sm">Starters</button>
                <button onclick="filterCategory('Mains')" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-200 text-gray-700 whitespace-nowrap transition shadow-sm">Mains</button>
                <button onclick="filterCategory('Beverages')" class="category-btn px-4 py-1.5 rounded-full text-xs font-bold bg-gray-200 text-gray-700 whitespace-nowrap transition shadow-sm">Beverages</button>
            </div>
        </div>

        <div id="menuGrid" class="grid grid-cols-1 sm:grid-cols-2 gap-4">
            </div>
    </main>

    <div id="cartModal" class="fixed inset-0 bg-black/50 z-50 hidden flex justify-end backdrop-blur-xs">
        <div class="bg-white w-full max-w-md h-full flex flex-col shadow-2xl">
            <div class="p-4 bg-indigo-600 text-white flex justify-between items-center">
                <h2 class="font-bold text-base">Your Active Cart</h2>
                <button onclick="toggleCart()" class="text-white hover:text-indigo-200"><i class="fa-solid fa-xmark text-xl"></i></button>
            </div>
            <div id="cartItems" class="flex-1 overflow-y-auto p-4 space-y-3">
                </div>
            <div class="p-4 border-t border-gray-200 bg-gray-50 space-y-3">
                <div class="flex justify-between text-base font-bold">
                    <span>Total Amount:</span>
                    <span id="cartTotal" class="text-indigo-600">₹0</span>
                </div>
                <button onclick="proceedToCheckout()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-3 rounded-xl font-bold shadow-md transition">Proceed to UPI Payment</button>
            </div>
        </div>
    </div>

    <div id="upiModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 text-center">
            <h3 class="text-lg font-bold text-gray-900">Scan & Pay via UPI</h3>
            <p class="text-xs text-gray-500">Scan with PhonePe, GPay, or Paytm.</p>
            <div class="flex justify-center bg-gray-50 p-4 rounded-xl border border-gray-100">
                <img id="upiQrImage" src="" alt="UPI QR Code" class="w-48 h-48 object-contain">
            </div>
            <div>
                <p class="text-xs font-semibold text-gray-600">UPI ID: <span class="text-indigo-600 font-mono font-bold">Q227869939@ybl</span></p>
                <p class="text-base font-bold text-gray-900 mt-1">Payable: <span id="upiAmountText" class="text-indigo-600">₹0</span></p>
            </div>
            <div class="space-y-2">
                <a id="upiDeepLink" href="#" class="block w-full bg-amber-500 hover:bg-amber-600 text-white py-3 rounded-xl font-bold text-sm shadow transition">Pay Directly via PhonePe</a>
                <button onclick="confirmOrderPlaced('UPI (PhonePe)')" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white py-2.5 rounded-xl font-bold text-sm shadow transition">I Have Paid / Place Order</button>
                <button onclick="confirmOrderPlaced('Cash')" class="w-full bg-gray-800 hover:bg-gray-900 text-white py-2 rounded-xl font-semibold text-xs transition">Pay Cash at Counter</button>
                <button onclick="closeUpiModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-600 py-2 rounded-xl font-medium text-xs transition">Cancel</button>
            </div>
        </div>
    </div>

    <div id="feedbackModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-base">Rate Your Experience</h3>
                <button onclick="closeFeedbackModal()"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div class="space-y-3">
                <div class="flex justify-center gap-2 py-2" id="starContainer">
                    <i class="fa-solid fa-star text-2xl text-gray-300 cursor-pointer hover:text-amber-400 transition" onclick="setRating(1)"></i>
                    <i class="fa-solid fa-star text-2xl text-gray-300 cursor-pointer hover:text-amber-400 transition" onclick="setRating(2)"></i>
                    <i class="fa-solid fa-star text-2xl text-gray-300 cursor-pointer hover:text-amber-400 transition" onclick="setRating(3)"></i>
                    <i class="fa-solid fa-star text-2xl text-gray-300 cursor-pointer hover:text-amber-400 transition" onclick="setRating(4)"></i>
                    <i class="fa-solid fa-star text-2xl text-gray-300 cursor-pointer hover:text-amber-400 transition" onclick="setRating(5)"></i>
                </div>
                <textarea id="feedbackText" rows="3" placeholder="Tell us about the food quality, service, or ambiance..." class="w-full p-3 border rounded-xl text-xs focus:ring-2 focus:ring-indigo-500 focus:outline-none"></textarea>
                <button onclick="submitFeedback()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white py-2.5 rounded-xl font-bold text-sm shadow">Submit Feedback</button>
            </div>
        </div>
    </div>

    <div id="trackerBanner" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-200 shadow-2xl p-3.5 z-40 hidden">
        <div class="max-w-4xl mx-auto flex justify-between items-center">
            <div>
                <p class="text-[10px] uppercase font-bold text-gray-400 tracking-wider">Live Order Status</p>
                <p id="orderStatusText" class="text-sm font-bold text-indigo-600">Pending</p>
            </div>
            <button onclick="openTrackerModal()" class="bg-indigo-600 hover:bg-indigo-700 text-white px-4 py-2 rounded-xl text-xs font-bold shadow transition">View Full Timeline</button>
        </div>
    </div>

    <div id="trackerModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-base">Live Order Progress</h3>
                <button onclick="closeTrackerModal()"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="trackerTimeline" class="space-y-3 py-2"></div>
            <button onclick="closeTrackerModal()" class="w-full bg-gray-100 hover:bg-gray-200 text-gray-700 py-2.5 rounded-xl font-semibold text-xs">Close Tracker</button>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
            authDomain: "gani-cafe-52066.firebaseapp.com",
            databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "gani-cafe-52066",
            storageBucket: "gani-cafe-52066.appspot.com",
            messagingSenderId: "292009300507",
            appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
            measurementId: "G-F7TXYZBYKY"
        };
        
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
        const db = firebase.firestore();

        // GOOGLE SHEETS WEB APP URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybeSPXR0ud-SIEYb8FWcovCdrZfaDHwvckXrZDcD9yLbeIHcJDqOVmTg4vWioE-cG0/exec";

        const menuItems = [
            { id: 1, name: "Paneer Tikka", category: "Starters", price: 220, inStock: true, image: "https://images.unsplash.com/photo-1567188040759-fb8a883dc6d8?w=300" },
            { id: 2, name: "Veg Spring Rolls", category: "Starters", price: 180, inStock: true, image: "https://images.unsplash.com/photo-1548365328-8c6db32c396d?w=300" },
            { id: 3, name: "Butter Chicken", category: "Mains", price: 350, inStock: true, image: "https://images.unsplash.com/photo-1603894584373-5ac82b2ae398?w=300" },
            { id: 4, name: "Dal Makhani", category: "Mains", price: 240, inStock: true, image: "https://images.unsplash.com/photo-1585937421612-70a008356fbe?w=300" },
            { id: 5, name: "Fresh Lime Soda", category: "Beverages", price: 90, inStock: true, image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=300" },
            { id: 6, name: "Cold Coffee", category: "Beverages", price: 140, inStock: false, image: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=300" }
        ];

        let cart = [];
        let tableNumber = "1";
        let currentRating = 0;

        window.addEventListener('DOMContentLoaded', () => {
            const urlParams = new URLSearchParams(window.location.search);
            const t = urlParams.get('table');
            if (t) tableNumber = t;
            document.getElementById('tableDisplay').innerText = `Table: ${tableNumber}`;
            renderMenu(menuItems);
            loadActiveOrder();
        });

        function renderMenu(items) {
            const grid = document.getElementById('menuGrid');
            grid.innerHTML = '';
            items.forEach(item => {
                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-xs border border-gray-100 overflow-hidden flex flex-col justify-between transition hover:shadow-md">
                        <div>
                            <img src="${item.image}" alt="${item.name}" class="w-full h-36 object-cover ${!item.inStock ? 'grayscale opacity-60' : ''}">
                            <div class="p-3.5">
                                <div class="flex justify-between items-start">
                                    <h3 class="font-bold text-gray-900 text-sm">${item.name}</h3>
                                    <span class="font-bold text-indigo-600 text-sm">₹${item.price}</span>
                                </div>
                                <span class="text-[11px] font-semibold text-gray-400 uppercase">${item.category}</span>
                            </div>
                        </div>
                        <div class="p-3.5 pt-0">
                            ${item.inStock ? `
                                <button onclick="addToCart(${item.id})" class="w-full bg-indigo-50 hover:bg-indigo-100 text-indigo-600 py-2 rounded-xl font-bold text-xs transition">Add to Cart</button>
                            ` : `
                                <span class="block w-full bg-gray-100 text-gray-400 py-2 rounded-xl font-bold text-xs text-center">Out of Stock</span>
                            `}
                        </div>
                    </div>
                `;
            });
        }

        function filterCategory(category) {
            document.querySelectorAll('.category-btn').forEach(btn => {
                btn.classList.remove('bg-indigo-600', 'text-white');
                btn.classList.add('bg-gray-200', 'text-gray-700');
            });
            event.target.classList.remove('bg-gray-200', 'text-gray-700');
            event.target.classList.add('bg-indigo-600', 'text-white');

            const searchTxt = document.getElementById('searchInput').value.toLowerCase();
            let filtered = menuItems;
            if (category !== 'All') filtered = filtered.filter(i => i.category === category);
            if (searchTxt) filtered = filtered.filter(i => i.name.toLowerCase().includes(searchTxt));
            renderMenu(filtered);
        }

        function filterMenu() {
            const searchTxt = document.getElementById('searchInput').value.toLowerCase();
            const activeCategoryBtn = Array.from(document.querySelectorAll('.category-btn')).find(b => b.classList.contains('bg-indigo-600'));
            const activeCategory = activeCategoryBtn ? activeCategoryBtn.innerText : 'All';

            let filtered = menuItems;
            if (activeCategory !== 'All') filtered = filtered.filter(i => i.category === activeCategory);
            filtered = filtered.filter(i => i.name.toLowerCase().includes(searchTxt));
            renderMenu(filtered);
        }

        function addToCart(id) {
            const item = menuItems.find(i => i.id === id);
            const existing = cart.find(i => i.id === id);
            if (existing) existing.qty++;
            else cart.push({ ...item, qty: 1 });
            updateCartUI();
        }

        function updateCartUI() {
            const count = cart.reduce((sum, i) => sum + i.qty, 0);
            document.getElementById('cartCount').innerText = count;

            const itemsContainer = document.getElementById('cartItems');
            itemsContainer.innerHTML = '';
            let total = 0;

            if (cart.length === 0) {
                itemsContainer.innerHTML = '<p class="text-center text-gray-400 py-12 text-sm">Your cart is currently empty.</p>';
            } else {
                cart.forEach(item => {
                    total += item.price * item.qty;
                    itemsContainer.innerHTML += `
                        <div class="flex justify-between items-center bg-gray-50 p-3 rounded-xl border border-gray-100">
                            <div>
                                <h4 class="font-bold text-xs text-gray-800">${item.name}</h4>
                                <p class="text-[11px] text-gray-500">₹${item.price} x ${item.qty}</p>
                            </div>
                            <div class="flex items-center gap-2">
                                <button onclick="changeQty(${item.id}, -1)" class="w-6 h-6 bg-white border rounded-lg font-bold text-xs shadow-xs">-</button>
                                <span class="text-xs font-bold">${item.qty}</span>
                                <button onclick="changeQty(${item.id}, 1)" class="w-6 h-6 bg-white border rounded-lg font-bold text-xs shadow-xs">+</button>
                            </div>
                        </div>
                    `;
                });
            }
            document.getElementById('cartTotal').innerText = `₹${total}`;
        }

        function changeQty(id, delta) {
            const item = cart.find(i => i.id === id);
            if (item) {
                item.qty += delta;
                if (item.qty <= 0) cart = cart.filter(i => i.id !== id);
            }
            updateCartUI();
        }

        function toggleCart() {
            document.getElementById('cartModal').classList.toggle('hidden');
        }

        function proceedToCheckout() {
            if (cart.length === 0) return;
            const total = cart.reduce((sum, i) => sum + (i.price * i.qty), 0);
            const upiId = "Q227869939@ybl";
            const upiUrl = `upi://pay?pa=${upiId}&pn=GaniCafe&am=${total}&cu=INR`;
            const qrApiUrl = `https://api.qrserver.com/v1/create-qr-code/?size=200x200&data=${encodeURIComponent(upiUrl)}`;
            
            document.getElementById('upiQrImage').src = qrApiUrl;
            document.getElementById('upiAmountText').innerText = `₹${total}`;
            document.getElementById('upiDeepLink').href = upiUrl;

            toggleCart();
            document.getElementById('upiModal').classList.remove('hidden');
        }

        function closeUpiModal() {
            document.getElementById('upiModal').classList.add('hidden');
        }

        async function confirmOrderPlaced(paymentMode) {
            closeUpiModal();
            const orderData = {
                orderId: 'ORD-' + Math.floor(1000 + Math.random() * 9000),
                table: tableNumber,
                items: cart,
                total: cart.reduce((sum, i) => sum + (i.price * i.qty), 0),
                status: 'Pending',
                paymentMode: paymentMode,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                date: new Date().toLocaleDateString()
            };

            localStorage.setItem('activeOrder', JSON.stringify(orderData));
            let existingQueue = JSON.parse(localStorage.getItem('kitchenQueue') || '[]');
            existingQueue.unshift(orderData);
            localStorage.setItem('kitchenQueue', JSON.stringify(existingQueue));

            // Sync with Firebase Firestore
            try {
                await db.collection('orders').doc(orderData.orderId).set(orderData);
            } catch (err) {
                console.error("Firebase Sync Error:", err);
            }

            // Sync with Google Sheets
            try {
                await fetch(GOOGLE_SCRIPT_URL, {
                    method: 'POST',
                    mode: 'no-cors',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(orderData)
                });
            } catch (e) {
                console.error("Google Sheets Sync Error:", e);
            }

            cart = [];
            updateCartUI();
            loadActiveOrder();
            alert("Order placed successfully, synced with Firebase and Google Sheets!");
        }

        function loadActiveOrder() {
            const saved = localStorage.getItem('activeOrder');
            if (saved) {
                const order = JSON.parse(saved);
                document.getElementById('trackerBanner').classList.remove('hidden');
                document.getElementById('orderStatusText').innerText = order.status;
            }
        }

        function openTrackerModal() {
            const saved = localStorage.getItem('activeOrder');
            if (!saved) return;
            const order = JSON.parse(saved);
            const timeline = document.getElementById('trackerTimeline');
            
            const statuses = ['Pending', 'Accepted', 'Preparing', 'Ready', 'Billed', 'Cleared'];
            let currentIdx = statuses.indexOf(order.status);
            if (currentIdx === -1) currentIdx = 0;

            timeline.innerHTML = '';
            statuses.forEach((st, idx) => {
                const isPassed = idx <= currentIdx;
                timeline.innerHTML += `
                    <div class="flex items-center gap-3">
                        <div class="w-7 h-7 rounded-full flex items-center justify-center text-xs font-bold ${isPassed ? 'bg-indigo-600 text-white shadow-xs' : 'bg-gray-100 text-gray-400'}">
                            ${idx + 1}
                        </div>
                        <div>
                            <p class="font-bold text-xs ${isPassed ? 'text-gray-900' : 'text-gray-400'}">${st}</p>
                        </div>
                    </div>
                `;
            });

            document.getElementById('trackerModal').classList.remove('hidden');
        }

        function closeTrackerModal() {
            document.getElementById('trackerModal').classList.add('hidden');
        }

        function openFeedbackModal() {
            document.getElementById('feedbackModal').classList.remove('hidden');
        }

        function closeFeedbackModal() {
            document.getElementById('feedbackModal').classList.add('hidden');
        }

        function setRating(stars) {
            currentRating = stars;
            const starIcons = document.querySelectorAll('#starContainer i');
            starIcons.forEach((icon, idx) => {
                if (idx < stars) {
                    icon.classList.remove('text-gray-300');
                    icon.classList.add('text-amber-400');
                } else {
                    icon.classList.remove('text-amber-400');
                    icon.classList.add('text-gray-300');
                }
            });
        }

        async function submitFeedback() {
            const text = document.getElementById('feedbackText').value;
            if (currentRating === 0) {
                alert("Please select a star rating before submitting.");
                return;
            }
            const fb = { rating: currentRating, comment: text, time: new Date().toLocaleString() };
            
            let feedbacks = JSON.parse(localStorage.getItem('customerFeedbacks') || '[]');
            feedbacks.unshift(fb);
            localStorage.setItem('customerFeedbacks', JSON.stringify(feedbacks));

            try {
                await db.collection('feedbacks').add(fb);
            } catch (err) {
                console.error("Firebase Feedback Error:", err);
            }
            
            closeFeedbackModal();
            alert("Thank you for your valuable feedback!");
            document.getElementById('feedbackText').value = '';
            setRating(0);
        }
    </script>
</body>
</html>
