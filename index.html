<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GANI CAFE - Ordering System</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <!-- Firebase Compat SDKs for simple single-file deployment -->
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-50 min-h-screen text-slate-800">

  <!-- NAVIGATION -->
  <nav class="bg-amber-600 text-white p-3 shadow-md flex justify-between items-center sticky top-0 z-50">
    <h1 class="font-black text-xl tracking-widest uppercase">Gani Cafe</h1>
    <div class="flex space-x-1">
      <button onclick="switchView('menu')" class="bg-amber-700 px-3 py-1 text-sm font-bold rounded">Menu</button>
      <button onclick="switchView('kitchen')" class="bg-amber-700 px-3 py-1 text-sm font-bold rounded">Kitchen</button>
      <button onclick="switchView('admin')" class="bg-amber-700 px-3 py-1 text-sm font-bold rounded">Admin</button>
    </div>
  </nav>

  <!-- 1. CUSTOMER VIEW -->
  <div id="view-menu" class="max-w-md mx-auto p-4 pb-24">
    <div class="bg-white p-3 rounded-lg shadow-sm border flex items-center justify-between mb-4">
      <span class="font-bold">Table No:</span>
      <input type="number" id="tableNum" value="1" class="w-16 border rounded text-center p-1 text-amber-600 font-bold">
    </div>
    <div id="menuList" class="space-y-3"></div>
    
    <!-- Active Order Tracker -->
    <div id="activeTracker" class="hidden bg-blue-600 text-white p-4 rounded-lg shadow-xl mb-4 flex justify-between items-center">
      <div>
        <p class="text-xs uppercase text-blue-200 font-bold">Order Status</p>
        <p id="orderStatusText" class="text-lg font-black uppercase">Cooking...</p>
      </div>
    </div>

    <!-- Cart Footer -->
    <div id="cartFooter" class="hidden fixed bottom-0 left-0 right-0 max-w-md mx-auto bg-white p-4 border-t shadow-2xl flex justify-between items-center">
      <div>
        <span class="text-xs text-gray-500">Total</span>
        <span id="cartTotal" class="text-2xl font-black text-amber-600 block">₹0</span>
      </div>
      <button onclick="placeOrder()" class="bg-amber-600 text-white px-6 py-3 rounded-xl font-bold shadow-md active:scale-95">Place Order</button>
    </div>
  </div>

  <!-- 2. KITCHEN VIEW -->
  <div id="view-kitchen" class="hidden max-w-6xl mx-auto p-4">
    <h2 class="text-xl font-black mb-4">Live Kitchen Monitor</h2>
    <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-3 gap-4"></div>
  </div>

  <!-- 3. ADMIN VIEW -->
  <div id="view-admin" class="hidden max-w-2xl mx-auto p-4">
    <div class="bg-white p-4 rounded-lg shadow-sm border mb-4">
      <h3 class="font-bold mb-2">Add New Item</h3>
      <div class="flex space-x-2">
        <input type="text" id="newItemName" placeholder="Item Name" class="border p-2 rounded w-full">
        <input type="number" id="newItemPrice" placeholder="Price" class="border p-2 rounded w-24">
        <button onclick="addItem()" class="bg-emerald-600 text-white px-4 py-2 rounded font-bold">Add</button>
      </div>
    </div>
    <div id="adminList" class="space-y-2"></div>
  </div>

  <script>
    // --- YOUR SPECIFIC FIREBASE CONFIGURATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };
    
    // IMPORTANT: You still need to paste your Google Apps Script URL inside the quotes below!
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/library/d/1HD9e-FLxTT9MQe5tsqn1xPI8VVJw8Sl2ynVgDuPrznzm5Y-71a2FJsIm/1";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    
    let menuData = {};
    let cart = {};
    let myOrderId = localStorage.getItem('gani_order_id');

    // Navigation & Table Parsing
    const urlParams = new URLSearchParams(window.location.search);
    if (urlParams.get('table')) document.getElementById('tableNum').value = urlParams.get('table');
    
    function switchView(view) {
      document.getElementById('view-menu').classList.toggle('hidden', view !== 'menu');
      document.getElementById('view-kitchen').classList.toggle('hidden', view !== 'kitchen');
      document.getElementById('view-admin').classList.toggle('hidden', view !== 'admin');
    }
    if (urlParams.get('view')) switchView(urlParams.get('view'));

    // Menu Sync
    db.ref('menu').on('value', snap => {
      menuData = snap.val() || {};
      renderMenu();
      renderAdmin();
    });

    // CUSTOMER LOGIC
    function renderMenu() {
      const list = document.getElementById('menuList');
      list.innerHTML = '';
      Object.keys(menuData).forEach(id => {
        const item = menuData[id];
        const qty = cart[id] || 0;
        if (!item.in_stock && qty === 0 && document.getElementById('view-menu').classList.contains('hidden') === false) return; 
        
        list.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow-sm border flex justify-between items-center">
            <div>
              <p class="font-bold">${item.name}</p>
              <p class="text-amber-600 font-black">₹${item.price}</p>
              ${!item.in_stock ? '<p class="text-xs text-red-500 font-bold">Out of Stock</p>' : ''}
            </div>
            ${item.in_stock ? `
            <div class="flex items-center space-x-3">
              <button onclick="updateCart('${id}', -1)" class="w-8 h-8 bg-slate-100 rounded-full font-bold">-</button>
              <span class="font-bold w-4 text-center">${qty}</span>
              <button onclick="updateCart('${id}', 1)" class="w-8 h-8 bg-amber-600 text-white rounded-full font-bold">+</button>
            </div>` : ''}
          </div>
        `;
      });
      
      const total = Object.entries(cart).reduce((sum, [id, q]) => sum + (menuData[id].price * q), 0);
      document.getElementById('cartTotal').innerText = '₹' + total;
      document.getElementById('cartFooter').classList.toggle('hidden', total === 0);
    }

    function updateCart(id, change) {
      cart[id] = Math.max(0, (cart[id] || 0) + change);
      if (cart[id] === 0) delete cart[id];
      renderMenu();
    }

    function placeOrder() {
      const orderId = "ORD-" + Math.floor(Math.random() * 900000);
      const items = Object.entries(cart).map(([id, q]) => `${menuData[id].name} (x${q})`).join(', ');
      const total = Object.entries(cart).reduce((sum, [id, q]) => sum + (menuData[id].price * q), 0);
      
      db.ref('orders/' + orderId).set({
        orderId: orderId,
        table: document.getElementById('tableNum').value,
        items: items,
        total: total,
        status: 'pending',
        timestamp: Date.now()
      });
      
      localStorage.setItem('gani_order_id', orderId);
      myOrderId = orderId;
      cart = {};
      renderMenu();
      listenToMyOrder();
    }

    function listenToMyOrder() {
      if (!myOrderId) return;
      db.ref('orders/' + myOrderId).on('value', snap => {
        const order = snap.val();
        if (order) {
          document.getElementById('activeTracker').classList.remove('hidden');
          document.getElementById('orderStatusText').innerText = order.status;
        } else {
          document.getElementById('activeTracker').classList.add('hidden');
          localStorage.removeItem('gani_order_id');
          myOrderId = null;
        }
      });
    }
    listenToMyOrder();

    // KITCHEN LOGIC
    db.ref('orders').on('child_added', () => {
       try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e){}
    });

    db.ref('orders').on('value', snap => {
      const grid = document.getElementById('kitchenGrid');
      grid.innerHTML = '';
      const orders = snap.val() || {};
      
      Object.entries(orders).forEach(([id, order]) => {
        grid.innerHTML += `
          <div class="bg-white p-4 rounded-lg shadow-md border-l-4 ${order.status === 'pending' ? 'border-amber-500' : 'border-blue-500'}">
            <div class="flex justify-between items-center mb-2 border-b pb-2">
              <span class="font-black text-lg">Table ${order.table}</span>
              <span class="text-xs font-bold uppercase bg-slate-100 px-2 py-1 rounded">${order.status}</span>
            </div>
            <p class="font-bold text-sm mb-4">${order.items.replace(/,/g, '<br>')}</p>
            <p class="font-black text-amber-600 mb-2">₹${order.total}</p>
            
            ${order.status === 'pending' ? 
              `<button onclick="updateStatus('${id}', 'cooking')" class="w-full bg-blue-600 text-white py-2 rounded font-bold">Accept</button>` : 
              `<button onclick="completeAndArchive('${id}')" class="w-full bg-emerald-600 text-white py-2 rounded font-bold">Serve & Save Bill</button>`
            }
          </div>
        `;
      });
    });

    function updateStatus(id, status) {
      db.ref('orders/' + id).update({ status: status });
    }

    async function completeAndArchive(id) {
      const orderSnap = await db.ref('orders/' + id).once('value');
      const order = orderSnap.val();
      if (!order) return;
      
      // 1. Send to Google Sheets
      if(GOOGLE_SHEET_URL !== "YOUR_APPS_SCRIPT_WEB_APP_URL") {
        fetch(GOOGLE_SHEET_URL, {
          method: "POST", mode: "no-cors",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify(order)
        });
      }
      
      // 2. Delete from Firebase instantly to keep storage at 0MB
      db.ref('orders/' + id).remove();
    }

    // ADMIN LOGIC
    function renderAdmin() {
      const list = document.getElementById('adminList');
      list.innerHTML = '';
      Object.entries(menuData).forEach(([id, item]) => {
        list.innerHTML += `
          <div class="bg-white p-3 rounded shadow-sm border flex justify-between items-center">
            <div>
              <p class="font-bold">${item.name} - ₹${item.price}</p>
            </div>
            <button onclick="toggleStock('${id}', ${item.in_stock})" class="px-3 py-1 rounded text-xs font-bold ${item.in_stock ? 'bg-emerald-100 text-emerald-800' : 'bg-red-100 text-red-800'}">
              ${item.in_stock ? 'In Stock' : 'Out'}
            </button>
          </div>
        `;
      });
    }

    function addItem() {
      const name = document.getElementById('newItemName').value;
      const price = document.getElementById('newItemPrice').value;
      if (name && price) {
        db.ref('menu').push({ name: name, price: Number(price), in_stock: true });
        document.getElementById('newItemName').value = '';
        document.getElementById('newItemPrice').value = '';
      }
    }

    function toggleStock(id, current) {
      db.ref('menu/' + id).update({ in_stock: !current });
    }
  </script>
</body>
</html>
