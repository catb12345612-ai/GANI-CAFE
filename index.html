<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Order</title>
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
    import { getDatabase, ref, push, onValue } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

    // REPLACE THIS WITH YOUR FIREBASE CONFIG KEYS
    const firebaseConfig = {
      apiKey: "YOUR_API_KEY",
      authDomain: "algani-cafe.firebaseapp.com",
      projectId: "algani-cafe",
      databaseURL: "https://algani-cafe-default-rtdb.firebaseio.com",
      storageBucket: "algani-cafe.appspot.com",
      messagingSenderId: "123456789",
      appId: "1:123456789:web:abcdef"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table') || "0";
    document.title = `Table ${tableNo} Menu`;

    let cart = [];
    let currentOrderId = null;

    window.addToCart = (name, price) => {
      cart.push({ name, price });
      updateCartUI();
    };

    function updateCartUI() {
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('cart-total').innerText = total;
    }

    window.placeOrder = () => {
      if (cart.length === 0) return alert("Select items first!");
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      
      const newOrderRef = push(ref(db, 'orders'), {
        table: tableNo,
        items: cart,
        total: total,
        status: "Pending",
        timestamp: Date.now()
      });

      currentOrderId = newOrderRef.key;
      alert("Order Sent to Kitchen!");
      listenToOrderStatus();
    };

    function listenToOrderStatus() {
      onValue(ref(db, `orders/${currentOrderId}`), (snapshot) => {
        const data = snapshot.val();
        if (!data) return;
        document.getElementById('order-status').innerText = `Status: ${data.status}`;
        
        if (data.status === "Served" || data.status === "Billed") {
          document.getElementById('pay-section').style.display = 'block';
          const upiVpa = "YOUR_UPI_ID@upi"; // Put your GPay/PhonePe UPI ID here
          const upiUrl = `upi://pay?pa=${upiVpa}&pn=AlganiCafe&am=${data.total}&cu=INR`;
          document.getElementById('pay-btn').href = upiUrl;
        }
      });
    }
  </script>
</head>
<body style="font-family:sans-serif; padding:15px; max-width:400px; margin:auto;">
  <h2>Algani Cafe Menu</h2>
  <div id="menu">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>Coffee - ₹100</span>
      <button onclick="addToCart('Coffee', 100)">+ Add</button>
    </div>
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>Sandwich - ₹150</span>
      <button onclick="addToCart('Sandwich', 150)">+ Add</button>
    </div>
  </div>

  <hr>
  <h3>Items in Cart: <span id="cart-count">0</span> | Total: ₹<span id="cart-total">0</span></h3>
  <button onclick="placeOrder()" style="width:100%; padding:12px; background:green; color:white; border:none; font-size:16px;">Send Order to Kitchen</button>

  <h3 id="order-status" style="color:blue; margin-top:20px;"></h3>

  <div id="pay-section" style="display:none; margin-top:20px; border:2px solid green; padding:10px; text-align:center;">
    <h3>Your Meal is Complete!</h3>
    <a id="pay-btn" href="#" style="display:block; padding:12px; background:#007bff; color:white; text-decoration:none; font-weight:bold;">Pay Bill Now</a>
  </div>
</body>
</html>
