<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>POS & Order Terminal</title>
  <style>
    :root {
      --bg: #0f172a; --card: #1e293b; --accent: #3b82f6; --text: #f8fafc;
      --muted: #94a3b8; --border: #334155; --success: #22c55e; --warning: #eab308;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); display: flex; height: 100vh; overflow: hidden; }
    
    .menu-section { flex: 1; padding: 20px; display: flex; flex-direction: column; gap: 15px; overflow-y: auto; }
    .cart-section { width: 420px; background: var(--card); border-left: 1px solid var(--border); display: flex; flex-direction: column; }
    
    .header { display: flex; justify-content: space-between; align-items: center; }
    .search-bar { width: 100%; padding: 10px 14px; background: var(--card); border: 1px solid var(--border); border-radius: 8px; color: #fff; margin-top: 10px; }
    
    .categories { display: flex; gap: 8px; overflow-x: auto; padding-bottom: 5px; }
    .cat-btn { padding: 8px 16px; background: var(--card); border: 1px solid var(--border); border-radius: 20px; color: var(--text); cursor: pointer; white-space: nowrap; }
    .cat-btn.active { background: var(--accent); border-color: var(--accent); }
    
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(180px, 1fr)); gap: 15px; }
    .item-card { background: var(--card); border: 1px solid var(--border); border-radius: 10px; padding: 12px; cursor: pointer; transition: transform 0.1s; }
    .item-card:hover { transform: translateY(-2px); border-color: var(--accent); }
    .item-card h4 { margin-bottom: 5px; }
    .item-card p { color: var(--muted); font-size: 0.85rem; margin-bottom: 10px; }
    .price { font-weight: bold; color: var(--success); }
    
    .cart-header { padding: 20px; border-bottom: 1px solid var(--border); }
    .cart-items { flex: 1; padding: 15px; overflow-y: auto; display: flex; flex-direction: column; gap: 10px; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--bg); padding: 10px; border-radius: 6px; }
    .cart-item-qty { display: flex; align-items: center; gap: 8px; }
    .btn-qty { background: var(--border); border: none; color: #fff; width: 24px; height: 24px; border-radius: 4px; cursor: pointer; }
    
    .cart-footer { padding: 20px; border-top: 1px solid var(--border); background: #131d31; display: flex; flex-direction: column; gap: 10px; }
    .row { display: flex; justify-content: space-between; font-size: 0.9rem; color: var(--muted); }
    .row.total { font-size: 1.2rem; font-weight: bold; color: #fff; border-top: 1px solid var(--border); padding-top: 10px; }
    
    .form-group { display: flex; gap: 8px; margin-bottom: 5px; }
    select, input { background: var(--bg); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; flex: 1; }
    .btn-submit { background: var(--success); border: none; color: #fff; padding: 12px; font-weight: bold; border-radius: 8px; cursor: pointer; width: 100%; }
    .btn-submit:hover { opacity: 0.9; }
    
    .orders-tracker { margin-top: 15px; background: var(--card); padding: 15px; border-radius: 8px; border: 1px solid var(--border); }
    .badge { padding: 3px 8px; border-radius: 12px; font-size: 0.75rem; font-weight: bold; text-transform: uppercase; }
    .badge-Pending { background: var(--warning); color: #000; }
    .badge-Preparing { background: var(--accent); color: #fff; }
    .badge-Ready { background: var(--success); color: #fff; }
    .badge-Completed { background: var(--border); color: var(--muted); }
  </style>
</head>
<body>

  <div class="menu-section">
    <div class="header">
      <h2>POS Ordering Terminal</h2>
      <span id="clock" style="color: var(--muted);"></span>
    </div>
    <input type="text" id="search" class="search-bar" placeholder="Search menu items..." oninput="renderMenu()">
    <div class="categories" id="categoryContainer"></div>
    <div class="grid" id="menuGrid"></div>

    <div class="orders-tracker">
      <h3>Active Order Tracker (Live Updates from Kitchen)</h3>
      <div id="liveTracker" style="margin-top: 10px; display: flex; flex-wrap: wrap; gap: 10px;"></div>
    </div>
  </div>

  <div class="cart-section">
    <div class="cart-header">
      <h3>Current Order</h3>
    </div>
    <div class="cart-items" id="cartContainer"></div>
    <div class="cart-footer">
      <div class="form-group">
        <input type="text" id="tableNo" placeholder="Table # or Customer Name">
        <select id="priority">
          <option value="Normal">Normal Priority</option>
          <option value="High">High Priority</option>
          <option value="VIP">VIP Priority</option>
        </select>
      </div>
      <div class="row"><span>Subtotal</span><span id="subtotalVal">$0.00</span></div>
      <div class="row"><span>Tax (8%)</span><span id="taxVal">$0.00</span></div>
      <div class="row total"><span>Total</span><span id="totalVal">$0.00</span></div>
      <button class="btn-submit" onclick="submitOrder()">Send Order to Kitchen</button>
    </div>
  </div>

  <script>
    const menu = [
      { id: 1, name: "Truffle Burger", category: "Mains", price: 14.99, desc: "Beef patty, truffle mayo, brioche" },
      { id: 2, name: "Margherita Pizza", category: "Mains", price: 12.50, desc: "Fresh basil, mozzarella, tomato" },
      { id: 3, name: "Loaded Fries", category: "Sides", price: 6.99, desc: "Cheddar, bacon bits, jalapenos" },
      { id: 4, name: "Caesar Salad", category: "Sides", price: 8.50, desc: "Romaine, croutons, parmesan" },
      { id: 5, name: "Craft Iced Tea", category: "Drinks", price: 3.50, desc: "House-brewed peach tea" },
      { id: 6, name: "Chocolate Fudge Cake", category: "Desserts", price: 7.00, desc: "Warm cake with vanilla ice cream" }
    ];

    let currentCategory = "All";
    let cart = [];
    const channel = new BroadcastChannel("restaurant_kds");

    function init() {
      renderCategories();
      renderMenu();
      updateClock();
      setInterval(updateClock, 1000);
      listenForKitchenUpdates();
      renderLiveTracker();
    }

    function updateClock() {
      document.getElementById("clock").innerText = new Date().toLocaleTimeString();
    }

    function renderCategories() {
      const cats = ["All", ...new Set(menu.map(i => i.category))];
      document.getElementById("categoryContainer").innerHTML = cats.map(c => `
        <button class="cat-btn ${c === currentCategory ? 'active' : ''}" onclick="setCategory('${c}')">${c}</button>
      `).join("");
    }

    function setCategory(cat) { currentCategory = cat; renderCategories(); renderMenu(); }

    function renderMenu() {
      const query = document.getElementById("search").value.toLowerCase();
      const filtered = menu.filter(item => 
        (currentCategory === "All" || item.category === currentCategory) &&
        item.name.toLowerCase().includes(query)
      );

      document.getElementById("menuGrid").innerHTML = filtered.map(item => `
        <div class="item-card" onclick="addToCart(${item.id})">
          <h4>${item.name}</h4>
          <p>${item.desc}</p>
          <div class="price">$${item.price.toFixed(2)}</div>
        </div>
      `).join("");
    }

    function addToCart(id) {
      const existing = cart.find(i => i.id === id);
      if (existing) { existing.qty++; } 
      else { cart.push({ ...menu.find(i => i.id === id), qty: 1, notes: "" }); }
      renderCart();
    }

    function updateQty(id, delta) {
      const idx = cart.findIndex(i => i.id === id);
      if (idx > -1) {
        cart[idx].qty += delta;
        if (cart[idx].qty <= 0) cart.splice(idx, 1);
      }
      renderCart();
    }

    function renderCart() {
      const container = document.getElementById("cartContainer");
      if (cart.length === 0) {
        container.innerHTML = `<div style="text-align:center; color: var(--muted); margin-top: 40px;">Cart is empty</div>`;
      } else {
        container.innerHTML = cart.map(item => `
          <div class="cart-item">
            <div>
              <strong>${item.name}</strong>
              <div style="font-size: 0.8rem; color: var(--muted);">$${(item.price * item.qty).toFixed(2)}</div>
            </div>
            <div class="cart-item-qty">
              <button class="btn-qty" onclick="updateQty(${item.id}, -1)">-</button>
              <span>${item.qty}</span>
              <button class="btn-qty" onclick="updateQty(${item.id}, 1)">+</button>
            </div>
          </div>
        `).join("");
      }

      const subtotal = cart.reduce((acc, i) => acc + (i.price * i.qty), 0);
      const tax = subtotal * 0.08;
      document.getElementById("subtotalVal").innerText = `$${subtotal.toFixed(2)}`;
      document.getElementById("taxVal").innerText = `$${tax.toFixed(2)}`;
      document.getElementById("totalVal").innerText = `$${(subtotal + tax).toFixed(2)}`;
    }

    function submitOrder() {
      if (cart.length === 0) return alert("Cart is empty!");
      const table = document.getElementById("tableNo").value.trim() || "Takeout";
      const priority = document.getElementById("priority").value;

      const order = {
        id: "ORD-" + Math.floor(1000 + Math.random() * 9000),
        table: table,
        priority: priority,
        items: [...cart],
        status: "Pending",
        timestamp: Date.now()
      };

      const orders = JSON.parse(localStorage.getItem("kds_orders") || "[]");
      orders.push(order);
      localStorage.setItem("kds_orders", JSON.stringify(orders));

      channel.postMessage({ type: "NEW_ORDER", order });
      
      cart = [];
      document.getElementById("tableNo").value = "";
      renderCart();
      renderLiveTracker();
      playChime(440);
    }

    function listenForKitchenUpdates() {
      channel.onmessage = (e) => {
        if (e.data.type === "STATUS_UPDATE" || e.data.type === "NEW_ORDER") {
          renderLiveTracker();
          if (e.data.type === "STATUS_UPDATE" && e.data.status === "Ready") playChime(880);
        }
      };
      window.addEventListener("storage", renderLiveTracker);
    }

    function renderLiveTracker() {
      const orders = JSON.parse(localStorage.getItem("kds_orders") || "[]");
      const active = orders.slice(-6).reverse();
      document.getElementById("liveTracker").innerHTML = active.map(o => `
        <div style="background: var(--bg); padding: 8px 12px; border-radius: 6px; border: 1px solid var(--border);">
          <strong>${o.id}</strong> (${o.table}) - <span class="badge badge-${o.status}">${o.status}</span>
        </div>
      `).join("");
    }

    function playChime(freq) {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = "sine";
        osc.frequency.value = freq;
        osc.connect(gain);
        gain.connect(ctx.destination);
        osc.start();
        gain.gain.exponentialRampToValueAtTime(0.00001, ctx.currentTime + 0.5);
      } catch (e) {}
    }

    init();
  </script>
</body>
</html>
