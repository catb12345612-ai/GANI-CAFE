<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Menu & Ordering</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --gold: #d97706; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text: #f8fafc; --text-muted: #94a3b8; --green: #10b981; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    header { background: var(--card-bg); padding: 15px 25px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 15px; text-align: center; }
    .card img { width: 80px; height: 80px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 8px 16px; border-radius: 6px; font-weight: bold; cursor: pointer; }
    .cart-section { background: var(--card-bg); padding: 20px; border-radius: 12px; margin-top: 25px; border: 1px solid rgba(255,255,255,0.08); }
  </style>
</head>
<body>
  <header>
    <h1>Gani Cafe Menu</h1>
    <div>Table: <input type="number" id="table-num" value="1" style="width: 50px; padding: 5px; background:#1e293b; color:#fff; border:1px solid rgba(255,255,255,0.2); border-radius:4px;"></div>
  </header>
  <div id="menu-container" class="menu-grid"></div>
  <div class="cart-section">
    <h3>Your Order Cart</h3>
    <ul id="cart-list" style="padding-left: 20px;"></ul>
    <p><strong>Total: ₹<span id="cart-total">0</span></strong></p>
    <button class="btn" onclick="placeOrder()">Place Order</button>
  </div>
  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW45oIWKrKEn523lxN2oWY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.appspot.com",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    let cart = {};
    let menuItems = {};

    db.ref('menu').on('value', snap => {
      menuItems = snap.val() || {};
      let container = document.getElementById('menu-container');
      container.innerHTML = '';
      Object.keys(menuItems).forEach(id => {
        let item = menuItems[id];
        if (item.inStock !== false) {
          container.innerHTML += `
            <div class="card">
              <img src="${item.img}" alt="${item.name}">
              <h4>${item.name}</h4>
              <p>₹${item.price}</p>
              <button class="btn" onclick="addToCart('${id}')">Add to Cart</button>
            </div>`;
        }
      });
    });

    function addToCart(id) {
      cart[id] = (cart[id] || 0) + 1;
      updateCartUI();
    }

    function updateCartUI() {
      let list = document.getElementById('cart-list');
      let totalEl = document.getElementById('cart-total');
      list.innerHTML = '';
      let total = 0;
      Object.keys(cart).forEach(id => {
        let qty = cart[id];
        let item = menuItems[id];
        if (item && qty > 0) {
          total += item.price * qty;
          list.innerHTML += `<li>${qty}x ${item.name} - ₹${item.price * qty}</li>`;
        }
      });
      totalEl.innerText = total;
    }

    function placeOrder() {
      let table = document.getElementById('table-num').value;
      let items = [];
      let total = 0;
      Object.keys(cart).forEach(id => {
        let qty = cart[id];
        let item = menuItems[id];
        if (item && qty > 0) {
          items.push(`${qty}x ${item.name}`);
          total += item.price * qty;
        }
      });
      if (items.length === 0) { alert('Cart is empty'); return; }
      db.ref('orders').push({
        table: table,
        items: items,
        total: total,
        status: 'Pending',
        paymentStatus: 'Unpaid',
        paymentMode: 'UPI',
        timestamp: Date.now()
      });
      alert('Order placed successfully!');
      cart = {};
      updateCartUI();
    }
  </script>
</body>
</html>
