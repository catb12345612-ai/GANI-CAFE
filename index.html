<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030712">
<title>GANI CAFE — Order</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;
  background:#030712;
  color:#e5e7eb;
  font-family:Inter,system-ui,sans-serif
}
.card{
  background:rgba(17,24,39,.72);
  border:1px solid rgba(255,255,255,.08);
  box-shadow:0 20px 60px rgba(0,0,0,.25)
}
.item{
  background:rgba(31,41,55,.45);
  border:1px solid rgba(255,255,255,.07);
}
.status{
  display:inline-block;
  padding:5px 9px;
  border-radius:8px;
  font-size:10px;
  font-weight:800;
  border:1px solid rgba(255,255,255,.12)
}
</style>
</head>

<body>

<div class="max-w-6xl mx-auto p-4 sm:p-6">

<header class="card rounded-3xl p-5 mb-6 flex justify-between items-center">
  <div>
    <h1 class="text-2xl sm:text-3xl font-black">GANI CAFE</h1>
    <p class="text-[10px] text-slate-500 tracking-[.25em] uppercase">
      Customer Ordering
    </p>
  </div>

  <div class="text-right">
    <div class="text-[9px] text-slate-500 uppercase">Table</div>
    <div id="tableDisplay" class="text-xl font-black text-amber-400">—</div>
  </div>
</header>

<div id="toast"
class="fixed top-5 right-5 z-50 hidden card rounded-xl px-4 py-3 text-sm">
</div>

<div class="grid lg:grid-cols-3 gap-5">

<!-- MENU -->
<section class="lg:col-span-2">

<div class="mb-4">
  <h2 class="text-xl font-black">Menu</h2>
  <p class="text-xs text-slate-500">
    Select your items and send your order to the kitchen.
  </p>
</div>

<div id="menu" class="grid sm:grid-cols-2 gap-4"></div>

</section>

<!-- CART -->
<aside>

<div class="card rounded-3xl p-5 sticky top-4">

<div class="flex justify-between items-center mb-4">
  <h2 class="font-black">Your Order</h2>
  <span id="cartCount"
  class="text-xs bg-amber-500 text-black px-2 py-1 rounded-lg font-black">
  0
  </span>
</div>

<div id="cart" class="space-y-2 max-h-80 overflow-auto"></div>

<div class="border-t border-slate-800 mt-4 pt-4 flex justify-between">
  <span class="text-xs text-slate-500">TOTAL</span>
  <strong class="text-xl text-amber-400">
    ₹<span id="cartTotal">0</span>
  </strong>
</div>

<select id="paymentMode"
class="w-full mt-4 bg-slate-950 border border-slate-700 rounded-xl px-3 py-3 text-sm">
<option value="Cash">Cash</option>
<option value="UPI">UPI</option>
</select>

<button
onclick="placeOrder()"
class="w-full mt-3 py-3.5 rounded-xl bg-amber-500 text-black font-black uppercase">
SEND ORDER
</button>

</div>

<!-- LIVE STATUS -->
<div class="card rounded-3xl p-5 mt-5">

<h2 class="font-black mb-1">Live Order Status</h2>

<p class="text-[10px] text-slate-500 mb-4">
Your order remains visible until the bill is cleared.
</p>

<div id="orders" class="space-y-3">
<p class="text-xs text-slate-600">No active orders.</p>
</div>

</div>

</aside>

</div>
</div>

<script>

const firebaseConfig={
 apiKey:"AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
 authDomain:"gani-cafe-52066.firebaseapp.com",
 databaseURL:"https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"gani-cafe-52066",
 storageBucket:"gani-cafe-52066.firebasestorage.app",
 messagingSenderId:"292009300507",
 appId:"1:292009300507:web:cf524330c2ff4ef4e39ebe",
 measurementId:"G-F7TXYZBYKY"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let uid=null;
let menuItems={};
let cart={};
let orders={};

/* TABLE FROM QR
   Example:
   index.html?table=5
*/
const params=new URLSearchParams(location.search);

let table=Number(params.get("table"));

if(!Number.isInteger(table)||table<1){
  table=1;
}

document.getElementById("tableDisplay").textContent=table;

const DEFAULT_MENU=[
 {
  id:"tea",
  name:"Irani Tea",
  price:25,
  img:"https://images.unsplash.com/photo-1571934811356-5cc061b6821f?w=600"
 },
 {
  id:"coffee",
  name:"Hot Coffee",
  price:40,
  img:"https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?w=600"
 },
 {
  id:"sandwich",
  name:"Veg Sandwich",
  price:80,
  img:"https://images.unsplash.com/photo-1528735602780-2552fd46c7af?w=600"
 },
 {
  id:"burger",
  name:"Cafe Burger",
  price:120,
  img:"https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=600"
 }
];

function esc(v){
 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));
}

function money(v){
 return "₹"+Number(v||0).toLocaleString("en-IN");
}

function toast(message,success=true){

 const el=document.getElementById("toast");

 el.textContent=message;

 el.className=
 "fixed top-5 right-5 z-50 card rounded-xl px-4 py-3 text-sm "+
 (success?"text-emerald-300":"text-rose-300");

 el.classList.remove("hidden");

 setTimeout(()=>{
  el.classList.add("hidden");
 },3000);
}

function statusStyle(status){

 const styles={
  Pending:"text-rose-300 border-rose-500/40 bg-rose-500/10",
  Accepted:"text-sky-300 border-sky-500/40 bg-sky-500/10",
  Preparing:"text-amber-300 border-amber-500/40 bg-amber-500/10",
  Ready:"text-emerald-300 border-emerald-500/40 bg-emerald-500/10",
  Served:"text-violet-300 border-violet-500/40 bg-violet-500/10",
  Completed:"text-slate-300 border-slate-500/40 bg-slate-500/10"
 };

 return styles[status]||"text-slate-300 border-slate-700";
}

function renderMenu(){

 const list=Object.values(menuItems)
 .filter(x=>x&&x.inStock!==false);

 document.getElementById("menu").innerHTML=list.map(item=>{

  const qty=cart[item.id]||0;

  return `
  <article class="item rounded-2xl p-4">

    <div class="flex gap-3 mb-4">

      <img
      src="${esc(item.img||"")}"
      class="w-20 h-20 rounded-xl object-cover bg-slate-900"
      onerror="this.style.display='none'">

      <div class="min-w-0">
        <h3 class="font-black truncate">${esc(item.name)}</h3>
        <p class="text-amber-400 font-bold mt-1">
          ${money(item.price)}
        </p>
      </div>

    </div>

    ${
      qty>0
      ?
      `
      <div class="flex items-center justify-between bg-slate-950 rounded-xl p-1">

        <button
        onclick="changeQty('${esc(item.id)}',-1)"
        class="w-10 h-10 rounded-lg bg-slate-800">
        −
        </button>

        <strong>${qty}</strong>

        <button
        onclick="changeQty('${esc(item.id)}',1)"
        class="w-10 h-10 rounded-lg bg-slate-800">
        +
        </button>

      </div>
      `
      :
      `
      <button
      onclick="changeQty('${esc(item.id)}',1)"
      class="w-full py-3 rounded-xl bg-slate-800 hover:bg-amber-500 hover:text-black font-bold">
      ADD TO ORDER
      </button>
      `
    }

  </article>
  `;

 }).join("");

}

function changeQty(id,amount){

 cart[id]=Math.max(0,(cart[id]||0)+amount);

 if(cart[id]===0){
  delete cart[id];
 }

 renderMenu();
 renderCart();
}

function renderCart(){

 let total=0;
 let count=0;

 const html=Object.entries(cart).map(([id,qty])=>{

  const item=menuItems[id];

  if(!item)return "";

  const subtotal=Number(item.price)*qty;

  total+=subtotal;
  count+=qty;

  return `
  <div class="flex justify-between bg-slate-950/70 rounded-xl p-3">

    <span class="text-xs">
      ${esc(item.name)} × ${qty}
    </span>

    <strong class="text-xs text-amber-400">
      ${money(subtotal)}
    </strong>

  </div>
  `;

 }).join("");

 document.getElementById("cart").innerHTML=
 html||
 `<p class="text-xs text-slate-600 text-center py-6">
 Cart is empty.
 </p>`;

 document.getElementById("cartTotal").textContent=
 total.toLocaleString("en-IN");

 document.getElementById("cartCount").textContent=count;
}

function getCartPayload(){

 let items=[];
 let total=0;

 Object.entries(cart).forEach(([id,qty])=>{

  const item=menuItems[id];

  if(!item||qty<1)return;

  const price=Number(item.price)||0;

  items.push({
   id:item.id,
   name:item.name,
   qty:qty,
   unitPrice:price,
   subtotal:price*qty
  });

  total+=price*qty;

 });

 return {items,total};
}

async function placeOrder(){

 if(!uid){
  toast("Connecting to cafe system...",false);
  return;
 }

 const payload=getCartPayload();

 if(payload.items.length===0){
  toast("Your cart is empty.",false);
  return;
 }

 const orderRef=db.ref("orders").push();

 const order={
  orderId:orderRef.key,
  table:table,
  items:payload.items,
  total:payload.total,

  status:"Pending",

  paymentStatus:"Pending",

  paymentMode:
   document.getElementById("paymentMode").value,

  createdAt:
   firebase.database.ServerValue.TIMESTAMP,

  createdBy:uid,

  lastUpdatedAt:
   firebase.database.ServerValue.TIMESTAMP,

  clearance:{
   cleared:false
  }
 };

 try{

  await orderRef.set(order);

  cart={};

  renderMenu();
  renderCart();

  toast("Order sent to kitchen.");

 }catch(error){

  console.error(error);

  toast("Could not place order.",false);
 }
}

function renderOrders(){

 const mine=Object.values(orders)
 .filter(order=>
  order &&
  uid &&
  order.createdBy===uid &&
  Number(order.table)===Number(table) &&
  order.clearance?.cleared!==true
 )
 .sort((a,b)=>
  (b.createdAt||0)-(a.createdAt||0)
 );

 if(!mine.length){

  document.getElementById("orders").innerHTML=
  `<p class="text-xs text-slate-600 text-center py-6">
  No active orders.
  </p>`;

  return;
 }

 document.getElementById("orders").innerHTML=
 mine.map(order=>`

 <div class="item rounded-2xl p-4">

   <div class="flex justify-between gap-3">

     <div>
       <b class="font-mono text-xs">
       #${esc(order.orderId.slice(-6))}
       </b>

       <p class="text-[10px] text-slate-500">
       Table ${esc(order.table)}
       </p>
     </div>

     <span class="status ${statusStyle(order.status)}">
       ${esc(order.status)}
     </span>

   </div>

   <div class="mt-3 space-y-1">

   ${order.items.map(item=>`

     <div class="flex justify-between text-xs">
       <span>
       ${esc(item.name)} × ${item.qty}
       </span>

       <span>
       ${money(item.subtotal)}
       </span>
     </div>

   `).join("")}

   </div>

   <div class="border-t border-slate-800 mt-3 pt-3 flex justify-between">

     <span class="text-xs text-slate-500">
     BILL
     </span>

     <strong class="text-amber-400">
     ${money(order.total)}
     </strong>

   </div>

   <div class="mt-3 text-[10px] text-slate-500">

   Payment:
   <span class="${
    order.paymentStatus==="Paid"
    ?"text-emerald-400"
    :"text-cyan-400"
   }">
   ${esc(order.paymentStatus)}
   </span>

   </div>

   <div class="mt-3 text-[10px] text-slate-600">
   Bill remains active until staff clears it.
   </div>

 </div>

 `).join("");
}

/* CUSTOMER LOGIN */

auth.signInAnonymously()
.catch(error=>{
 console.error(error);
});

/* AUTH STATE */

auth.onAuthStateChanged(user=>{

 uid=user?user.uid:null;

 renderOrders();

});

/* MENU */

db.ref("menu").on("value",snapshot=>{

 const data=snapshot.val();

 if(data && Object.keys(data).length){
  menuItems=data;
 }else{

  menuItems={};

  DEFAULT_MENU.forEach(item=>{
   menuItems[item.id]=item;
  });

 }

 renderMenu();
 renderCart();

});

/* ORDERS */

db.ref("orders").on("value",snapshot=>{

 orders=snapshot.val()||{};

 renderOrders();

});

renderCart();

</script>

</body>
</html>
