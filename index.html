<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Gani Cafe - Digital Menu & Table Ordering</title>
  <!-- Firebase SDKs (Compat v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { 
      --gold: #d97706; 
      --gold-light: #fbbf24;
      --bg: #07090e; 
      --card-bg: rgba(13, 17, 28, 0.95); 
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
      --green: #10b981; 
      --red: #ef4444; 
      --orange: #f97316; 
      --blue: #0ea5e9; 
      --yellow: #eab308;
      --phonepe: #5f259f;
      --accent-gradient: linear-gradient(135deg, #d97706 0%, #fbbf24 50%, #f59e0b 100%);
      --phonepe-gradient: linear-gradient(135deg, #5f259f 0%, #7b3fe4 100%);
      --luxury-border: 1px solid rgba(217, 119, 6, 0.25);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; padding-bottom: 90px; }

    header { background: rgba(13, 17, 28, 0.95); backdrop-filter: blur(20px); padding: 16px 20px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    header h1 { margin: 0; font-size: 16px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; text-transform: uppercase; letter-spacing: -0.5px; }
    
    .table-badge { background: rgba(217,119,6,0.15); border: 1px solid rgba(217,119,6,0.3); color: var(--gold-light); padding: 6px 12px; border-radius: 20px; font-size: 12px; font-weight: 900; }

    .container { max-width: 600px; margin: 0 auto; padding: 16px; }

    /* Category & Menu Styles */
    .section-title { font-size: 15px; font-weight: 900; color: var(--gold-light); margin: 20px 0 12px 0; text-transform: uppercase; letter-spacing: 0.5px; }
    
    .menu-grid { display: grid; grid-template-columns: 1fr; gap: 12px; }
    .menu-item-card { background: var(--card-bg); border: var(--luxury-border); border-radius: 18px; padding: 16px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 8px 25px rgba(0,0,0,0.4); }
    .menu-item-info { flex: 1; padding-right: 12px; }
    .menu-item-name { font-size: 15px; font-weight: 800; color: #fff; margin-bottom: 4px; }
    .menu-item-price { font-size: 14px; font-weight: 900; color: var(--gold-light); }
    .menu-item-stock { font-size: 10px; font-weight: 800; color: var(--red); margin-top: 4px; text-transform: uppercase; }

    .add-btn { background: var(--accent-gradient); color: #000; border: none; padding: 10px 18px; border-radius: 12px; font-weight: 900; font-size: 12px; cursor: pointer; box-shadow: 0 4px 15px rgba(217,119,6,0.3); transition: transform 0.1s; }
    .add-btn:active { transform: scale(0.95); }
    .add-btn:disabled { background: #334155; color: var(--text-muted); cursor: not-allowed; box-shadow: none; }

    /* Floating Cart Bar */
    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(13, 17, 28, 0.98); backdrop-filter: blur(20px); border-top: 1px solid rgba(255,255,255,0.1); padding: 16px 20px; display: flex; justify-content: space-between; align-items: center; z-index: 200; box-shadow: 0 -10px 30px rgba(0,0,0,0.8); transform: translateY(100%); transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .cart-bar.visible { transform: translateY(0); }
    .cart-total-text { font-size: 12px; color: var(--text-muted); font-weight: 700; }
    .cart-total-amount { font-size: 18px; font-weight: 900; color: #fff; }
    .view-cart-btn { background: var(--accent-gradient); color: #000; border: none; padding: 12px 24px; border-radius: 14px; font-weight: 900; font-size: 13px; cursor: pointer; text-transform: uppercase; letter-spacing: 0.5px; box-shadow: 0 6px 20px rgba(217,119,6,0.4); }

    /* Cart Modal / Checkout Screen */
    .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85); backdrop-filter: blur(10px); z-index: 300; display: none; justify-content: center; align-items: flex-end; }
    .modal-overlay.active { display: flex; }
    .modal-content { background: var(--card-bg); border-top: 2px solid var(--gold); width: 100%; max-width: 600px; max-height: 90vh; border-radius: 24px 24px 0 0; padding: 24px; overflow-y: auto; animation: slideUp 0.3s cubic-bezier(0.16, 1, 0.3, 1); }

    @keyframes slideUp { from { transform: translateY(100%); } to { transform: translateY(0); } }

    .cart-item-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid rgba(255,255,255,0.06); font-size: 14px; font-weight: 700; }
    .qty-controls { display: flex; align-items: center; gap: 10px; background: rgba(255,255,255,0.05); padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.1); }
    .qty-btn { background: none; border: none; color: #fff; font-size: 16px; font-weight: 900; cursor: pointer; padding: 0 4px; }

    /* Payment Option Cards */
    .payment-options { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; margin: 20px 0; }
    .payment-card { background: rgba(255,255,255,0.03); border: 1px solid rgba(255,255,255,0.1); border-radius: 14px; padding: 14px; text-align: center; cursor: pointer; font-weight: 800; font-size: 12px; color: var(--text-muted); transition: all 0.2s; }
    .payment-card.selected { background: rgba(95, 37, 159, 0.25); border-color: #7b3fe4; color: #fff; box-shadow: 0 4px 15px rgba(95,37,159,0.3); }
    .payment-card.phonepe-opt { border-color: rgba(95, 37, 159, 0.5); }

    .checkout-btn { width: 100%; background: var(--phonepe-gradient); color: #fff; border: none; padding: 16px; border-radius: 16px; font-weight: 900; font-size: 14px; text-transform: uppercase; letter-spacing: 0.5px; cursor: pointer; box-shadow: 0 10px 25px rgba(95,37,159,0.5); margin-top: 10px; }

    /* Live Order Tracker Screen */
    .tracker-card { background: var(--card-bg); border: var(--luxury-border); border-radius: 24px; padding: 24px; box-shadow: 0 15px 40px rgba(0,0,0,0.6); margin-top: 20px; text-align: center; }
    .status-pill { display: inline-block; padding: 8px 20px; border-radius: 20px; font-size: 12px; font-weight: 900; text-transform: uppercase; letter-spacing: 1px; margin-bottom: 16px; }
    .status-Pending { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.4); }
    .status-Accepted { background: rgba(14, 165, 233, 0.15); color: var(--blue); border: 1px solid rgba(14, 165, 233, 0.4); }
    .status-Preparing { background: rgba(249, 115, 22, 0.15); color: var(--orange); border: 1px solid rgba(249, 115, 22, 0.4); }
    .status-Ready { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.4); }
    .status-Billed { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border: 1px solid rgba(234, 179, 8, 0.4); }
    .status-Cleared { background: rgba(16, 185, 129, 0.25); color: var(--green); border: 1px solid var(--green); }
    .status-Issue { background: rgba(239, 68, 68, 0.25); color: var(--red); border: 1px solid var(--red); }

    .phonepe-pay-box { background: rgba(95, 37, 159, 0.15); border: 1px solid rgba(95, 37, 159, 0.4); border-radius: 16px; padding: 16px; margin: 16px 0; text-align: left; }
    .phonepe-btn { display: block; width: 100%; background: #5f259f; color: #fff; text-decoration: none; padding: 14px; border-radius: 12px; font-weight: 900; font-size: 13px; text-align: center; margin-top: 12px; box-shadow: 0 4px 15px rgba(95,37,159,0.4); }

    .toast { position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-30px); background: var(--green); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 900; font-size: 13px; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 400; pointer-events: none; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    .empty-state { text-align: center; padding: 40px 20px; color: var(--text-muted); font-size: 14px; font-weight: 700; }
  </style>
</head>
<body>

  <header>
    <h1>🔥 Gani Cafe</h1>
    <div class="table-badge" id="table-display">Table #1</div>
  </header>

  <div class="container" id="main-view-container">
    <!-- Dynamic Content: Menu or Active Order Tracker -->
    <div id="menu-view">
      <div class="section-title">Explore Menu & Specialties</div>
      <div class="menu-grid" id="customer-menu-grid">
        <div class="empty-state">Loading delicious menu items...</div>
      </div>
    </div>

    <div id="tracker-view" style="display: none;">
      <div class="tracker-card" id="tracker-card-content">
        <!-- Live status populated via JS -->
      </div>
    </div>
  </div>

  <!-- FLOATING CART BAR -->
  <div class="cart-bar" id="cart-bar" onclick="openCartModal()">
    <div>
      <div class="cart-total-text" id="cart-item-count">0 items selected</div>
      <div class="cart-total-amount" id="cart-total-price">₹0</div>
    </div>
    <button class="view-cart-btn">View Cart & Pay</button>
  </div>

  <!-- CART & CHECKOUT MODAL -->
  <div class="modal-overlay" id="cartModal">
    <div class="modal-content">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px;">
        <h3 style="margin: 0; font-size: 18px; color: var(--gold-light);">Your Order Summary</h3>
        <button onclick="closeCartModal()" style="background:none; border:none; color:var(--text-muted); font-size:18px; font-weight:900; cursor:pointer;">✕</button>
      </div>
      
      <div id="cart-items-list" style="max-height: 250px; overflow-y: auto; margin-bottom: 20px;"></div>

      <div style="font-size: 13px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px;">Select Payment Mode</div>
      <div class="payment-options">
        <div class="payment-card phonepe-opt selected" id="pay-phonepe" onclick="selectPayment('PhonePe UPI')">
          📱 PhonePe / UPI
        </div>
        <div class="payment-card" id="pay-cash" onclick="selectPayment('Cash at Counter')">
          💵 Cash at Table
        </div>
      </div>

      <button class="checkout-btn" onclick="placeOrder()">Place Order & Pay via PhonePe</button>
    </div>
  </div>

  <div class="toast" id="toast-notification">Item added to cart!</div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };

    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // Get Table from URL or default to 1
    const urlParams = new URLSearchParams(window.location.search);
    const tableNumber = urlParams.get('table') || '1';
    document.getElementById('table-display').innerText = `Table #${tableNumber}`;

    let menuCatalog = {};
    let cart = {};
    let selectedPaymentMode = 'PhonePe UPI';
    let activeOrderId = localStorage.getItem('gani_active_order_id');

    window.addEventListener('DOMContentLoaded', () => {
      if (activeOrderId) {
        monitorActiveOrder(activeOrderId);
      } else {
        loadMenu();
      }
    });

    // --- LOAD MENU FROM FIREBASE ---
    function loadMenu() {
      db.ref('menu').on('value', (snapshot) => {
        const data = snapshot.val();
        const grid = document.getElementById('customer-menu-grid');
        if (!data) {
          grid.innerHTML = `<div class="empty-state">Menu is currently updating. Please check back shortly.</div>`;
          return;
        }

        menuCatalog = data;
        let html = '';
        Object.keys(data).forEach(itemId => {
          const item = data[itemId];
          const inStock = item.inStock !== false;
          
          html += `
            <div class="menu-item-card">
              <div class="menu-item-info">
                <div class="menu-item-name">${escapeHtml(item.name)}</div>
                <div class="menu-item-price">₹${item.price || 0}</div>
                ${!inStock ? '<div class="menu-item-stock">Out of Stock</div>' : ''}
              </div>
              <button class="add-btn" ${!inStock ? 'disabled' : ''} onclick="addToCart('${itemId}')">
                ${inStock ? '+ ADD' : 'UNAVAILABLE'}
              </button>
            </div>
          `;
        });
        grid.innerHTML = html;
      });
    }

    // --- CART MANAGEMENT ---
    function addToCart(itemId) {
      const item = menuCatalog[itemId];
      if (!item) return;

      if (!cart[itemId]) {
        cart[itemId] = { name: item.name, price: item.price, qty: 1 };
      } else {
        cart[itemId].qty++;
      }

      updateCartUI();
      showToast(`Added ${item.name} to cart`);
    }

    function changeQty(itemId, delta) {
      if (!cart[itemId]) return;
      cart[itemId].qty += delta;
      if (cart[itemId].qty <= 0) {
        delete cart[itemId];
      }
      updateCartUI();
    }

    function updateCartUI() {
      let totalQty = 0;
      let totalPrice = 0;
      let cartHtml = '';

      Object.keys(cart).forEach(itemId => {
        const item = cart[itemId];
        totalQty += item.qty;
        totalPrice += (item.price * item.qty);

        cartHtml += `
          <div class="cart-item-row">
            <div>
              <div>${escapeHtml(item.name)}</div>
              <div style="font-size: 11px; color: var(--gold-light); margin-top: 2px;">₹${item.price * item.qty}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty('${itemId}', -1)">-</button>
              <span>${item.qty}</span>
              <button class="qty-btn" onclick="changeQty('${itemId}', 1)">+</button>
            </div>
          </div>
        `;
      });

      document.getElementById('cart-items-list').innerHTML = cartHtml || `<div class="empty-state">Your cart is empty. Add items from the menu!</div>`;
      document.getElementById('cart-item-count').innerText = `${totalQty} item${totalQty === 1 ? '' : 's'} selected`;
      document.getElementById('cart-total-price').innerText = `₹${totalPrice}`;

      const cartBar = document.getElementById('cart-bar');
      if (totalQty > 0) {
        cartBar.classList.add('visible');
      } else {
        cartBar.classList.remove('visible');
        closeCartModal();
      }
    }

    function openCartModal() {
      document.getElementById('cartModal').classList.add('active');
    }

    function closeCartModal() {
      document.getElementById('cartModal').classList.remove('active');
    }

    function selectPayment(mode) {
      selectedPaymentMode = mode;
      document.getElementById('pay-phonepe').classList.toggle('selected', mode === 'PhonePe UPI');
      document.getElementById('pay-cash').classList.toggle('selected', mode === 'Cash at Counter');
      
      const btn = document.querySelector('.checkout-btn');
      if (mode === 'PhonePe UPI') {
        btn.style.background = 'var(--phonepe-gradient)';
        btn.innerText = 'Place Order & Pay via PhonePe';
      } else {
        btn.style.background = 'var(--accent-gradient)';
        btn.innerText = 'Place Order (Pay Cash)';
        btn.style.color = '#000';
      }
    }

    // --- PLACE ORDER & SYNC WITH KDS ---
    function placeOrder() {
      let itemsArray = [];
      let totalAmount = 0;

      Object.values(cart).forEach(item => {
        itemsArray.push({ name: item.name, price: item.price, qty: item.qty });
        totalAmount += (item.price * item.qty);
      });

      if (itemsArray.length === 0) return;

      const orderData = {
        table: tableNumber,
        items: itemsArray,
        total: totalAmount,
        paymentMode: selectedPaymentMode,
        status: 'Pending',
        timestamp: firebase.database.ServerValue.TIMESTAMP
      };

      const newOrderRef = db.ref('orders').push();
      newOrderRef.set(orderData).then(() => {
        activeOrderId = newOrderRef.key;
        localStorage.setItem('gani_active_order_id', activeOrderId);
        cart = {};
        updateCartUI();
        closeCartModal();
        monitorActiveOrder(activeOrderId);
        showToast("Order placed successfully! Sent to kitchen.");
      });
    }

    // --- LIVE ORDER TRACKING SCREEN ---
    function monitorActiveOrder(orderId) {
      document.getElementById('menu-view').style.display = 'none';
      document.getElementById('cart-bar').classList.remove('visible');
      const trackerContainer = document.getElementById('tracker-view');
      trackerContainer.style.display = 'block';

      db.ref(`orders/${orderId}`).on('value', (snapshot) => {
        const order = snapshot.val();
        if (!order || order.status === 'Cleared') {
          if (order && order.status === 'Cleared') {
            localStorage.removeItem('gani_active_order_id');
            showToast("Bill settled & order completed! Thank you.");
          }
          trackerContainer.innerHTML = `
            <div class="tracker-card">
              <h3 style="color: var(--gold-light);">Order Completed</h3>
              <p style="color: var(--text-muted); font-size: 13px;">Thank you for dining at Gani Cafe! Scan QR again to place a new order.</p>
              <button class="add-btn" style="margin-top: 16px; width: 100%; padding: 14px;" onclick="location.reload()">Place New Order</button>
            </div>
          `;
          return;
        }

        let itemsArray = Array.isArray(order.items) ? order.items : Object.values(order.items || {});
        let itemsHtml = itemsArray.map(i => `<div style="display:flex; justify-content:space-between; padding:6px 0; border-bottom:1px solid rgba(255,255,255,0.04); font-size:13px; font-weight:700;"><span>${i.qty}x ${escapeHtml(i.name)}</span><span>₹${i.price * i.qty}</span></div>`).join('');

        let statusClass = `status-${order.status || 'Pending'}`;
        let statusText = order.status || 'Pending';
        let issueNotice = order.issueReported ? `<div style="background:rgba(239,68,68,0.15); border:1px solid rgba(239,68,68,0.4); padding:10px; border-radius:10px; color:#fca5a5; font-size:12px; margin-top:12px; font-weight:700;">⚠️ Notice: ${escapeHtml(order.issueReported)}</div>` : '';

        let paymentWidget = '';
        if (order.paymentMode && order.paymentMode.toLowerCase().includes('phonepe') && (order.status === 'Billed' || order.status === 'Ready' || order.status === 'Preparing')) {
          let upiLink = `upi://pay?pa=Q227869939@ybl&pn=GaniCafe&am=${order.total}&cu=INR`;
          paymentWidget = `
            <div class="phonepe-pay-box">
              <div style="font-size: 13px; font-weight: 900; color: #b794f4;">📱 PhonePe Fast Checkout</div>
              <div style="font-size: 11px; color: var(--text-muted); margin-top: 4px;">Tap below to pay securely via your PhonePe app.</div>
              <a href="${upiLink}" class="phonepe-btn">Pay ₹${order.total} via PhonePe Now</a>
            </div>
          `;
        }

        document.getElementById('tracker-card-content').innerHTML = `
          <div style="font-size: 11px; color: var(--text-muted); font-weight: 800; margin-bottom: 6px;">ORDER #${orderId.slice(-6).toUpperCase()} • TABLE #${order.table || '1'}</div>
          <div class="status-pill ${statusClass}">${statusText}</div>
          ${issueNotice}
          <div style="margin: 16px 0; text-align: left;">
            <div style="font-size: 12px; font-weight: 800; color: var(--text-muted); margin-bottom: 8px;">Ordered Items:</div>
            ${itemsHtml}
          </div>
          <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: 900; border-top: 1px solid rgba(255,255,255,0.1); padding-top: 12px; margin-top: 12px;">
            <span>Total Amount:</span>
            <span style="color: var(--green);">₹${order.total || 0}</span>
          </div>
          ${paymentWidget}
          <div style="font-size: 11px; color: var(--text-muted); margin-top: 16px;">This live tracker updates automatically as the kitchen prepares your order.</div>
        `;
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => toast.classList.remove('show'), 2500);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;").replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
