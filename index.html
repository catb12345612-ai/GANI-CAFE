<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Premium Digital Menu & Live Billing</title>
  <!-- Firebase SDKs (Compat v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { 
      --gold: #d97706; 
      --bg: #0b0f19; 
      --card-bg: rgba(17, 24, 39, 0.85); 
      --glass-bg: rgba(255, 255, 255, 0.03);
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
      --green: #10b981; 
      --red: #ef4444; 
      --orange: #f97316; 
      --yellow: #eab308;
      --blue: #0ea5e9; 
      --accent-gradient: linear-gradient(135deg, #f97316 0%, #eab308 100%);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; padding-bottom: 120px; min-height: 100vh; overflow-x: hidden; }

    /* Background Ambient VFX Glow */
    body::before {
      content: '';
      position: fixed;
      top: -200px;
      left: 50%;
      transform: translateX(-50%);
      width: 600px;
      height: 400px;
      background: radial-gradient(circle, rgba(217, 119, 6, 0.15) 0%, rgba(11, 15, 25, 0) 70%);
      z-index: -1;
      pointer-events: none;
    }
    
    header { background: rgba(17, 24, 39, 0.9); backdrop-filter: blur(16px); padding: 18px 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.3); }
    header h1 { margin: 0; font-size: 20px; font-weight: 800; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; }
    
    .table-indicator { background: rgba(217, 119, 6, 0.1); border: 1px solid rgba(217, 119, 6, 0.3); color: var(--gold); padding: 6px 14px; border-radius: 20px; font-size: 12px; font-weight: 700; display: flex; align-items: center; gap: 6px; cursor: pointer; transition: all 0.2s; backdrop-filter: blur(4px); }
    .table-indicator:hover { background: rgba(217, 119, 6, 0.2); transform: scale(1.02); }
    
    .container { max-width: 840px; margin: 0 auto; padding: 20px; }

    /* Live Order & Billing Status Tracker Panel */
    .tracker-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 20px; padding: 20px; margin-bottom: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.4); display: none; animation: slideDown 0.4s cubic-bezier(0.16, 1, 0.3, 1); position: relative; overflow: hidden; }
    .tracker-card.active { display: block; }
    .tracker-card::after { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-gradient); }

    .status-steps { display: flex; justify-content: space-between; margin-top: 15px; position: relative; }
    .status-steps::before { content: ''; position: absolute; top: 14px; left: 10%; right: 10%; height: 2px; background: rgba(255,255,255,0.1); z-index: 1; }
    .step { position: relative; z-index: 2; display: flex; flex-direction: column; align-items: center; gap: 6px; font-size: 11px; color: var(--text-muted); font-weight: 600; }
    .step-dot { width: 30px; height: 30px; border-radius: 50%; background: #1e293b; border: 2px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px; transition: all 0.3s; }
    .step.completed .step-dot { background: var(--green); border-color: var(--green); color: #000; box-shadow: 0 0 15px rgba(16, 185, 129, 0.4); }
    .step.active .step-dot { background: var(--orange); border-color: var(--orange); color: #000; animation: pulseGlow 1.5s infinite; }

    /* Category Filter Tabs */
    .categories { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 8px; margin-bottom: 24px; scrollbar-width: none; }
    .categories::-webkit-scrollbar { display: none; }
    .cat-btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.06); color: var(--text-muted); padding: 10px 20px; border-radius: 30px; font-size: 13px; font-weight: 600; cursor: pointer; white-space: nowrap; transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1); backdrop-filter: blur(8px); }
    .cat-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 4px 15px rgba(217, 119, 6, 0.3); transform: translateY(-1px); }

    /* Menu Grid & Cards */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(260px, 1fr)); gap: 18px; }
    .menu-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.06); border-radius: 18px; overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 8px 25px rgba(0,0,0,0.3); transition: transform 0.25s, box-shadow 0.25s; backdrop-filter: blur(10px); }
    .menu-card:hover { transform: translateY(-4px); box-shadow: 0 12px 35px rgba(0,0,0,0.4); border-color: rgba(255,255,255,0.12); }
    
    .menu-img-wrapper { position: relative; width: 100%; height: 150px; overflow: hidden; background: #1e293b; }
    .menu-img { width: 100%; height: 100%; object-fit: cover; transition: transform 0.5s cubic-bezier(0.16, 1, 0.3, 1); }
    .menu-card:hover .menu-img { transform: scale(1.05); }

    .menu-content { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex-grow: 1; }
    .menu-title { font-size: 16px; font-weight: 700; margin: 0; color: #fff; }
    .menu-desc { font-size: 12px; color: var(--text-muted); margin: 0; line-height: 1.5; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
    
    .menu-footer { display: flex; justify-content: space-between; align-items: center; margin-top: 14px; padding-top: 10px; border-top: 1px solid rgba(255,255,255,0.04); }
    .menu-price { font-size: 16px; font-weight: 900; color: var(--green); }

    .btn { background: var(--gold); color: #000; border: none; padding: 9px 18px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 11px; letter-spacing: 0.5px; transition: all 0.2s; box-shadow: 0 4px 12px rgba(217, 119, 6, 0.2); }
    .btn:active { transform: scale(0.95); }
    .btn:hover { filter: brightness(1.15); transform: translateY(-1px); }

    /* Floating Cart Bar */
    .cart-bar { position: fixed; bottom: 20px; left: 20px; right: 20px; max-width: 800px; margin: 0 auto; background: rgba(15, 23, 42, 0.95); backdrop-filter: blur(20px); border: 1px solid rgba(255,255,255,0.12); padding: 16px 24px; border-radius: 20px; display: flex; justify-content: space-between; align-items: center; box-shadow: 0 15px 40px rgba(0,0,0,0.6); z-index: 200; transform: translateY(150%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); }
    .cart-bar.visible { transform: translateY(0); }

    /* Cart Modal / Drawer */
    .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.75); backdrop-filter: blur(8px); z-index: 300; display: none; opacity: 0; transition: opacity 0.3s; }
    .modal-overlay.active { display: block; opacity: 1; }
    
    .cart-drawer { position: fixed; bottom: 0; left: 0; right: 0; background: var(--card-bg); border-top-left-radius: 28px; border-top-right-radius: 28px; max-height: 85vh; z-index: 301; display: flex; flex-direction: column; transform: translateY(100%); transition: transform 0.35s cubic-bezier(0.16, 1, 0.3, 1); border: 1px solid rgba(255,255,255,0.1); box-shadow: 0 -20px 50px rgba(0,0,0,0.6); }
    .cart-drawer.active { transform: translateY(0); }
    
    .cart-header { padding: 22px 24px; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; }
    .cart-body { padding: 20px 24px; overflow-y: auto; display: flex; flex-direction: column; gap: 12px; max-height: 40vh; scrollbar-width: thin; }
    .cart-item { display: flex; justify-content: space-between; align-items: center; background: var(--glass-bg); padding: 12px 16px; border-radius: 14px; border: 1px solid rgba(255,255,255,0.04); }
    .cart-footer { padding: 20px 24px; border-top: 1px solid rgba(255,255,255,0.06); display: flex; flex-direction: column; gap: 14px; background: rgba(11, 15, 25, 0.6); border-bottom-left-radius: 28px; border-bottom-right-radius: 28px; }
    
    .qty-controls { display: flex; align-items: center; gap: 12px; background: rgba(255,255,255,0.06); padding: 6px 12px; border-radius: 10px; }
    .qty-btn { background: none; border: none; color: var(--text); font-weight: 900; cursor: pointer; font-size: 14px; transition: transform 0.1s; }
    .qty-btn:active { transform: scale(1.2); }

    /* Toast Notification */
    .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-30px); background: var(--green); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 800; font-size: 13px; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 400; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); pointer-events: none; }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes pulseGlow {
      0% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0.5); }
      70% { box-shadow: 0 0 0 12px rgba(249, 115, 22, 0); }
      100% { box-shadow: 0 0 0 0 rgba(249, 115, 22, 0); }
    }
    @keyframes slideDown {
      from { opacity: 0; transform: translateY(-15px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>☕ GANI CAFE</h1>
    <div class="table-indicator" onclick="promptTableChange()">
      <span>📍 Table <span id="display-table">1</span></span>
    </div>
  </header>

  <div class="container">
    
    <!-- Live Order & Billing Status Tracker Panel -->
    <div class="tracker-card" id="live-tracker">
      <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px;">
        <div>
          <span style="font-size: 11px; text-transform: uppercase; color: var(--text-muted); font-weight: 800; letter-spacing: 0.5px;">Active Order Status</span>
          <h3 id="tracker-order-id" style="margin: 2px 0 0 0; font-size: 16px; color: #fff;">Order #-----</h3>
        </div>
        <div id="tracker-badge" class="table-badge" style="background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3);">Pending</div>
      </div>
      
      <div style="font-size: 13px; color: var(--text-muted); margin-bottom: 16px;" id="tracker-items-summary">Items loading...</div>
      
      <!-- Visual Progress Steps -->
      <div class="status-steps">
        <div class="step" id="step-pending">
          <div class="step-dot">1</div>
          <span>Ordered</span>
        </div>
        <div class="step" id="step-preparing">
          <div class="step-dot">2</div>
          <span>Preparing</span>
        </div>
        <div class="step" id="step-completed">
          <div class="step-dot">3</div>
          <span>Ready</span>
        </div>
        <div class="step" id="step-billed">
          <div class="step-dot">4</div>
          <span>Billed</span>
        </div>
      </div>
      
      <div style="display: flex; justify-content: space-between; align-items: center; margin-top: 18px; padding-top: 14px; border-top: 1px solid rgba(255,255,255,0.06);">
        <span style="font-size: 13px; font-weight: bold;">Total Bill: <span id="tracker-total" style="color: var(--green);">₹0</span></span>
        <button class="btn" style="background: rgba(255,255,255,0.08); color: var(--text); font-size: 10px; padding: 6px 12px;" onclick="dismissTracker()">Dismiss View ✕</button>
      </div>
    </div>

    <!-- Category Filter Tabs -->
    <div class="categories" id="categories-container">
      <button class="cat-btn active" onclick="filterCategory('All', this)">All Items</button>
      <button class="cat-btn" onclick="filterCategory('Coffee', this)">☕ Coffee & Brews</button>
      <button class="cat-btn" onclick="filterCategory('Fast Food', this)">🍔 Fast Food</button>
      <button class="cat-btn" onclick="filterCategory('Desserts', this)">🍰 Desserts</button>
      <button class="cat-btn" onclick="filterCategory('Beverages', this)">🥤 Beverages</button>
    </div>

    <!-- Menu Items Grid -->
    <div class="menu-grid" id="menu-grid">
      <!-- Dynamically injected items -->
    </div>
  </div>

  <!-- Floating Cart Bar -->
  <div class="cart-bar" id="cart-bar" onclick="toggleCartModal(true)">
    <div>
      <span id="cart-count-badge" style="font-weight: 800; font-size: 15px;">0 items</span>
      <div style="font-size: 11px; color: var(--text-muted);">Tap to review order & bill</div>
    </div>
    <div style="font-size: 16px; font-weight: 900; color: var(--green);" id="cart-total-price">₹0</div>
  </div>

  <!-- Cart Modal Overlay -->
  <div class="modal-overlay" id="modal-overlay" onclick="toggleCartModal(false)"></div>

  <!-- Cart Drawer -->
  <div class="cart-drawer" id="cart-drawer">
    <div class="cart-header">
      <h3 style="margin: 0; font-size: 18px;">Your Order & Billing Summary</h3>
      <button onclick="toggleCartModal(false)" style="background: none; border: none; color: var(--text-muted); font-size: 18px; cursor: pointer;">✕</button>
    </div>
    <div class="cart-body" id="cart-items-container">
      <p style="color: var(--text-muted); text-align: center; font-size: 13px;">Your cart is empty.</p>
    </div>
    <div class="cart-footer">
      <div style="display: flex; justify-content: space-between; font-size: 15px; font-weight: bold;">
        <span>Total Amount:</span>
        <span id="drawer-total-price" style="color: var(--green);">₹0</span>
      </div>
      <button class="btn" style="background: var(--green); color: #fff; padding: 14px; font-size: 13px; border-radius: 14px; width: 100%; box-shadow: 0 6px 20px rgba(16, 185, 129, 0.3);" onclick="placeOrder()">Place Order & Send to Kitchen ➔</button>
    </div>
  </div>

  <!-- Toast Notification -->
  <div class="toast" id="toast-notification">Added to order!</div>

  <script>
    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // --- ZERO-ERROR SYNTHESIZED SFX (WEB AUDIO API) ---
    function playSFX(type) {
      try {
        const AudioContext = window.AudioContext || window.webkitAudioContext;
        if (!AudioContext) return;
        const ctx = new AudioContext();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.connect(gain);
        gain.connect(ctx.destination);
        
        if (type === 'add') {
          osc.frequency.setValueAtTime(587.33, ctx.currentTime);
          osc.frequency.exponentialRampToValueAtTime(880, ctx.currentTime + 0.08);
          gain.gain.setValueAtTime(0.08, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.08);
          osc.start();
          osc.stop(ctx.currentTime + 0.08);
        } else if (type === 'success') {
          osc.frequency.setValueAtTime(440, ctx.currentTime);
          osc.frequency.setValueAtTime(554.37, ctx.currentTime + 0.1);
          osc.frequency.setValueAtTime(659.25, ctx.currentTime + 0.2);
          gain.gain.setValueAtTime(0.12, ctx.currentTime);
          gain.gain.exponentialRampToValueAtTime(0.001, ctx.currentTime + 0.3);
          osc.start();
          osc.stop(ctx.currentTime + 0.3);
        }
      } catch (e) {
        // Audio playback permitted only after user interaction; safely caught
      }
    }

    // --- MENU DATA ---
    const menuItems = [
      { id: 1, name: "Classic Espresso", category: "Coffee", price: 120, desc: "Rich and bold single shot espresso brewed to perfection.", image: "https://images.unsplash.com/photo-1510591509098-f4fdc6d0ff04?w=500&auto=format&fit=crop&q=60" },
      { id: 2, name: "Caramel Macchiato", category: "Coffee", price: 180, desc: "Espresso combined with vanilla syrup, steamed milk, and caramel drizzle.", image: "https://images.unsplash.com/photo-1485808191679-edf8ad13cb6a?w=500&auto=format&fit=crop&q=60" },
      { id: 3, name: "Cold Brew Supreme", category: "Coffee", price: 160, desc: "Steeped for 24 hours for a smooth, low-acid coffee refreshment.", image: "https://images.unsplash.com/photo-1517701550927-30cf4ba1dba5?w=500&auto=format&fit=crop&q=60" },
      { id: 4, name: "Crispy Peri Peri Fries", category: "Fast Food", price: 140, desc: "Golden French fries tossed in spicy peri peri seasoning.", image: "https://images.unsplash.com/photo-1573080496219-bb080dd4f877?w=500&auto=format&fit=crop&q=60" },
      { id: 5, name: "Gani Special Burger", category: "Fast Food", price: 220, desc: "Juicy double patty with melted cheese, secret sauce, and fresh lettuce.", image: "https://images.unsplash.com/photo-1568901346375-23c9450c58cd?w=500&auto=format&fit=crop&q=60" },
      { id: 6, name: "Loaded Cheese Nachos", category: "Fast Food", price: 190, desc: "Tortilla chips drenched in warm melted cheese, jalapeños, and salsa.", image: "https://images.unsplash.com/photo-1582169505501-cff39666870a?w=500&auto=format&fit=crop&q=60" },
      { id: 7, name: "Belgian Chocolate Waffle", category: "Desserts", price: 200, desc: "Crispy golden waffle smothered in rich dark Belgian chocolate sauce.", image: "https://images.unsplash.com/photo-1562376552-0d160a2f238d?w=500&auto=format&fit=crop&q=60" },
      { id: 8, name: "New York Cheesecake", category: "Desserts", price: 240, desc: "Ultra-smooth, creamy classic cheesecake with a buttery graham crust.", image: "https://images.unsplash.com/photo-1533134242443-d4fd215305ad?w=500&auto=format&fit=crop&q=60" },
      { id: 9, name: "Fresh Mint Mojito", category: "Beverages", price: 150, desc: "Refreshing blend of fresh mint leaves, lime juice, and sparkling soda.", image: "https://images.unsplash.com/photo-1513558161293-cdaf765ed2fd?w=500&auto=format&fit=crop&q=60" }
    ];

    // --- STATE MANAGEMENT ---
    let cart = {};
    let currentTable = "1";
    let activeOrderId = localStorage.getItem('gani_active_order_id') || null;
    let orderListenerRef = null;

    window.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const tableParam = urlParams.get('table');
      if (tableParam) {
        currentTable = tableParam;
      } else {
        const savedTable = localStorage.getItem('gani_cafe_table');
        if (savedTable) currentTable = savedTable;
      }
      document.getElementById('display-table').innerText = currentTable;
      renderMenu('All');
      
      if (activeOrderId) {
        initOrderTracker(activeOrderId);
      }
    });

    function promptTableChange() {
      let newTable = prompt("Enter your current Table Number:", currentTable);
      if (newTable && newTable.trim() !== "") {
        currentTable = newTable.trim();
        localStorage.setItem('gani_cafe_table', currentTable);
        document.getElementById('display-table').innerText = currentTable;
        showToast(`Table updated to #${currentTable}`);
      }
    }

    // --- RENDERING MENU ---
    function renderMenu(category) {
      const grid = document.getElementById('menu-grid');
      const filtered = category === 'All' ? menuItems : menuItems.filter(i => i.category === category);
      
      grid.innerHTML = filtered.map(item => `
        <div class="menu-card">
          <div class="menu-img-wrapper">
            <img class="menu-img" src="${item.image}" alt="${escapeHtml(item.name)}" loading="lazy">
          </div>
          <div class="menu-content">
            <h3 class="menu-title">${escapeHtml(item.name)}</h3>
            <p class="menu-desc">${escapeHtml(item.desc)}</p>
            <div class="menu-footer">
              <span class="menu-price">₹${item.price}</span>
              <button class="btn" onclick="addToCart(${item.id})">Add +</button>
            </div>
          </div>
        </div>
      `).join('');
    }

    function filterCategory(category, btnElement) {
      document.querySelectorAll('.cat-btn').forEach(b => b.classList.remove('active'));
      btnElement.classList.add('active');
      renderMenu(category);
    }

    // --- CART ACTIONS ---
    function addToCart(itemId) {
      const item = menuItems.find(i => i.id === itemId);
      if (!item) return;

      if (cart[itemId]) {
        cart[itemId].qty += 1;
      } else {
        cart[itemId] = { ...item, qty: 1 };
      }
      playSFX('add');
      updateCartUI();
      showToast(`Added ${item.name}`);
    }

    function changeQty(itemId, delta) {
      if (!cart[itemId]) return;
      cart[itemId].qty += delta;
      if (cart[itemId].qty <= 0) {
        delete cart[itemId];
      }
      playSFX('add');
      updateCartUI();
    }

    function updateCartUI() {
      const keys = Object.keys(cart);
      let totalCount = 0;
      let totalPrice = 0;

      keys.forEach(k => {
        totalCount += cart[k].qty;
        totalPrice += cart[k].price * cart[k].qty;
      });

      const cartBar = document.getElementById('cart-bar');
      if (totalCount > 0) {
        cartBar.classList.add('visible');
      } else {
        cartBar.classList.remove('visible');
        toggleCartModal(false);
      }

      document.getElementById('cart-count-badge').innerText = `${totalCount} item${totalCount > 1 ? 's' : ''}`;
      document.getElementById('cart-total-price').innerText = `₹${totalPrice}`;
      document.getElementById('drawer-total-price').innerText = `₹${totalPrice}`;

      const container = document.getElementById('cart-items-container');
      if (keys.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted); text-align: center; font-size: 13px;">Your cart is empty.</p>`;
        return;
      }

      container.innerHTML = keys.map(k => {
        let i = cart[k];
        return `
          <div class="cart-item">
            <div>
              <div style="font-weight: 700; font-size: 14px; color: #fff;">${escapeHtml(i.name)}</div>
              <div style="font-size: 12px; color: var(--green); font-weight: 600;">₹${i.price * i.qty}</div>
            </div>
            <div class="qty-controls">
              <button class="qty-btn" onclick="changeQty(${i.id}, -1)">-</button>
              <span style="font-size: 13px; font-weight: bold; min-width: 16px; text-align: center;">${i.qty}</span>
              <button class="qty-btn" onclick="changeQty(${i.id}, 1)">+</button>
            </div>
          </div>
        `;
      }).join('');
    }

    function toggleCartModal(open) {
      const overlay = document.getElementById('modal-overlay');
      const drawer = document.getElementById('cart-drawer');
      if (open && Object.keys(cart).length > 0) {
        overlay.classList.add('active');
        drawer.classList.add('active');
      } else {
        overlay.classList.remove('active');
        drawer.classList.remove('active');
      }
    }

    // --- FIREBASE ORDER SUBMISSION & LIVE BILLING TRACKER ---
    function placeOrder() {
      const keys = Object.keys(cart);
      if (keys.length === 0) return;

      let orderItemsArray = [];
      let calculatedTotal = 0;
      keys.forEach(k => {
        orderItemsArray.push(`${cart[k].qty}x ${cart[k].name}`);
        calculatedTotal += cart[k].price * cart[k].qty;
      });

      const orderData = {
        table: currentTable,
        items: orderItemsArray,
        total: calculatedTotal,
        status: "Pending",
        timestamp: Date.now()
      };

      db.ref('orders').push(orderData).then((newRef) => {
        activeOrderId = newRef.key;
        localStorage.setItem('gani_active_order_id', activeOrderId);
        
        cart = {};
        updateCartUI();
        toggleCartModal(false);
        playSFX('success');
        showToast("Order placed successfully! 🍳");
        
        initOrderTracker(activeOrderId);
      }).catch(err => {
        console.error("Order submission failed:", err);
        alert("Failed to place order. Please check your network connection.");
      });
    }

    function initOrderTracker(orderId) {
      if (orderListenerRef) {
        db.ref(`orders/${orderId}`).off('value', orderListenerRef);
      }

      const trackerCard = document.getElementById('live-tracker');
      trackerCard.classList.add('active');

      orderListenerRef = db.ref(`orders/${orderId}`).on('value', snap => {
        const order = snap.val();
        if (!order || order.status === 'Cleared') {
          dismissTracker();
          return;
        }

        document.getElementById('tracker-order-id').innerText = `Order #${orderId.slice(-5)} (Table ${order.table})`;
        document.getElementById('tracker-items-summary').innerText = order.items ? order.items.join(', ') : '';
        
        let total = order.total || 0;
        if (!total && order.items) {
          // Fallback calculation if total wasn't stored explicitly
          total = order.items.reduce((acc, itemStr) => {
            const match = menuItems.find(m => itemStr.includes(m.name));
            const qtyMatch = itemStr.match(/^(\d+)x/);
            const qty = qtyMatch ? parseInt(qtyMatch[1]) : 1;
            return acc + (match ? match.price * qty : 0);
          }, 0);
        }
        document.getElementById('tracker-total').innerText = `₹${total}`;

        updateTrackerSteps(order.status);
      });
    }

    function updateTrackerSteps(status) {
      const badge = document.getElementById('tracker-badge');
      const stepPending = document.getElementById('step-pending');
      const stepPreparing = document.getElementById('step-preparing');
      const stepCompleted = document.getElementById('step-completed');
      const stepBilled = document.getElementById('step-billed');

      // Reset step states
      [stepPending, stepPreparing, stepCompleted, stepBilled].forEach(s => {
        s.className = "step";
      });

      if (status === 'Pending') {
        badge.innerText = "Pending";
        badge.style.background = "rgba(239, 68, 68, 0.15)";
        badge.style.color = "var(--red)";
        badge.style.borderColor = "rgba(239, 68, 68, 0.3)";
        stepPending.classList.add('active');
      } else if (status === 'Preparing') {
        badge.innerText = "Preparing";
        badge.style.background = "rgba(249, 115, 22, 0.15)";
        badge.style.color = "var(--orange)";
        badge.style.borderColor = "rgba(249, 115, 22, 0.3)";
        stepPending.classList.add('completed');
        stepPreparing.classList.add('active');
      } else if (status === 'Completed' || status === 'Ready') {
        badge.innerText = "Ready to Serve";
        badge.style.background = "rgba(16, 185, 129, 0.15)";
        badge.style.color = "var(--green)";
        badge.style.borderColor = "rgba(16, 185, 129, 0.3)";
        stepPending.classList.add('completed');
        stepPreparing.classList.add('completed');
        stepCompleted.classList.add('active');
      } else if (status === 'Billed' || status === 'Cleared') {
        badge.innerText = "Billed & Closed";
        badge.style.background = "rgba(14, 165, 233, 0.15)";
        badge.style.color = "var(--blue)";
        badge.style.borderColor = "rgba(14, 165, 233, 0.3)";
        stepPending.classList.add('completed');
        stepPreparing.classList.add('completed');
        stepCompleted.classList.add('completed');
        stepBilled.classList.add('completed');
      }
    }

    function dismissTracker() {
      if (activeOrderId && orderListenerRef) {
        db.ref(`orders/${activeOrderId}`).off('value', orderListenerRef);
      }
      activeOrderId = null;
      localStorage.removeItem('gani_active_order_id');
      document.getElementById('live-tracker').classList.remove('active');
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
