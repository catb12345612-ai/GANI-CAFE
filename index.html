<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Table Order</title>
</head>
<body style="font-family:sans-serif; padding:15px; background:#f4f4f4; margin:0;">
    <h2 style="text-align:center; color:#333;">Table Menu</h2>

    <div id="menu" style="background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); max-width:500px; margin:0 auto;">
        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:15px;">
            <span><strong>Paneer Tikka</strong> - ₹220</span>
            <div style="display:flex; align-items:center;">
                <button onclick="removeFromCart('Paneer Tikka')" style="padding:6px 12px; background:#dc3545; color:white; border:none; cursor:pointer; font-weight:bold; font-size:16px; border-radius:4px;">-</button>
                <span id="qty-Paneer-Tikka" style="margin:0 12px; font-weight:bold; font-size:16px;">0</span>
                <button onclick="addToCart('Paneer Tikka', 220)" style="padding:6px 12px; background:#28a745; color:white; border:none; cursor:pointer; font-weight:bold; font-size:16px; border-radius:4px;">+</button>
            </div>
        </div>

        <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:10px;">
            <span><strong>Chicken Biryani</strong> - ₹280</span>
            <div style="display:flex; align-items:center;">
                <button onclick="removeFromCart('Chicken Biryani')" style="padding:6px 12px; background:#dc3545; color:white; border:none; cursor:pointer; font-weight:bold; font-size:16px; border-radius:4px;">-</button>
                <span id="qty-Chicken-Biryani" style="margin:0 12px; font-weight:bold; font-size:16px;">0</span>
                <button onclick="addToCart('Chicken Biryani', 280)" style="padding:6px 12px; background:#28a745; color:white; border:none; cursor:pointer; font-weight:bold; font-size:16px; border-radius:4px;">+</button>
            </div>
        </div>
    </div>

    <div style="max-width:500px; margin:20px auto; background:white; padding:15px; border-radius:8px; box-shadow:0 2px 5px rgba(0,0,0,0.1); text-align:center;">
        <h3>Items in Cart: <span id="cart-count">0</span> | Total: ₹<span id="cart-total">0</span></h3>
        <button onclick="placeOrder()" style="width:100%; padding:14px; background:green; color:white; border:none; font-size:16px; font-weight:bold; cursor:pointer; border-radius:5px;">Send Order to Kitchen</button>
    </div>

    <div style="max-width:500px; margin:0 auto; text-align:center;">
        <h3 id="order-status" style="color:blue; margin-top:20px;"></h3>
    </div>

    <div id="pay-section" style="display:none; max-width:500px; margin:20px auto; border:2px solid green; padding:15px; background:white; border-radius:8px; text-align:center; box-shadow:0 2px 5px rgba(0,0,0,0.1);">
        <h3>Your Meal is Complete!</h3>
        <p>Choose your payment method:</p>
        <a id="pay-btn" href="#" style="display:block; width:100%; box-sizing:border-box; padding:12px; background:#007bff; color:white; text-decoration:none; text-align:center; font-size:16px; font-weight:bold; cursor:pointer; margin-bottom:15px; border-radius:5px;">Pay Online (GPay/PhonePe App)</a>
        
        <p style="margin: 10px 0; font-weight: bold; color: #333;">Or Scan QR Code to Pay:</p>
        <img src="qr.jpg" alt="UPI QR Code" style="max-width:220px; width:100%; height:auto; margin:0 auto 15px auto; display:block; border-radius:8px; border:1px solid #ccc;">

        <button onclick="payByCash()" style="width:100%; padding:12px; background:#28a745; color:white; border:none; font-size:16px; font-weight:bold; cursor:pointer; border-radius:5px;">Pay with Cash at Counter</button>
        <p id="cash-status" style="margin-top:10px; color:green; font-weight:bold;"></p>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
        import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

        const firebaseConfig = {
            apiKey: "AIzaSyAc5NP4DNmNr30KQfCZeAB35KH3dg",
            authDomain: "algani-cafe.firebaseapp.com",
            databaseURL: "https://algani-cafe-default-rtdb.firebaseio.com",
            projectId: "algani-cafe",
            storageBucket: "algani-cafe.appspot.com",
            messagingSenderId: "44056411552",
            appId: "1:44056411552:web:b67f0cf82791a81fb0f8c5",
            measurementId: "G-Q2ELLZ03SE"
        };

        const app = initializeApp(firebaseConfig);
        const db = getDatabase(app);

        const urlParams = new URLSearchParams(window.location.search);
        const tableNo = urlParams.get('table') || "1";
        document.title = `Table ${tableNo} Menu`;

        let cart = [];
        let currentOrderId = null;
        let currentTotal = 0;

        window.addToCart = (name, price) => {
            cart.push({ name, price });
            updateCartUI();
        };

        window.removeFromCart = (name) => {
            const index = cart.findIndex(item => item.name === name);
            if (index > -1) {
                cart.splice(index, 1);
            }
            updateCartUI();
        };

        function updateCartUI() {
            let totalItems = cart.length;
            let totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            document.getElementById('cart-count').innerText = totalItems;
            document.getElementById('cart-total').innerText = totalPrice;

            const paneerCount = cart.filter(i => i.name === 'Paneer Tikka').length;
            const biryaniCount = cart.filter(i => i.name === 'Chicken Biryani').length;

            document.getElementById('qty-Paneer-Tikka').innerText = paneerCount;
            document.getElementById('qty-Chicken-Biryani').innerText = biryaniCount;
        }

        window.placeOrder = () => {
            if (cart.length === 0) {
                alert("Your cart is empty!");
                return;
            }

            const totalPrice = cart.reduce((sum, item) => sum + item.price, 0);

            const newOrderRef = push(ref(db, 'orders'), {
                table: tableNo,
                items: cart,
                total: totalPrice,
                status: "Received"
            });

            currentOrderId = newOrderRef.key;
            alert("Order sent to kitchen!");
            listenToOrderStatus();
        };

        function listenToOrderStatus() {
            onValue(ref(db, `orders/${currentOrderId}`), (snapshot) => {
                const data = snapshot.val();
                if (!data) return;
                document.getElementById('order-status').innerText = `Status: ${data.status}`;

                if (data.status === "Served" || data.status === "Billed") {
                    document.getElementById('pay-section').style.display = 'block';
                    currentTotal = data.total;
                    const upiVpa = "7569524356-2@axl";
                    const upiUrl = `upi://pay?pa=${upiVpa}&pn=GaniCafe&am=${currentTotal}&cu=INR`;
                    document.getElementById('pay-btn').href = upiUrl;
                }
            });
        }

        window.payByCash = () => {
            update(ref(db, `orders/${currentOrderId}`), { paymentMethod: "Cash at Counter" });
            document.getElementById('cash-status').innerText = "Cash payment requested! Please pay at the counter.";
        };
    </script>
</body>
</html>
