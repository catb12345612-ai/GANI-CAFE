<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Table Order</title>
 <script type="module">
  import { initializeApp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-app.js";
  import { getAnalytics } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-analytics.js";
  import { getDatabase, ref, push, onValue, update } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-database.js";

  const firebaseConfig = {
    apiKey: "AIzaSyAc5NFz9pNP4DNmNr30KQfCZeABJ5KH3dg",
    authDomain: "algani-cafe.firebaseapp.com",
    databaseURL: "https://algani-cafe-default-rtdb.firebaseio.com",
    projectId: "algani-cafe",
    storageBucket: "algani-cafe.firebasestorage.app",
    messagingSenderId: "44056411552",
    appId: "1:44056411552:web:b67f0cf82791a81fb0f8c5",
    measurementId: "G-Q2ELLZ03SE"
  };

  const app = initializeApp(firebaseConfig);
  const analytics = getAnalytics(app);
  const db = getDatabase(app);

  // Get Table Number from URL parameter (?table=1)
  const urlParams = new URLSearchParams(window.location.search);
  const tableNo = urlParams.get('table') || "0";
  document.title = `Table ${tableNo} Menu`;

  let cart = [];
  let currentOrderId = null;

  window.addToCart = (name, price) => {
      cart.push({ name, price });
      updateCartUI();
  };

  function updateCartUI() {
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      document.getElementById('cart-count').innerText = cart.length;
      document.getElementById('cart-total').innerText = total;
  }

  window.placeOrder = () => {
      if (cart.length === 0) return alert("Select items first!");
      let total = cart.reduce((sum, item) => sum + item.price, 0);
      
      const newOrderRef = push(ref(db, 'orders'), {
          table: tableNo,
          items: cart,
          total: total,
          status: "Pending",
          timestamp: Date.now()
      });
      
      currentOrderId = newOrderRef.key;
      alert("Order Sent to Kitchen!");
      listenToOrderStatus();
  };

 let currentTotal = 0;

  function listenToOrderStatus() {
      onValue(ref(db, `orders/${currentOrderId}`), (snapshot) => {
          const data = snapshot.val();
          if (!data) return;
          document.getElementById('order-status').innerText = `Status: ${data.status}`;

          if (data.status === "Served" || data.status === "Billed") {
              document.getElementById('pay-section').style.display = 'block';
              currentTotal = data.total;
              const upiVpa = "7569524356-2@axl";
              document.getElementById('upi-id-display').innerText = `Or pay manually to UPI ID: ${upiVpa}`;
          }
      });
  }

  window.payOnline = () => {
      const upiVpa = "7569524356-2@axl";
      const upiUrl = `upi://pay?pa=${upiVpa}&pn=GaniCafe&am=${currentTotal}&cu=INR`;
      window.location.href = upiUrl;
  };
      });
  } window.payByCash = () => {
    if (!currentOrderId) return;
    update(ref(db, `orders/${currentOrderId}`), { 
        paymentMethod: "Cash", 
        status: "Cash Payment Requested" 
    });
    document.getElementById('cash-status').innerText = "Cash requested! Please pay at the counter.";
};
</script>
</head>
<body style="font-family:sans-serif; padding:15px; max-width:400px; margin:auto;">
  <h2>Table Menu</h2>
  <div id="menu">
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>Paneer Tikka - ₹220</span>
      <button onclick="addToCart('Paneer Tikka', 220)">+ Add</button>
    </div>
    <div style="display:flex; justify-content:space-between; margin-bottom:10px;">
      <span>Chicken Biryani - ₹280</span>
      <button onclick="addToCart('Chicken Biryani', 280)">+ Add</button>
    </div>
  </div>

  <hr>
  <h3>Items in Cart: <span id="cart-count">0</span> | Total: ₹<span id="cart-total">0</span></h3>
  <button onclick="placeOrder()" style="width:100%; padding:12px; background:green; color:white; border:none; font-size:16px;">Send Order to Kitchen</button>

  <h3 id="order-status" style="color:blue; margin-top:20px;"></h3>

 <div id="pay-section" style="display:none; margin-top:20px; border:2px solid green; padding:10px; text-align:center;">
  <h3>Your Meal is Complete!</h3>
  <p>Choose your payment method:</p>
  <button onclick="payOnline()" style="width:100%; padding:12px; background:#007bff; color:white; border:none; font-size:16px; font-weight:bold; cursor:pointer; margin-bottom:10px;">Pay Online (GPay/PhonePe)</button>
  <p id="upi-id-display" style="font-size: 14px; margin-bottom: 10px; color: #333;"></p>
  <button onclick="payByCash()" style="width:100%; padding:12px; background:#28a745; color:white; border:none; font-size:16px; font-weight:bold; cursor:pointer;">Pay with Cash at Counter</button>
  <p id="cash-status" style="margin-top:10px; color:green; font-weight:bold;"></p>
</div>
