<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Kitchen & Billing Control KDS</title>
  <!-- Firebase SDKs (Compat v8) -->
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { 
      --gold: #d97706; 
      --gold-light: #fbbf24;
      --bg: #07090e; 
      --card-bg: rgba(13, 17, 28, 0.95); 
      --glass-bg: rgba(255, 255, 255, 0.03);
      --text: #f8fafc; 
      --text-muted: #94a3b8; 
      --green: #10b981; 
      --red: #ef4444; 
      --orange: #f97316; 
      --blue: #0ea5e9; 
      --yellow: #eab308;
      --accent-gradient: linear-gradient(135deg, #d97706 0%, #fbbf24 50%, #f59e0b 100%);
      --luxury-border: 1px solid rgba(217, 119, 6, 0.25);
    }
    
    * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 0; min-height: 100vh; overflow-x: hidden; }

    header { background: rgba(13, 17, 28, 0.95); backdrop-filter: blur(20px); padding: 18px 24px; position: sticky; top: 0; z-index: 100; border-bottom: 1px solid rgba(255,255,255,0.06); display: flex; justify-content: space-between; align-items: center; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    header h1 { margin: 0; font-size: 20px; font-weight: 900; background: var(--accent-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; letter-spacing: -0.5px; text-transform: uppercase; }

    .kds-container { max-width: 1400px; margin: 0 auto; padding: 24px; }
    
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 20px; }

    .order-card { background: var(--card-bg); border: var(--luxury-border); border-radius: 22px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; box-shadow: 0 15px 40px rgba(0,0,0,0.6); backdrop-filter: blur(16px); position: relative; overflow: hidden; animation: fadeIn 0.3s cubic-bezier(0.16, 1, 0.3, 1); }
    .order-card::before { content: ''; position: absolute; top: 0; left: 0; right: 0; height: 3px; background: var(--accent-gradient); }

    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; padding-bottom: 10px; border-bottom: 1px solid rgba(255,255,255,0.06); }
    .table-tag { font-size: 13px; font-weight: 900; color: var(--gold-light); background: rgba(217,119,6,0.1); padding: 4px 10px; border-radius: 10px; border: 1px solid rgba(217,119,6,0.2); }
    
    .status-badge { font-size: 10px; font-weight: 800; text-transform: uppercase; padding: 4px 10px; border-radius: 12px; letter-spacing: 0.5px; }
    .status-Pending { background: rgba(239, 68, 68, 0.15); color: var(--red); border: 1px solid rgba(239, 68, 68, 0.3); }
    .status-Preparing { background: rgba(249, 115, 22, 0.15); color: var(--orange); border: 1px solid rgba(249, 115, 22, 0.3); }
    .status-Ready { background: rgba(16, 185, 129, 0.15); color: var(--green); border: 1px solid rgba(16, 185, 129, 0.3); }
    .status-Billed { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border: 1px solid rgba(234, 179, 8, 0.3); }
    .status-Cleared { background: rgba(14, 165, 233, 0.15); color: var(--blue); border: 1px solid rgba(14, 165, 233, 0.3); }

    .items-list { margin: 10px 0 16px 0; display: flex; flex-direction: column; gap: 8px; max-height: 220px; overflow-y: auto; padding-right: 4px; scrollbar-width: thin; }
    .item-row { background: rgba(255,255,255,0.02); border: 1px solid rgba(255,255,255,0.04); padding: 9px 12px; border-radius: 10px; font-size: 13px; font-weight: 700; color: #fff; display: flex; justify-content: space-between; align-items: center; }

    .order-footer { border-top: 1px solid rgba(255,255,255,0.06); padding-top: 14px; display: flex; flex-direction: column; gap: 12px; }
    
    .action-buttons { display: grid; grid-template-columns: repeat(2, 1fr); gap: 8px; }
    .btn { background: rgba(255,255,255,0.06); color: var(--text); border: 1px solid rgba(255,255,255,0.1); padding: 10px; border-radius: 12px; font-weight: 800; cursor: pointer; text-transform: uppercase; font-size: 10px; letter-spacing: 0.5px; transition: all 0.2s; text-align: center; }
    .btn:active { transform: scale(0.96); }
    
    .btn-accept { background: rgba(14, 165, 233, 0.15); color: var(--blue); border-color: rgba(14, 165, 233, 0.4); }
    .btn-prep { background: rgba(249, 115, 22, 0.15); color: var(--orange); border-color: rgba(249, 115, 22, 0.4); }
    .btn-ready { background: rgba(16, 185, 129, 0.15); color: var(--green); border-color: rgba(16, 185, 129, 0.4); }
    .btn-billed { background: rgba(234, 179, 8, 0.15); color: var(--yellow); border-color: rgba(234, 179, 8, 0.4); }
    .btn-clear { background: var(--green); color: #000; border-color: var(--green); grid-column: span 2; font-size: 11px; padding: 12px; font-weight: 900; }
    .btn-clear:hover { filter: brightness(1.1); }

    .empty-state { text-align: center; padding: 60px 20px; color: var(--text-muted); font-size: 15px; font-weight: 600; grid-column: 1 / -1; }

    .toast { position: fixed; top: 90px; left: 50%; transform: translateX(-50%) translateY(-30px); background: var(--green); color: #000; padding: 12px 24px; border-radius: 30px; font-weight: 900; font-size: 13px; opacity: 0; transition: all 0.3s cubic-bezier(0.16, 1, 0.3, 1); z-index: 400; pointer-events: none; box-shadow: 0 10px 25px rgba(16, 185, 129, 0.4); }
    .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }
  </style>
</head>
<body>

  <header>
    <h1>🔥 GANI CAFE - KDS & CLEARANCE DESK</h1>
    <div style="font-size: 12px; font-weight: 800; color: var(--gold-light);" id="live-clock">--:--:--</div>
  </header>

  <div class="kds-container">
    <div class="orders-grid" id="orders-grid">
      <div class="empty-state">Connecting to Live Kitchen Stream...</div>
    </div>
  </div>

  <div class="toast" id="toast-notification">Action executed successfully!</div>

  <script>
    // --- GOOGLE APPS SCRIPT URL ---
    const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybeSPXR0ud-SIEYb8FWcovCdrZfaDHwvckXrZDcD9yLbeIHcJDqOVmTg4vWioE-cG0/exec";

    // --- FIREBASE INITIALIZATION ---
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    // Clock ticker
    setInterval(() => {
      document.getElementById('live-clock').innerText = new Date().toLocaleTimeString();
    }, 1000);

    // --- BULLETPROOF ITEM PARSER (FIXES [object Object] BUG PERMANENTLY) ---
    function parseOrderItem(item) {
      if (!item) return 'Custom Item';
      if (typeof item === 'string') return item;
      if (typeof item === 'object') {
        const qty = item.qty || item.quantity || 1;
        const name = item.name || item.title || item.itemName || 'Custom Item';
        return `${qty}x ${name}`;
      }
      return String(item);
    }

    // --- REAL-TIME LISTENERS FOR KITCHEN & BILLING ---
    window.addEventListener('DOMContentLoaded', () => {
      db.ref('orders').on('value', (snapshot) => {
        const data = snapshot.val();
        const grid = document.getElementById('orders-grid');

        if (!data) {
          grid.innerHTML = `<div class="empty-state">No active kitchen orders right now. Waiting for customer requests...</div>`;
          return;
        }

        let ordersHtml = '';
        const orderIds = Object.keys(data).reverse(); // Newest first

        orderIds.forEach(id => {
          const order = data[id];
          if (!order) return;

          // Skip archived/cleared orders from active KDS view
          if (order.status === 'Cleared' && order._archived) return;

          const statusClass = `status-${order.status || 'Pending'}`;
          
          // Handle items whether stored as array or object/string
          let itemsArray = [];
          if (Array.isArray(order.items)) {
            itemsArray = order.items;
          } else if (typeof order.items === 'object' && order.items !== null) {
            itemsArray = Object.values(order.items);
          } else if (typeof order.items === 'string') {
            itemsArray = [order.items];
          }
          
          let itemsListHtml = itemsArray.map(item => {
            const formattedText = parseOrderItem(item);
            return `<div class="item-row"><span>${escapeHtml(formattedText)}</span></div>`;
          }).join('');

          let totalAmount = order.total || 0;
          let paymentMode = order.paymentMode || 'QR Code';
          let orderStatus = order.status || 'Pending';

          ordersHtml += `
            <div class="order-card" id="card-${id}">
              <div>
                <div class="order-header">
                  <span class="table-tag">Table #${escapeHtml(String(order.table || '1'))}</span>
                  <span class="status-badge ${statusClass}">${escapeHtml(orderStatus)}</span>
                </div>
                <div style="font-size: 11px; color: var(--text-muted); font-weight: 800; margin-bottom: 6px;">Order #${id.slice(-6).toUpperCase()} • Mode: ${escapeHtml(paymentMode)}</div>
                
                <div class="items-list">
                  ${itemsListHtml}
                </div>
              </div>

              <div class="order-footer">
                <div style="display: flex; justify-content: space-between; align-items: center; font-size: 14px; font-weight: 900;">
                  <span>Total Bill:</span>
                  <span style="color: var(--green);">₹${totalAmount}</span>
                </div>

                <div class="action-buttons">
                  <button class="btn btn-accept" onclick="updateOrderStatus('${id}', 'Accepted')">Accept</button>
                  <button class="btn btn-prep" onclick="updateOrderStatus('${id}', 'Preparing')">Prep</button>
                  <button class="btn btn-ready" onclick="updateOrderStatus('${id}', 'Ready')">Ready</button>
                  <button class="btn btn-billed" onclick="updateOrderStatus('${id}', 'Billed')">Mark Billed</button>
                  <button class="btn btn-clear" onclick="clearAndArchiveOrder('${id}')">🔒 Verify Bill & Clear Order</button>
                </div>
              </div>
            </div>
          `;
        });

        grid.innerHTML = ordersHtml || `<div class="empty-state">All orders cleared successfully!</div>`;
      });
    });

    // --- UPDATE ORDER STATUS IN FIREBASE ---
    function updateOrderStatus(orderId, newStatus) {
      db.ref(`orders/${orderId}`).update({ status: newStatus }).then(() => {
        showToast(`Order status updated to ${newStatus}`);
      }).catch(err => {
        console.error("Status update error:", err);
        alert("Failed to update order status.");
      });
    }

    // --- BILL CLEARANCE & GOOGLE SHEETS SYNC ---
    function clearAndArchiveOrder(orderId) {
      db.ref(`orders/${orderId}`).once('value', (snapshot) => {
        const orderData = snapshot.val();
        if (!orderData) return;

        // Parse items cleanly into string for Google Sheets
        let rawItems = orderData.items;
        let itemsString = '';
        if (Array.isArray(rawItems)) {
          itemsString = rawItems.map(i => parseOrderItem(i)).join(', ');
        } else if (typeof rawItems === 'object' && rawItems !== null) {
          itemsString = Object.values(rawItems).map(i => parseOrderItem(i)).join(', ');
        } else {
          itemsString = String(rawItems || '');
        }

        const payload = {
          orderId: orderId,
          table: orderData.table || '1',
          items: itemsString,
          total: orderData.total || 0,
          paymentMode: orderData.paymentMode || 'QR Code',
          status: 'Cleared',
          timestamp: new Date().toISOString()
        };

        // 1. Send data to Google Apps Script storage
        fetch(GOOGLE_SCRIPT_URL, {
          method: 'POST',
          mode: 'no-cors',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload)
        }).then(() => {
          console.log("Logged successfully to Google Sheet.");
        }).catch(err => {
          console.error("Google Sheet sync error:", err);
        });

        // 2. Update Firebase status to Cleared and archive
        db.ref(`orders/${orderId}`).update({ 
          status: 'Cleared', 
          _archived: true,
          clearedAt: firebase.database.ServerValue.TIMESTAMP 
        }).then(() => {
          showToast("Bill cleared & archived successfully! ✓");
        }).catch(err => {
          console.error("Clearance error:", err);
          alert("Failed to clear bill in database. Please check connection.");
        });
      });
    }

    function showToast(msg) {
      const toast = document.getElementById('toast-notification');
      toast.innerText = msg;
      toast.classList.add('show');
      setTimeout(() => {
        toast.classList.remove('show');
      }, 2500);
    }

    function escapeHtml(str) {
      return String(str).replace(/&/g, "&amp;")
                        .replace(/</g, "&lt;")
                        .replace(/>/g, "&gt;")
                        .replace(/"/g, "&quot;")
                        .replace(/'/g, "&#039;");
    }
  </script>
</body>
</html>
