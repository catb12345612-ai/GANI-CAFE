<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Premium Digital Dining</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --gold: #d97706; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc; --text-muted: #94a3b8;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); margin: 0; padding-bottom: 120px; }
    header { background: rgba(15, 23, 42, 0.7); backdrop-filter: blur(12px); position: sticky; top: 0; z-index: 50; padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid rgba(255,255,255,0.1); box-shadow: 0 4px 30px rgba(0, 0, 0, 0.5); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 28px; background: linear-gradient(135deg, #d97706, #f59e0b); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(217,119,6,0.4); }
    .table-badge { background: var(--gold); color: #000; padding: 6px 14px; border-radius: 20px; font-weight: 800; font-size: 13px; letter-spacing: 1px; }
    .container { max-width: 600px; margin: 0 auto; padding: 15px; }
    .category-tabs { display: flex; gap: 10px; overflow-x: auto; padding-bottom: 10px; margin-bottom: 15px; scrollbar-width: none; }
    .tab-btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 10px 18px; border-radius: 25px; font-size: 13px; font-weight: 700; white-space: nowrap; cursor: pointer; transition: all 0.3s ease; }
    .tab-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 15px rgba(217,119,6,0.3); }

    .menu-card { background: var(--card-bg); backdrop-filter: blur(5px); border-radius: 14px; padding: 12px; display: flex; gap: 12px; align-items: center; border: 1px solid rgba(255,255,255,0.05); box-shadow: 0 4px 15px rgba(0,0,0,0.3); margin-bottom: 10px; transition: transform 0.2s; }
    .menu-card.out-of-stock { opacity: 0.4; filter: grayscale(1); pointer-events: none; }
    .item-img { width: 80px; height: 80px; border-radius: 10px; object-fit: cover; }
    .item-info { flex-grow: 1; }
    .item-name { font-size: 15px; font-weight: 700; margin: 0 0 4px 0; }
    .item-price { font-size: 14px; color: var(--gold); font-weight: 700; margin: 0; }
    .stock-label { font-size: 11px; color: #ef4444; font-weight: bold; margin-top: 4px; display: block; }
    
    .stepper { display: flex; align-items: center; background: rgba(0,0,0,0.3); border-radius: 8px; border: 1px solid rgba(255,255,255,0.1); overflow: hidden; }
    .stepper button { background: var(--gold); color: #000; border: none; width: 32px; height: 32px; font-weight: 900; font-size: 16px; cursor: pointer; }
    .stepper span { padding: 0 10px; font-weight: 700; font-size: 14px; min-width: 15px; text-align: center; }

    .cart-bar { position: fixed; bottom: 0; left: 0; right: 0; background: rgba(15, 23, 42, 0.9); border-top: 1px solid rgba(255,255,255,0.1); padding: 15px 20px; display: flex; justify-content: space-between; align-items: center; backdrop-filter: blur(15px); }
    .pay-btn { background: linear-gradient(135deg, #d97706, #f59e0b); color: #000; border: none; padding: 12px 24px; border-radius: 10px; font-weight: 800; font-size: 15px; cursor: pointer; text-transform: uppercase; }
    
    .modal { position: fixed; inset: 0; background: rgba(0,0,0,0.85); display: none; justify-content: center; align-items: center; z-index: 100; padding: 15px; }
    .modal-box { background: #1e293b; width: 100%; max-width: 400px; border-radius: 18px; padding: 25px; border: 1px solid rgba(255,255,255,0.1); text-align: center; }
    .pay-option { border: 2px solid rgba(255,255,255,0.1); padding: 12px; border-radius: 10px; margin: 8px 0; cursor: pointer; font-weight: 700; }
    .pay-option.selected { border-color: var(--gold); background: rgba(217,119,6,0.15); color: var(--gold); }
    .dev-footer { margin-top: 30px; text-align: center; font-size: 11px; color: var(--text-muted); padding: 20px 0; border-top: 1px dashed rgba(255,255,255,0.1); line-height: 1.8; }
    .dev-footer strong { color: var(--gold); }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">☕</div>
      <div>
        <h1 style="font-size:18px; margin:0; letter-spacing:1px;">GANI CAFE</h1>
        <p style="font-size:11px; margin:0; color:var(--text-muted);">Supreme Fine Dining</p>
      </div>
    </div>
    <div class="table-badge">TABLE <span id="tbl-num">1</span></div>
  </header>

  <div class="container">
    <div class="category-tabs">
      <button class="tab-btn active" onclick="filterCat('chai', this)">☕ Premium Chai</button>
      <button class="tab-btn" onclick="filterCat('snacks', this)">🥪 Cafe Snacks</button>
      <button class="tab-btn" onclick="filterCat('beverages', this)">🥤 Cold Beverages</button>
    </div>
    <div id="menu-container"></div>
    <div class="dev-footer">&copy; 2026 <strong>GANI CAFE</strong>. Developed by <strong>Syed Zeeshaan Ali</strong></div>
  </div>

  <div class="cart-bar">
    <div>
      <span id="cart-count" style="font-size:12px; color:var(--text-muted)">0 Items</span><br>
      <span style="font-size:22px; font-weight:800; color:var(--gold)">₹<span id="cart-total">0</span></span>
    </div>
    <button class="pay-btn" onclick="openCheckout()">Order Now 🚀</button>
  </div>

  <div class="modal" id="checkout-modal">
    <div class="modal-box">
      <h3 style="margin-top:0;">Select Payment Mode</h3>
      <div class="pay-option selected" id="opt-upi" onclick="setPay('UPI')">📱 UPI / Online Scan</div>
      <div class="pay-option" id="opt-cash" onclick="setPay('Cash')">💵 Cash at Counter</div>
      <div id="qr-box" style="margin:15px 0; background:#fff; padding:10px; border-radius:12px; display:inline-block;">
        <img id="upi-qr" src="" style="width:160px; height:160px; display:block;">
        <p style="font-size:12px; color:#000; margin:5px 0 0; font-weight:bold;">UPI ID: Q227869939@ybl</p>
      </div>
      <button class="pay-btn" style="width:100%; margin-top:10px;" onclick="placeOrder()">Confirm & Dispatch 🔥</button>
      <p style="font-size:12px; color:var(--text-muted); margin-top:15px; cursor:pointer;" onclick="closeModal('checkout-modal')">Cancel</p>
    </div>
  </div>

  <div class="modal" id="status-modal">
    <div class="modal-box">
      <h2 style="color:var(--gold); margin-top:0;">🎉 Order Dispatched!</h2>
      <div style="background: rgba(0,0,0,0.3); padding: 20px; border-radius: 12px; margin: 20px 0; border: 1px dashed var(--gold);">
        <span style="font-size:11px; color:var(--text-muted);">LIVE KITCHEN STATUS</span>
        <h2 id="live-status-text" style="color:var(--gold); margin:10px 0;">Sending...</h2>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW45oIWKrKEn523lxN2oWY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.appspot.com",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    const urlParams = new URLSearchParams(window.location.search);
    const tableNo = urlParams.get('table') || '1';
    document.getElementById('tbl-num').innerText = tableNo;

    let menuData = {};
    let cart = {}, currentCat = 'chai', payMode = 'UPI', currentOrderId = null;

    // Load Live Menu & Stock from Firebase
    db.ref('menu').on('value', (snapshot) => {
      menuData = snapshot.val() || {};
      renderMenu();
    });

    function renderMenu() {
      const container = document.getElementById('menu-container');
      container.innerHTML = "";
      Object.keys(menuData).forEach(id => {
        let item = menuData[id];
        if (item.cat === currentCat) {
          let qty = cart[id] || 0;
          let stockClass = item.inStock === false ? 'out-of-stock' : '';
          let stockText = item.inStock === false ? '<span class="stock-label">❌ Out of Stock</span>' : '';
          container.innerHTML += `
            <div class="menu-card ${stockClass}">
              <img src="${item.img}" class="item-img">
              <div class="item-info">
                <h3 class="item-name">${item.name}</h3>
                <p class="item-price">₹${item.price}</p>
                ${stockText}
              </div>
              <div class="stepper">
                <button onclick="updateQty('${id}', -1)">-</button>
                <span>${qty}</span>
                <button onclick="updateQty('${id}', 1)">+</button>
              </div>
            </div>`;
        }
      });
    }

    function filterCat(cat, btn) {
      currentCat = cat;
      document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active'); renderMenu();
    }

    function updateQty(id, change) {
      cart[id] = (cart[id] || 0) + change;
      if (cart[id] < 0) cart[id] = 0;
      renderMenu(); updateCartSummary();
    }

    function updateCartSummary() {
      let count = 0, total = 0;
      Object.keys(cart).forEach(id => {
        if(menuData[id]) {
          let qty = cart[id];
          count += qty; total += qty * menuData[id].price;
        }
      });
      document.getElementById('cart-count').innerText = count + " Items";
      document.getElementById('cart-total').innerText = total;
      document.getElementById('upi-qr').src = `https://api.qrserver.com/v1/create-qr-code/?size=160x160&data=upi://pay?pa=Q227869939@ybl&pn=GaniCafe&am=${total}&cu=INR`;
    }

    function setPay(mode) {
      payMode = mode;
      document.getElementById('opt-upi').className = mode === 'UPI' ? 'pay-option selected' : 'pay-option';
      document.getElementById('opt-cash').className = mode === 'Cash' ? 'pay-option selected' : 'pay-option';
      document.getElementById('qr-box').style.display = mode === 'UPI' ? 'inline-block' : 'none';
    }

    function openCheckout() {
      let total = parseInt(document.getElementById('cart-total').innerText);
      if (total === 0) return alert("Select at least 1 item!");
      document.getElementById('checkout-modal').style.display = 'flex';
    }
    function closeModal(id) { document.getElementById(id).style.display = 'none'; }

    function placeOrder() {
      let orderedItems = [], total = 0;
      Object.keys(cart).forEach(id => {
        let qty = cart[id];
        if (qty > 0 && menuData[id]) { 
          orderedItems.push(`${qty}x ${menuData[id].name}`); 
          total += qty * menuData[id].price; 
        }
      });

      const orderRef = db.ref('orders').push();
      currentOrderId = orderRef.key;
      
      orderRef.set({
        orderId: currentOrderId, table: tableNo, items: orderedItems,
        total: total, paymentMode: payMode, paymentStatus: 'Pending Verification', 
        status: 'Pending', timestamp: Date.now()
      });

      closeModal('checkout-modal');
      document.getElementById('status-modal').style.display = 'flex';

      db.ref(`orders/${currentOrderId}`).on('value', (snapshot) => {
        const val = snapshot.val();
        if (val) {
          document.getElementById('live-status-text').innerText = val.status === 'Pending' ? '👨‍🍳 Received in Kitchen' : val.status;
        }
      });
    }
  </script>
</body>
</html>
