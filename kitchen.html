<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Kitchen & Admin Dashboard</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root { --gold: #d97706; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7); --text: #f8fafc; --text-muted: #94a3b8; --green: #10b981; --red: #ef4444; --orange: #f59e0b; --blue: #0ea5e9; }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    header { background: var(--card-bg); padding: 15px 25px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; margin-bottom: 25px; border: 1px solid rgba(255,255,255,0.1); flex-wrap: wrap; gap: 15px; }
    .dashboard-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 30px; }
    .section-box { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 20px; }
    .btn { background: var(--gold); color: #000; border: none; padding: 6px 12px; border-radius: 6px; font-weight: bold; cursor: pointer; text-transform: uppercase; transition: all 0.2s; font-size: 11px; }
    .btn:hover { filter: brightness(1.1); transform: translateY(-1px); }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; display: inline-block; }
    .badge-pending { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    .badge-preparing { background: rgba(217, 119, 6, 0.2); color: var(--gold); border: 1px solid var(--gold); }
    .badge-completed { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-paid { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }
    .badge-unpaid { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    .order-card { background: rgba(15, 23, 42, 0.8); padding: 15px; border-radius: 10px; border: 1px solid rgba(255,255,255,0.08); margin-bottom: 12px; }
  </style>
</head>
<body>
  <header>
    <h1>🍳 Gani Cafe - Kitchen & Admin Panel</h1>
    <div>
      <a href="index.html" target="_blank" class="btn" style="background: var(--blue); color: #fff; text-decoration: none; padding: 8px 14px;">Open Customer Menu ➔</a>
    </div>
  </header>

  <div class="dashboard-grid">
    <div class="section-box">
      <h3>Active Kitchen Orders</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Manage cooking queue and update live statuses.</p>
      <div id="kitchen-orders-container">
        <p style="color: var(--text-muted);">Loading live orders...</p>
      </div>
    </div>

    <div class="section-box">
      <h3>Menu Stock Management</h3>
      <p style="font-size: 12px; color: var(--text-muted); margin-bottom: 15px;">Toggle item availability instantly for customers.</p>
      <div id="kitchen-menu-container" style="display: grid; gap: 10px;">
        <p style="color: var(--text-muted);">Loading menu stock...</p>
      </div>
    </div>
  </div>

  <audio id="kitchen-alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };

    if (!firebase.apps.length) {
      firebase.initializeApp(firebaseConfig);
    }
    const db = firebase.database();

    let allOrders = {};
    let menuItems = {};
    let previousOrderCount = 0;

    function playSound() {
      let audio = document.getElementById('kitchen-alert-sound');
      if (audio) {
        audio.currentTime = 0;
        audio.play().catch(e => console.log(e));
      }
    }

    function formatDateTime(timestamp) {
      if (!timestamp) return 'N/A';
      let d = new Date(timestamp);
      return `${d.toLocaleDateString([], {month:'short', day:'numeric'})}, ${d.toLocaleTimeString([], {hour:'2-digit', minute:'2-digit'})}`;
    }

    db.ref('orders').on('value', snap => {
      allOrders = snap.val() || {};
      let keys = Object.keys(allOrders);
      
      let activeKeys = keys.filter(k => allOrders[k].status !== 'Cleared');
      if (activeKeys.length > previousOrderCount) {
        playSound();
      }
      previousOrderCount = activeKeys.length;

      renderKitchenOrders();
    });

    db.ref('menu').on('value', snap => {
      menuItems = snap.val() || {};
      renderKitchenMenu();
    });

    function renderKitchenOrders() {
      let container = document.getElementById('kitchen-orders-container');
      container.innerHTML = '';

      let keys = Object.keys(allOrders);
      let activeOrders = keys.filter(id => allOrders[id].status !== 'Cleared' && allOrders[id].status !== 'Archived');

      if (activeOrders.length === 0) {
        container.innerHTML = `<p style="color: var(--text-muted);">No active orders right now.</p>`;
        return;
      }

      activeOrders.reverse().forEach(id => {
        let order = allOrders[id];
        let prepBadge = order.status === 'Pending' ? 'badge-pending' : (order.status === 'Completed' ? 'badge-completed' : 'badge-preparing');
        let payBadge = order.paymentStatus && order.paymentStatus.includes('Paid') ? 'badge-paid' : 'badge-unpaid';
        let itemsHtml = order.items ? order.items.map(i => `<li>${i}</li>`).join('') : '';

        container.innerHTML += `
          <div class="order-card">
            <div style="display:flex; justify-content:space-between; align-items:center; margin-bottom:6px;">
              <strong>Table ${order.table} (#${id.slice(-5)})</strong>
              <div style="display:flex; gap:4px;">
                <span class="badge ${prepBadge}">${order.status}</span>
                <span class="badge ${payBadge}">${order.paymentStatus || 'Unpaid'}</span>
              </div>
            </div>
            <p style="font-size:11px; color:var(--text-muted); margin:2px 0 6px 0;">Time: ${formatDateTime(order.timestamp)} | Mode: <strong>${order.paymentMode || 'UPI'}</strong></p>
            <ul style="margin: 5px 0 10px 0; padding-left: 18px; font-size: 13px;">${itemsHtml}</ul>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px; border-top:1px solid rgba(255,255,255,0.05); padding-top:8px;">
              <span style="font-size:13px; font-weight:bold;">₹${order.total}</span>
              <div style="display:flex; gap:4px; flex-wrap:wrap;">
                ${order.status === 'Pending' ? `<button class="btn" style="background:var(--orange);" onclick="updateStatus('${id}', 'Preparing')">Start Cooking</button>` : ''}
                ${order.status !== 'Completed' ? `<button class="btn" style="background:var(--green); color:#fff;" onclick="updateStatus('${id}', 'Completed')">Mark Ready</button>` : ''}
                ${(!order.paymentStatus || order.paymentStatus === 'Unpaid') ? `<button class="btn" style="background:var(--blue); color:#fff;" onclick="markPaid('${id}')">Mark Paid</button>` : ''}
                <button class="btn" style="background:var(--red); color:#fff;" onclick="clearOrder('${id}')">Clear ✕</button>
              </div>
            </div>
          </div>`;
      });
    }

    function renderKitchenMenu() {
      let container = document.getElementById('kitchen-menu-container');
      container.innerHTML = '';

      Object.keys(menuItems).forEach(id => {
        let item = menuItems[id];
        let inStock = item.inStock !== false;
        container.innerHTML += `
          <div style="display:flex; justify-content:space-between; align-items:center; background:rgba(15,23,42,0.6); padding:10px; border-radius:8px; border:1px solid rgba(255,255,255,0.05);">
            <div>
              <span style="font-weight:600; font-size:13px; display:block;">${item.name}</span>
              <span style="font-size:11px; color:var(--text-muted);">₹${item.price}</span>
            </div>
            <button class="btn" style="background: ${inStock ? 'var(--green)' : 'var(--red)'}; color: #fff;" onclick="toggleStock('${id}', ${inStock})">
              ${inStock ? 'In Stock ✓' : 'Sold Out ✕'}
            </button>
          </div>`;
      });
    }

    function updateStatus(id, newStatus) {
      db.ref(`orders/${id}`).update({ status: newStatus });
    }

    function markPaid(id) {
      db.ref(`orders/${id}`).update({ paymentStatus: 'Paid' });
    }

    function clearOrder(id) {
      if (confirm('Are you sure you want to clear/archive this order?')) {
        db.ref(`orders/${id}`).update({ status: 'Cleared' });
      }
    }

    function toggleStock(id, currentStatus) {
      db.ref(`menu/${id}`).update({ inStock: !currentStatus });
    }
  </script>
</body>
</html>
