<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kitchen Display System (KDS)</title>
  <style>
    :root {
      --bg: #090d16; --card: #151c2c; --border: #27354f; --text: #f1f5f9;
      --muted: #64748b; --accent: #3b82f6; --success: #10b981; --warning: #f59e0b; --danger: #ef4444;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: system-ui, sans-serif; }
    body { background: var(--bg); color: var(--text); padding: 15px; height: 100vh; display: flex; flex-direction: column; gap: 15px; }

    .top-bar { display: flex; justify-content: space-between; align-items: center; background: var(--card); padding: 12px 20px; border-radius: 8px; border: 1px solid var(--border); }
    .stats { display: flex; gap: 20px; }
    .stat-item { font-size: 0.9rem; }
    .stat-val { font-weight: bold; color: var(--accent); }

    .summary-bar { background: #111827; border: 1px dashed var(--border); padding: 10px 15px; border-radius: 8px; display: flex; gap: 15px; align-items: center; overflow-x: auto; }
    .summary-tag { background: var(--card); padding: 4px 10px; border-radius: 4px; font-size: 0.85rem; border: 1px solid var(--border); }

    .kds-grid { flex: 1; display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; overflow-y: auto; align-content: start; }
    
    .order-ticket { background: var(--card); border: 2px solid var(--border); border-radius: 8px; display: flex; flex-direction: column; overflow: hidden; position: relative; }
    .order-ticket.priority-High { border-color: var(--warning); }
    .order-ticket.priority-VIP { border-color: var(--danger); }
    
    .ticket-header { padding: 10px; background: rgba(255,255,255,0.03); border-bottom: 1px solid var(--border); display: flex; justify-content: space-between; align-items: center; }
    .timer { font-weight: bold; font-family: monospace; padding: 2px 6px; border-radius: 4px; background: #000; }
    .timer.green { color: var(--success); }
    .timer.yellow { color: var(--warning); }
    .timer.red { color: var(--danger); animation: pulse 1s infinite; }

    .ticket-body { padding: 12px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .ticket-item { display: flex; justify-content: space-between; font-size: 1.05rem; font-weight: 600; }

    .ticket-actions { padding: 10px; background: rgba(0,0,0,0.2); border-top: 1px solid var(--border); display: flex; gap: 8px; }
    .btn-action { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
    .btn-prep { background: var(--accent); }
    .btn-ready { background: var(--success); }
    .btn-done { background: var(--muted); }

    @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.4; } }
  </style>
</head>
<body>

  <div class="top-bar">
    <h2>Kitchen Display Terminal (KDS)</h2>
    <div class="stats">
      <div class="stat-item">Active Orders: <span class="stat-val" id="activeCount">0</span></div>
      <div class="stat-item">Avg Prep Time: <span class="stat-val">~8m</span></div>
    </div>
    <button onclick="clearAllOrders()" style="background: var(--danger); border:none; color:#fff; padding:6px 12px; border-radius:4px; cursor:pointer;">Reset Demo</button>
  </div>

  <div class="summary-bar" id="summaryBar">
    <strong style="font-size:0.85rem; color:var(--muted);">TOTAL PREP SUMMARY:</strong>
    <div id="summaryItems" style="display:flex; gap:8px;"></div>
  </div>

  <div class="kds-grid" id="kdsGrid"></div>

  <script>
    const channel = new BroadcastChannel("restaurant_kds");

    function init() {
      renderKDS();
      setInterval(renderKDS, 1000); // Live timer ticker
      listenForOrders();
    }

    function listenForOrders() {
      channel.onmessage = (e) => {
        if (e.data.type === "NEW_ORDER") {
          playAlert();
          renderKDS();
        }
      };
      window.addEventListener("storage", renderKDS);
    }

    function getOrders() {
      return JSON.parse(localStorage.getItem("kds_orders") || "[]");
    }

    function saveOrders(orders) {
      localStorage.setItem("kds_orders", JSON.stringify(orders));
    }

    function updateStatus(id, newStatus) {
      const orders = getOrders();
      const order = orders.find(o => o.id === id);
      if (order) {
        order.status = newStatus;
        saveOrders(orders);
        channel.postMessage({ type: "STATUS_UPDATE", id, status: newStatus });
        renderKDS();
      }
    }

    function renderKDS() {
      const orders = getOrders().filter(o => o.status !== "Completed");
      document.getElementById("activeCount").innerText = orders.length;

      renderSummary(orders);

      const grid = document.getElementById("kdsGrid");
      if (orders.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; text-align:center; color:var(--muted); margin-top:80px;"><h3>No active orders in queue</h3></div>`;
        return;
      }

      grid.innerHTML = orders.map(order => {
        const elapsedSec = Math.floor((Date.now() - order.timestamp) / 1000);
        const mins = Math.floor(elapsedSec / 60);
        const secs = (elapsedSec % 60).toString().padStart(2, "0");
        
        let timerClass = "green";
        if (mins >= 5) timerClass = "yellow";
        if (mins >= 10) timerClass = "red";

        return `
          <div class="order-ticket priority-${order.priority}">
            <div class="ticket-header">
              <div>
                <strong>${order.id}</strong>
                <div style="font-size:0.8rem; color:var(--muted);">${order.table} • ${order.priority}</div>
              </div>
              <div class="timer ${timerClass}">${mins}:${secs}</div>
            </div>
            <div class="ticket-body">
              ${order.items.map(i => `
                <div class="ticket-item">
                  <span>${i.qty}x ${i.name}</span>
                </div>
              `).join("")}
            </div>
            <div class="ticket-actions">
              ${order.status === "Pending" ? `
                <button class="btn-action btn-prep" onclick="updateStatus('${order.id}', 'Preparing')">Start Cooking</button>
              ` : order.status === "Preparing" ? `
                <button class="btn-action btn-ready" onclick="updateStatus('${order.id}', 'Ready')">Mark Ready</button>
              ` : `
                <button class="btn-action btn-done" onclick="updateStatus('${order.id}', 'Completed')">Bump / Clear</button>
              `}
            </div>
          </div>
        `;
      }).join("");
    }

    function renderSummary(orders) {
      const itemCounts = {};
      orders.forEach(o => {
        o.items.forEach(i => {
          itemCounts[i.name] = (itemCounts[i.name] || 0) + i.qty;
        });
      });

      const container = document.getElementById("summaryItems");
      const entries = Object.entries(itemCounts);
      if (entries.length === 0) {
        container.innerHTML = `<span style="font-size:0.85rem; color:var(--muted);">None</span>`;
      } else {
        container.innerHTML = entries.map(([name, qty]) => `
          <div class="summary-tag"><strong>${qty}x</strong> ${name}</div>
        `).join("");
      }
    }

    function clearAllOrders() {
      if (confirm("Clear all active and completed orders?")) {
        localStorage.removeItem("kds_orders");
        channel.postMessage({ type: "STATUS_UPDATE" });
        renderKDS();
      }
    }

    function playAlert() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        osc.type = "triangle";
        osc.frequency.setValueAtTime(587.33, ctx.currentTime);
        osc.frequency.setValueAtTime(880, ctx.currentTime + 0.15);
        osc.connect(ctx.destination);
        osc.start();
        osc.stop(ctx.currentTime + 0.3);
      } catch (e) {}
    }

    init();
  </script>
</body>
</html>
