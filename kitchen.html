<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Kitchen Command Nexus</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@400;700;900&family=Share+Tech+Mono&display=swap');

        body {
            background-color: #050510;
            background-image: 
                radial-gradient(circle at 15% 50%, rgba(0, 255, 255, 0.05), transparent 25%),
                radial-gradient(circle at 85% 30%, rgba(255, 0, 255, 0.05), transparent 25%);
            color: #e0e7ff;
            font-family: 'Share Tech Mono', monospace;
            overflow-x: hidden;
        }

        h1, h2, h3, .ai-font {
            font-family: 'Orbitron', sans-serif;
        }

        /* VFX: Glowing Effects */
        .neon-border {
            box-shadow: 0 0 10px rgba(0, 255, 255, 0.3), inset 0 0 10px rgba(0, 255, 255, 0.1);
            border: 1px solid rgba(0, 255, 255, 0.5);
        }
        
        .neon-border-magenta {
            box-shadow: 0 0 10px rgba(255, 0, 255, 0.3), inset 0 0 10px rgba(255, 0, 255, 0.1);
            border: 1px solid rgba(255, 0, 255, 0.5);
        }

        .neon-text {
            text-shadow: 0 0 8px rgba(0, 255, 255, 0.7);
        }

        /* VFX: Animations */
        @keyframes scanline {
            0% { transform: translateY(-100%); opacity: 0; }
            50% { opacity: 0.1; }
            100% { transform: translateY(100vh); opacity: 0; }
        }

        .scanline-effect::after {
            content: "";
            position: fixed;
            top: 0; left: 0; width: 100vw; height: 10px;
            background: rgba(0, 255, 255, 0.5);
            animation: scanline 4s linear infinite;
            pointer-events: none;
            z-index: 9999;
        }

        @keyframes pulse-glow {
            0%, 100% { opacity: 1; transform: scale(1); }
            50% { opacity: 0.8; transform: scale(1.02); }
        }

        .order-card {
            transition: all 0.3s ease;
            animation: pulse-glow 3s infinite alternate;
        }
        
        .order-card:hover {
            transform: translateY(-2px) scale(1.02);
            filter: brightness(1.2);
        }

        /* Scrollbar */
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #000; }
        ::-webkit-scrollbar-thumb { background: #0ff; border-radius: 10px; }
    </style>
</head>
<body class="scanline-effect h-screen flex flex-col p-4">

    <!-- Header -->
    <header class="flex justify-between items-center pb-4 border-b border-cyan-900/50 mb-4">
        <div>
            <h1 class="text-3xl font-black text-cyan-400 neon-text tracking-widest uppercase">
                <i class="fa-solid fa-microchip mr-2"></i> Kitchen AI Core
            </h1>
            <p class="text-xs text-cyan-700 mt-1">System Status: <span class="text-green-400 animate-pulse">ONLINE & OPTIMIZED</span></p>
        </div>
        <div class="text-right">
            <h2 class="text-2xl font-bold text-magenta-400" id="totalRevenue">₹0.00</h2>
            <p class="text-xs text-slate-500">Gross Clearance Tally</p>
        </div>
    </header>

    <!-- Main Grid -->
    <main class="grid grid-cols-12 gap-6 flex-1 overflow-hidden">
        
        <!-- POS / Menu Input (Left) -->
        <section class="col-span-4 flex flex-col gap-4">
            <div class="bg-gray-900/50 backdrop-blur-md p-4 rounded-xl neon-border h-full flex flex-col">
                <h3 class="text-lg text-cyan-300 mb-4 border-b border-cyan-800 pb-2"><i class="fa-solid fa-bell-concierge"></i> Dispatch Order</h3>
                
                <div class="grid grid-cols-2 gap-3 mb-4 overflow-y-auto pr-2" id="menuGrid">
                    <!-- Menu items generated by JS -->
                </div>

                <div class="mt-auto border-t border-cyan-800 pt-4">
                    <button onclick="dispatchAIOrder()" class="w-full bg-cyan-900/50 hover:bg-cyan-700 text-cyan-100 font-bold py-3 rounded border border-cyan-500 transition-all active:scale-95 shadow-[0_0_15px_rgba(0,255,255,0.4)]">
                        <i class="fa-solid fa-satellite-dish"></i> TRANSMIT ORDER TO KITCHEN
                    </button>
                </div>
            </div>
        </section>

        <!-- Active Kitchen Queue (Middle) -->
        <section class="col-span-4 flex flex-col gap-4">
            <div class="bg-gray-900/50 backdrop-blur-md p-4 rounded-xl neon-border h-full flex flex-col">
                <h3 class="text-lg text-yellow-300 mb-4 border-b border-yellow-800 pb-2 flex justify-between">
                    <span><i class="fa-solid fa-fire-burner"></i> Live Queue</span>
                    <span id="activeCount" class="bg-yellow-900/50 text-yellow-200 px-2 rounded-full text-sm">0</span>
                </h3>
                
                <div id="kitchenQueue" class="flex-1 overflow-y-auto space-y-3 pr-2">
                    <!-- Orders generated here -->
                </div>
            </div>
        </section>

        <!-- Billing & Clearance (Right) -->
        <section class="col-span-4 flex flex-col gap-4">
            <div class="bg-gray-900/50 backdrop-blur-md p-4 rounded-xl neon-border-magenta h-full flex flex-col">
                <h3 class="text-lg text-fuchsia-400 mb-4 border-b border-fuchsia-800 pb-2"><i class="fa-solid fa-file-invoice-dollar"></i> Bill Clearance</h3>
                
                <div id="clearanceLog" class="flex-1 overflow-y-auto space-y-2 pr-2">
                    <!-- Cleared bills here -->
                </div>
            </div>
        </section>

    </main>

    <!-- FSX (Sound Engine) & Application Logic -->
    <script>
        // ================= FSX SOUND ENGINE (Web Audio API) =================
        const audioCtx = new (window.AudioContext || window.webkitAudioContext)();
        
        const fsx = {
            playTone: (freq, type, duration, vol) => {
                if(audioCtx.state === 'suspended') audioCtx.resume();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.type = type;
                osc.frequency.setValueAtTime(freq, audioCtx.currentTime);
                gain.gain.setValueAtTime(vol, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + duration);
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            },
            click: () => fsx.playTone(600, 'sine', 0.1, 0.1),
            alert: () => {
                fsx.playTone(800, 'square', 0.15, 0.05);
                setTimeout(() => fsx.playTone(1200, 'square', 0.2, 0.05), 150);
            },
            success: () => {
                fsx.playTone(400, 'sine', 0.1, 0.1);
                setTimeout(() => fsx.playTone(600, 'sine', 0.1, 0.1), 100);
                setTimeout(() => fsx.playTone(800, 'sine', 0.3, 0.1), 200);
            }
        };

        // ================= AI KITCHEN DATA =================
        const menu = [
            { id: 1, name: "Cyber Burger", price: 450, time: "8m" },
            { id: 2, name: "Neon Noodles", price: 320, time: "5m" },
            { id: 3, name: "Quantum Pizza", price: 850, time: "12m" },
            { id: 4, name: "Glitch Fries", price: 150, time: "3m" },
            { id: 5, name: "Plasma Shake", price: 200, time: "2m" },
            { id: 6, name: "Matrix Sushi", price: 600, time: "10m" }
        ];

        let pendingOrderCart = [];
        let liveOrders = [];
        let clearedBills = [];
        let totalRevenue = 0;
        let orderCounter = 1000;

        // ================= INITIALIZATION =================
        function initMenu() {
            const grid = document.getElementById('menuGrid');
            menu.forEach(item => {
                grid.innerHTML += `
                    <div onclick="addToCart(${item.id})" class="cursor-pointer bg-slate-800/50 hover:bg-cyan-900/40 border border-slate-700 hover:border-cyan-500 rounded p-2 transition-all flex flex-col items-center text-center">
                        <span class="text-sm font-bold text-gray-200">${item.name}</span>
                        <span class="text-cyan-400 text-xs">₹${item.price}</span>
                        <span class="text-[10px] text-gray-500 mt-1"><i class="fa-solid fa-clock"></i> AI Est: ${item.time}</span>
                    </div>
                `;
            });
        }

        // ================= BUSINESS LOGIC =================
        function addToCart(id) {
            fsx.click();
            const item = menu.find(m => m.id === id);
            pendingOrderCart.push(item);
            
            // Visual feedback on the button area
            const btn = document.querySelector('button');
            btn.innerHTML = `<i class="fa-solid fa-cart-plus"></i> ITEMS SCANNED: ${pendingOrderCart.length}`;
            btn.classList.add('bg-cyan-600');
            setTimeout(() => { btn.classList.remove('bg-cyan-600'); }, 200);
        }

        function dispatchAIOrder() {
            if (pendingOrderCart.length === 0) {
                alert("Cart is empty! Scan items first.");
                return;
            }
            
            fsx.alert();
            orderCounter++;
            
            const newOrder = {
                id: `ORD-${orderCounter}`,
                items: [...pendingOrderCart],
                total: pendingOrderCart.reduce((sum, item) => sum + item.price, 0),
                status: 'COOKING',
                timestamp: new Date().toLocaleTimeString()
            };

            liveOrders.unshift(newOrder);
            pendingOrderCart = []; // clear cart
            
            document.querySelector('button').innerHTML = `<i class="fa-solid fa-satellite-dish"></i> TRANSMIT ORDER TO KITCHEN`;
            renderKitchenQueue();
        }

        function clearOrder(orderId) {
            fsx.success();
            
            const orderIndex = liveOrders.findIndex(o => o.id === orderId);
            const order = liveOrders[orderIndex];
            
            // Move to cleared
            order.status = 'CLEARED';
            clearedBills.unshift(order);
            liveOrders.splice(orderIndex, 1);
            
            // Update Revenue
            totalRevenue += order.total;
            document.getElementById('totalRevenue').innerText = `₹${totalRevenue.toLocaleString()}`;
            
            renderKitchenQueue();
            renderClearanceLog();
        }

        // ================= RENDERING / VFX UI =================
        function renderKitchenQueue() {
            const queue = document.getElementById('kitchenQueue');
            document.getElementById('activeCount').innerText = liveOrders.length;
            queue.innerHTML = '';

            liveOrders.forEach(order => {
                const itemsList = order.items.map(i => `${i.name}`).join(', ');
                
                queue.innerHTML += `
                    <div class="order-card bg-black/60 border border-yellow-500/50 p-3 rounded shadow-[0_0_10px_rgba(234,179,8,0.2)]">
                        <div class="flex justify-between items-center mb-2 border-b border-gray-700 pb-1">
                            <span class="text-yellow-400 font-bold">#${order.id}</span>
                            <span class="text-[10px] text-gray-400">${order.timestamp}</span>
                        </div>
                        <p class="text-xs text-gray-300 mb-3">${itemsList}</p>
                        <div class="flex justify-between items-center">
                            <span class="text-xs bg-yellow-900/50 text-yellow-300 px-2 py-1 rounded animate-pulse">
                                <i class="fa-solid fa-spinner fa-spin"></i> COOKING
                            </span>
                            <button onclick="clearOrder('${order.id}')" class="bg-green-900/50 hover:bg-green-600 text-green-300 border border-green-500 px-3 py-1 text-xs rounded transition-all">
                                <i class="fa-solid fa-check-double"></i> CLEAR BILL
                            </button>
                        </div>
                    </div>
                `;
            });
        }

        function renderClearanceLog() {
            const log = document.getElementById('clearanceLog');
            log.innerHTML = '';

            clearedBills.forEach(bill => {
                log.innerHTML += `
                    <div class="bg-fuchsia-950/30 border-l-4 border-fuchsia-500 p-2 rounded mb-2 flex justify-between items-center">
                        <div>
                            <div class="text-fuchsia-300 font-bold text-sm">#${bill.id}</div>
                            <div class="text-[10px] text-gray-500">Cleared at ${new Date().toLocaleTimeString()}</div>
                        </div>
                        <div class="text-right">
                            <div class="text-green-400 font-bold">₹${bill.total}</div>
                            <div class="text-[10px] text-cyan-500 uppercase">Paid in Full</div>
                        </div>
                    </div>
                `;
            });
        }

        // Boot system
        window.onload = () => {
            initMenu();
        };
    </script>
</body>
</html>
