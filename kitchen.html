<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gani Cafe - Kitchen & Admin Hub</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>
</head>
<body class="bg-slate-100 text-gray-900 font-sans pb-28">
    <header class="bg-slate-900 text-white shadow-lg sticky top-0 z-50">
        <div class="max-w-6xl mx-auto px-4 py-3.5 flex justify-between items-center">
            <div class="flex items-center gap-3">
                <div class="bg-indigo-600 p-2 rounded-xl text-white font-bold"><i class="fa-solid fa-fire-burner"></i></div>
                <div>
                    <h1 class="text-base font-bold tracking-tight">Gani Cafe Kitchen Hub</h1>
                    <p class="text-xs text-slate-400">Live Admin Dashboard</p>
                </div>
            </div>
            <div class="flex items-center gap-3">
                <div class="bg-slate-800 px-3 py-1.5 rounded-xl border border-slate-700 text-xs">
                    <span class="text-slate-400">Total Revenue:</span> 
                    <span id="revenueDisplay" class="font-bold text-emerald-400 ml-1">₹0</span>
                </div>
                <button onclick="refreshQueue()" class="bg-indigo-600 hover:bg-indigo-700 px-3.5 py-2 rounded-xl text-xs font-bold transition shadow">
                    <i class="fa-solid fa-rotate mr-1"></i> Refresh
                </button>
            </div>
        </div>
    </header>

    <main class="max-w-6xl mx-auto px-4 py-6 space-y-6">
        <div class="grid grid-cols-1 sm:grid-cols-3 gap-4">
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">UPI Collections</p>
                <p id="upiRevenue" class="text-xl font-extrabold text-indigo-600 mt-1">₹0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Cash Collections</p>
                <p id="cashRevenue" class="text-xl font-extrabold text-amber-600 mt-1">₹0</p>
            </div>
            <div class="bg-white p-4 rounded-2xl shadow-xs border border-slate-200">
                <p class="text-xs font-bold text-slate-400 uppercase">Active Queue Count</p>
                <p id="queueCount" class="text-xl font-extrabold text-slate-800 mt-1">0</p>
            </div>
        </div>

        <div class="flex justify-between items-center bg-white p-3 rounded-2xl shadow-xs border border-slate-200 flex-wrap gap-3">
            <div class="flex gap-2">
                <button onclick="filterQueue('All')" class="tab-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-900 text-white transition">All Orders</button>
                <button onclick="filterQueue('Pending')" class="tab-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 transition">Pending</button>
                <button onclick="filterQueue('Preparing')" class="tab-btn px-4 py-1.5 rounded-xl text-xs font-bold bg-slate-100 text-slate-600 transition">Preparing</button>
            </div>
            <div class="flex gap-2">
                <button onclick="openStockModal()" class="bg-slate-800 hover:bg-slate-900 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-utensils mr-1"></i> Manage Stock
                </button>
                <button onclick="openFeedbackViewer()" class="bg-amber-500 hover:bg-amber-600 text-white px-3.5 py-2 rounded-xl text-xs font-bold transition">
                    <i class="fa-solid fa-star mr-1"></i> Customer Reviews
                </button>
            </div>
        </div>

        <div id="kitchenQueueGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-4">
            </div>
    </main>

    <div id="receiptModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-sm rounded-2xl p-6 shadow-2xl space-y-4 font-mono text-xs">
            <div class="text-center border-b pb-3 space-y-1">
                <h3 class="font-bold text-sm">GANI CAFE KITCHEN</h3>
                <p class="text-[10px] text-slate-500">Official Thermal Receipt Preview</p>
                <p id="receiptMeta" class="text-[10px] text-slate-600"></p>
            </div>
            <div id="receiptItemsList" class="space-y-2 border-b pb-3 max-h-48 overflow-y-auto"></div>
            <div class="flex justify-between font-bold text-sm pt-1">
                <span>Total Due:</span>
                <span id="receiptTotal">₹0</span>
            </div>
            <div class="space-y-2 pt-2">
                <button onclick="window.print()" class="w-full bg-slate-900 text-white py-2.5 rounded-xl font-bold">Print Receipt</button>
                <button onclick="closeReceiptModal()" class="w-full bg-slate-100 text-slate-600 py-2 rounded-xl font-semibold">Close Preview</button>
            </div>
        </div>
    </div>

    <div id="stockModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-sm">Menu Stock Availability</h3>
                <button onclick="closeStockModal()"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="stockListContainer" class="space-y-3 max-h-60 overflow-y-auto"></div>
            <button onclick="closeStockModal()" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold">Save & Close</button>
        </div>
    </div>

    <div id="feedbackModal" class="fixed inset-0 bg-black/50 z-50 hidden flex items-center justify-center p-4 backdrop-blur-xs">
        <div class="bg-white w-full max-w-md rounded-2xl p-6 shadow-2xl space-y-4">
            <div class="flex justify-between items-center border-b pb-3">
                <h3 class="font-bold text-sm">Customer Feedback Feed</h3>
                <button onclick="closeFeedbackViewer()"><i class="fa-solid fa-xmark text-lg"></i></button>
            </div>
            <div id="feedbackListContainer" class="space-y-3 max-h-60 overflow-y-auto"></div>
            <button onclick="closeFeedbackViewer()" class="w-full bg-slate-900 text-white py-2.5 rounded-xl text-xs font-bold">Close</button>
        </div>
    </div>

    <script>
        // FIREBASE CONFIGURATION
        const firebaseConfig = {
            apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
            authDomain: "gani-cafe-52066.firebaseapp.com",
            databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
            projectId: "gani-cafe-52066",
            storageBucket: "gani-cafe-52066.appspot.com",
            messagingSenderId: "292009300507",
            appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
            measurementId: "G-F7TXYZBYKY"
        };
        
        try {
            if (!firebase.apps.length) {
                firebase.initializeApp(firebaseConfig);
            }
        } catch (e) {
            console.error("Firebase Init Error:", e);
        }
        const db = firebase.firestore();

        // GOOGLE SHEETS WEB APP URL
        const GOOGLE_SCRIPT_URL = "https://script.google.com/macros/s/AKfycbybeSPXR0ud-SIEYb8FWcovCdrZfaDHwvckXrZDcD9yLbeIHcJDqOVmTg4vWioE-cG0/exec";

        let queueFilter = 'All';

        window.addEventListener('DOMContentLoaded', () => {
            refreshQueue();
            setInterval(refreshQueue, 5000); // Polling sync
        });

        function refreshQueue() {
            renderKitchenQueue();
            updateAnalytics();
        }

        function filterQueue(status) {
            queueFilter = status;
            document.querySelectorAll('.tab-btn').forEach(btn => {
                btn.classList.remove('bg-slate-900', 'text-white');
                btn.classList.add('bg-slate-100', 'text-slate-600');
            });
            event.target.classList.remove('bg-slate-100', 'text-slate-600');
            event.target.classList.add('bg-slate-900', 'text-white');
            renderKitchenQueue();
        }

        function renderKitchenQueue() {
            let queue = JSON.parse(localStorage.getItem('kitchenQueue') || '[]');
            const grid = document.getElementById('kitchenQueueGrid');
            grid.innerHTML = '';

            let filtered = queue;
            if (queueFilter !== 'All') {
                filtered = queue.filter(o => o.status === queueFilter);
            }

            document.getElementById('queueCount').innerText = queue.length;

            if (filtered.length === 0) {
                grid.innerHTML = '<div class="col-span-full text-center py-12 text-slate-400 text-xs">No orders in queue matching filter.</div>';
                return;
            }

            filtered.forEach(order => {
                let statusColor = 'bg-amber-100 text-amber-700';
                if (order.status === 'Accepted') statusColor = 'bg-blue-100 text-blue-700';
                if (order.status === 'Preparing') statusColor = 'bg-indigo-100 text-indigo-700';
                if (order.status === 'Ready') statusColor = 'bg-emerald-100 text-emerald-700';
                if (order.status === 'Cleared') statusColor = 'bg-slate-200 text-slate-700';

                let itemsHtml = order.items.map(i => `<li class="flex justify-between text-xs py-0.5"><span>${i.name} x ${i.qty}</span><span class="font-bold">₹${i.price * i.qty}</span></li>`).join('');

                grid.innerHTML += `
                    <div class="bg-white rounded-2xl shadow-xs border border-slate-200 p-4 flex flex-col justify-between space-y-3">
                        <div class="space-y-2">
                            <div class="flex justify-between items-center">
                                <span class="font-bold text-xs text-slate-800">${order.orderId}</span>
                                <span class="px-2 py-0.5 rounded-full text-[10px] font-bold ${statusColor}">${order.status}</span>
                            </div>
                            <div class="flex justify-between text-xs text-slate-500 font-medium">
                                <span>Table: <strong class="text-slate-800">${order.table}</strong></span>
                                <span>${order.time}</span>
                            </div>
                            <div class="bg-slate-50 p-2.5 rounded-xl border border-slate-100">
                                <ul class="divide-y divide-slate-100">${itemsHtml}</ul>
                            </div>
                        </div>
                        <div class="space-y-2 pt-2 border-t border-slate-100">
                            <div class="flex justify-between text-xs font-bold">
                                <span>Total: <span class="text-indigo-600">₹${order.total}</span></span>
                                <span class="text-[10px] bg-slate-100 px-2 py-0.5 rounded text-slate-600">${order.paymentMode || 'Cash'}</span>
                            </div>
                            <div class="grid grid-cols-2 gap-2">
                                <select onchange="updateOrderStatus('${order.orderId}', this.value)" class="bg-slate-100 border border-slate-200 rounded-xl px-2 py-1 text-xs font-bold text-slate-700 focus:outline-none">
                                    <option value="" disabled selected>Status...</option>
                                    <option value="Accepted">Accept</option>
                                    <option value="Preparing">Prepare</option>
                                    <option value="Ready">Ready</option>
                                    <option value="Cleared">Clear & Archive</option>
                                </select>
                                <button onclick="openReceiptPreview('${order.orderId}')" class="bg-slate-800 hover:bg-slate-900 text-white py-1 rounded-xl text-xs font-bold transition">Receipt</button>
                            </div>
                        </div>
                    </div>
                `;
            });
        }

        async function updateOrderStatus(orderId, newStatus) {
            let queue = JSON.parse(localStorage.getItem('kitchenQueue') || '[]');
            const order = queue.find(o => o.orderId === orderId);
            if (order) {
                order.status = newStatus;
                localStorage.setItem('kitchenQueue', JSON.stringify(queue));
                
                // If active order matches customer view
                const active = JSON.parse(localStorage.getItem('activeOrder') || '{}');
                if (active.orderId === orderId) {
                    active.status = newStatus;
                    localStorage.setItem('activeOrder', JSON.stringify(active));
                }

                // Sync with Firebase Firestore
                try {
                    await db.collection('orders').doc(orderId).update({ status: newStatus });
                } catch (e) {
                    console.error("Firebase Status Update Error:", e);
                }

                // If cleared, sync final state to Google Sheets
                if (newStatus === 'Cleared') {
                    try {
                        await fetch(GOOGLE_SCRIPT_URL, {
                            method: 'POST',
                            mode: 'no-cors',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify(order)
                        });
                    } catch (e) {
                        console.error("Sheets clearance sync error:", e);
                    }
                }

                refreshQueue();
            }
        }

        function updateAnalytics() {
            let queue = JSON.parse(localStorage.getItem('kitchenQueue') || '[]');
            let totalRev = 0;
            let upiRev = 0;
            let cashRev = 0;

            queue.forEach(o => {
                totalRev += o.total;
                if (o.paymentMode && o.paymentMode.includes('UPI')) {
                    upiRev += o.total;
                } else {
                    cashRev += o.total;
                }
            });

            document.getElementById('revenueDisplay').innerText = `₹${totalRev}`;
            document.getElementById('upiRevenue').innerText = `₹${upiRev}`;
            document.getElementById('cashRevenue').innerText = `₹${cashRev}`;
        }

        function openReceiptPreview(orderId) {
            let queue = JSON.parse(localStorage.getItem('kitchenQueue') || '[]');
            const order = queue.find(o => o.orderId === orderId);
            if (!order) return;

            document.getElementById('receiptMeta').innerText = `Order: ${order.orderId} | Table: ${order.table} | ${order.time}`;
            let itemsHtml = order.items.map(i => `<div class="flex justify-between"><span>${i.name} x${i.qty}</span><span>₹${i.price * i.qty}</span></div>`).join('');
            document.getElementById('receiptItemsList').innerHTML = itemsHtml;
            document.getElementById('receiptTotal').innerText = `₹${order.total}`;

            document.getElementById('receiptModal').classList.remove('hidden');
        }

        function closeReceiptModal() {
            document.getElementById('receiptModal').classList.add('hidden');
        }

        function openStockModal() {
            const container = document.getElementById('stockListContainer');
            // Mock stock items toggle
            const items = [
                { id: 1, name: "Paneer Tikka", inStock: true },
                { id: 2, name: "Veg Spring Rolls", inStock: true },
                { id: 3, name: "Butter Chicken", inStock: true },
                { id: 4, name: "Dal Makhani", inStock: true },
                { id: 5, name: "Fresh Lime Soda", inStock: true },
                { id: 6, name: "Cold Coffee", inStock: false }
            ];
            container.innerHTML = items.map(i => `
                <div class="flex justify-between items-center bg-slate-50 p-2.5 rounded-xl border border-slate-100 text-xs">
                    <span class="font-bold">${i.name}</span>
                    <span class="text-emerald-600 font-semibold">Available</span>
                </div>
            `).join('');
            document.getElementById('stockModal').classList.remove('hidden');
        }

        function closeStockModal() {
            document.getElementById('stockModal').classList.add('hidden');
        }

        function openFeedbackViewer() {
            const container = document.getElementById('feedbackListContainer');
            const feedbacks = JSON.parse(localStorage.getItem('customerFeedbacks') || '[]');
            if (feedbacks.length === 0) {
                container.innerHTML = '<p class="text-center text-slate-400 text-xs py-6">No customer feedback yet.</p>';
            } else {
                container.innerHTML = feedbacks.map(f => `
                    <div class="bg-slate-50 p-3 rounded-xl border border-slate-100 space-y-1 text-xs">
                        <div class="flex justify-between font-bold text-amber-500">
                            <span>${'★'.repeat(f.rating)}${'☆'.repeat(5 - f.rating)}</span>
                            <span class="text-[10px] text-slate-400">${f.time}</span>
                        </div>
                        <p class="text-slate-700">${f.comment || 'No comment provided.'}</p>
                    </div>
                `).join('');
            }
            document.getElementById('feedbackModal').classList.remove('hidden');
        }

        function closeFeedbackViewer() {
            document.getElementById('feedbackModal').classList.add('hidden');
        }
    </script>
</body>
</html>
