<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="theme-color" content="#030712">
<title>GANI CAFE — Kitchen</title>

<script src="https://cdn.tailwindcss.com"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-auth.js"></script>
<script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#030712;
 color:#e5e7eb;
 font-family:Inter,system-ui,sans-serif
}

.card{
 background:rgba(17,24,39,.75);
 border:1px solid rgba(255,255,255,.08);
 box-shadow:0 20px 60px rgba(0,0,0,.25)
}

.order{
 background:rgba(31,41,55,.42);
 border:1px solid rgba(255,255,255,.08)
}

.status{
 display:inline-block;
 padding:5px 9px;
 border-radius:8px;
 font-size:10px;
 font-weight:900;
 border:1px solid rgba(255,255,255,.12)
}

.kpi{
 background:linear-gradient(
  135deg,
  rgba(245,158,11,.12),
  rgba(17,24,39,.65)
 )
}
</style>
</head>

<body>

<div class="max-w-7xl mx-auto p-4 sm:p-6">

<!-- HEADER -->

<header class="card rounded-3xl p-5 mb-6 flex flex-col sm:flex-row justify-between gap-4">

 <div>

  <h1 class="text-2xl sm:text-3xl font-black">
  GANI CAFE
  </h1>

  <p class="text-[10px] text-slate-500 tracking-[.25em] uppercase">
  Kitchen & Cashier Console
  </p>

 </div>

 <div id="connection"
 class="text-xs text-slate-500 self-center">
 CONNECTING...
 </div>

</header>

<!-- LOGIN -->

<section id="loginPanel"
class="max-w-md mx-auto card rounded-3xl p-6">

 <h2 class="text-xl font-black mb-1">
 Staff Login
 </h2>

 <p class="text-xs text-slate-500 mb-5">
 Authorized Firebase staff account required.
 </p>

 <input
 id="email"
 type="email"
 autocomplete="username"
 placeholder="Staff email"
 class="w-full mb-3 bg-slate-950 border border-slate-700 rounded-xl px-3 py-3">

 <input
 id="password"
 type="password"
 autocomplete="current-password"
 placeholder="Password"
 class="w-full mb-3 bg-slate-950 border border-slate-700 rounded-xl px-3 py-3">

 <button
 onclick="login()"
 class="w-full py-3 rounded-xl bg-amber-500 text-black font-black">
 SIGN IN
 </button>

 <p id="loginError"
 class="text-xs text-rose-400 mt-3">
 </p>

</section>

<!-- STAFF -->

<section id="staffPanel" class="hidden">

<!-- KPIs -->

<div class="grid grid-cols-2 md:grid-cols-5 gap-3 mb-5">

 <div class="kpi rounded-2xl p-4">
  <p class="text-[9px] text-slate-500">ACTIVE</p>
  <b id="activeCount" class="text-2xl">0</b>
 </div>

 <div class="kpi rounded-2xl p-4">
  <p class="text-[9px] text-slate-500">PENDING</p>
  <b id="pendingCount" class="text-2xl text-rose-400">0</b>
 </div>

 <div class="kpi rounded-2xl p-4">
  <p class="text-[9px] text-slate-500">PREPARING</p>
  <b id="preparingCount" class="text-2xl text-amber-400">0</b>
 </div>

 <div class="kpi rounded-2xl p-4">
  <p class="text-[9px] text-slate-500">READY</p>
  <b id="readyCount" class="text-2xl text-emerald-400">0</b>
 </div>

 <div class="kpi rounded-2xl p-4">
  <p class="text-[9px] text-slate-500">UNPAID</p>
  <b id="unpaidCount" class="text-2xl text-cyan-400">0</b>
 </div>

</div>

<!-- BOARD -->

<div class="card rounded-3xl p-5">

 <div class="flex flex-col sm:flex-row justify-between gap-3 mb-5">

  <div>

   <h2 class="text-xl font-black">
   Kitchen Orders
   </h2>

   <p class="text-xs text-slate-500">
   Orders stay active until the bill is cleared.
   </p>

  </div>

  <button
  onclick="logout()"
  class="px-4 py-2 rounded-xl bg-slate-800 text-xs font-bold">
  SIGN OUT
  </button>

 </div>

 <div id="orders"
 class="grid xl:grid-cols-2 gap-4">
 </div>

</div>

</section>

</div>

<div id="toast"
class="fixed top-5 right-5 z-50 hidden card rounded-xl px-4 py-3 text-sm">
</div>

<script>

const firebaseConfig={
 apiKey:"AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
 authDomain:"gani-cafe-52066.firebaseapp.com",
 databaseURL:"https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
 projectId:"gani-cafe-52066",
 storageBucket:"gani-cafe-52066.firebasestorage.app",
 messagingSenderId:"292009300507",
 appId:"1:292009300507:web:cf524330c2ff4ef4e39ebe",
 measurementId:"G-F7TXYZBYKY"
};

firebase.initializeApp(firebaseConfig);

const auth=firebase.auth();
const db=firebase.database();

let orders={};

const STATUS=[
 "Pending",
 "Accepted",
 "Preparing",
 "Ready",
 "Served",
 "Completed"
];

function esc(v){

 return String(v??"").replace(/[&<>"']/g,c=>({
  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"
 }[c]));

}

function money(v){

 return "₹"+Number(v||0).toLocaleString("en-IN");

}

function toast(message,success=true){

 const el=document.getElementById("toast");

 el.textContent=message;

 el.className=
 "fixed top-5 right-5 z-50 card rounded-xl px-4 py-3 text-sm "+
 (success?"text-emerald-300":"text-rose-300");

 el.classList.remove("hidden");

 setTimeout(()=>{
  el.classList.add("hidden");
 },3000);

}

function statusStyle(status){

 const styles={
  Pending:"text-rose-300 border-rose-500/40 bg-rose-500/10",
  Accepted:"text-sky-300 border-sky-500/40 bg-sky-500/10",
  Preparing:"text-amber-300 border-amber-500/40 bg-amber-500/10",
  Ready:"text-emerald-300 border-emerald-500/40 bg-emerald-500/10",
  Served:"text-violet-300 border-violet-500/40 bg-violet-500/10",
  Completed:"text-slate-300 border-slate-500/40 bg-slate-500/10"
 };

 return styles[status]||
 "text-slate-300 border-slate-700";

}

/* LOGIN */

async function login(){

 const email=
 document.getElementById("email").value.trim();

 const password=
 document.getElementById("password").value;

 document.getElementById("loginError").textContent="";

 if(!email||!password){

  document.getElementById("loginError").textContent=
  "Enter email and password.";

  return;
 }

 try{

  await auth.signInWithEmailAndPassword(
   email,
   password
  );

 }catch(error){

  console.error(error);

  document.getElementById("loginError").textContent=
  error.message;

 }

}

/* LOGOUT */

async function logout(){

 try{

  await auth.signOut();

 }catch(error){

  console.error(error);

 }

}

/* STAFF SECURITY CHECK */

async function requireStaff(){

 const user=auth.currentUser;

 if(!user){

  toast("Please sign in first.",false);

  return false;
 }

 const snapshot=
 await db.ref("staff/"+user.uid).once("value");

 if(!snapshot.exists()){

  toast(
   "This account is not authorized as staff.",
   false
  );

  await auth.signOut();

  return false;
 }

 return true;
}

/* UPDATE ORDER */

async function updateOrder(id,changes){

 if(!(await requireStaff()))return;

 changes.lastUpdatedAt=
 firebase.database.ServerValue.TIMESTAMP;

 try{

  await db.ref("orders/"+id).update(changes);

  toast("Order updated.");

 }catch(error){

  console.error(error);

  toast(
   "Could not update order.",
   false
  );

 }

}

/* NEXT STATUS */

async function nextStatus(id){

 const order=orders[id];

 if(!order)return;

 const index=
 STATUS.indexOf(order.status);

 if(index<0)return;

 if(index>=STATUS.length-1){

  toast("Order is already completed.");

  return;
 }

 const next=STATUS[index+1];

 await updateOrder(id,{
  status:next
 });

}

/* MARK PAID */

async function markPaid(id){

 await updateOrder(id,{
  paymentStatus:"Paid"
 });

}

/* CLEAR BILL */

async function clearBill(id){

 if(!(await requireStaff()))return;

 const order=orders[id];

 if(!order)return;

 if(order.paymentStatus!=="Paid"){

  toast(
   "Payment must be marked Paid first.",
   false
  );

  return;
 }

 if(
  order.status!=="Served" &&
  order.status!=="Completed"
 ){

  toast(
   "Order must be Served or Completed first.",
   false
  );

  return;
 }

 const confirmed=
 confirm(
  "Clear and close this bill?\n\n"+
  "Table: "+order.table+
  "\nBill: "+money(order.total)
 );

 if(!confirmed)return;

 try{

  await db.ref("orders/"+id).update({

   status:"Cleared",

   clearance:{
    cleared:true,
    clearedAt:
     firebase.database.ServerValue.TIMESTAMP,
    clearedBy:auth.currentUser.uid
   },

   lastUpdatedAt:
    firebase.database.ServerValue.TIMESTAMP

  });

  toast("Bill cleared and table closed.");

 }catch(error){

  console.error(error);

  toast(
   "Could not clear bill.",
   false
  );

 }

}

/* RENDER */

function renderOrders(){

 const active=
 Object.values(orders)
 .filter(order=>
  order &&
  order.clearance?.cleared!==true
 )
 .sort((a,b)=>
  (a.createdAt||0)-(b.createdAt||0)
 );

 document.getElementById("activeCount").textContent=
 active.length;

 document.getElementById("pendingCount").textContent=
 active.filter(x=>x.status==="Pending").length;

 document.getElementById("preparingCount").textContent=
 active.filter(x=>x.status==="Preparing").length;

 document.getElementById("readyCount").textContent=
 active.filter(x=>x.status==="Ready").length;

 document.getElementById("unpaidCount").textContent=
 active.filter(x=>x.paymentStatus!=="Paid").length;

 if(!active.length){

  document.getElementById("orders").innerHTML=
  `<p class="text-sm text-slate-600 text-center py-12 xl:col-span-2">
   No uncleared orders.
  </p>`;

  return;
 }

 document.getElementById("orders").innerHTML=
 active.map(order=>{

  const currentIndex=
   STATUS.indexOf(order.status);

  const next=
   currentIndex>=0 &&
   currentIndex<STATUS.length-1
   ?STATUS[currentIndex+1]
   :null;

  return `

  <article class="order rounded-2xl p-5">

   <!-- HEADER -->

   <div class="flex justify-between gap-4 mb-4">

    <div>

     <b class="font-mono">
      #${esc(order.orderId.slice(-6))}
     </b>

     <p class="text-sm text-slate-400 mt-1">
      TABLE ${esc(order.table)}
     </p>

     <p class="text-[10px] text-slate-600 mt-1">
      ${order.createdAt
       ?new Date(order.createdAt).toLocaleString("en-IN")
       :""
      }
     </p>

    </div>

    <div class="text-right">

     <span class="status ${statusStyle(order.status)}">
      ${esc(order.status)}
     </span>

     <p class="text-[10px] mt-2 ${
      order.paymentStatus==="Paid"
      ?"text-emerald-400"
      :"text-cyan-400"
     }">

      PAYMENT:
      ${esc(order.paymentStatus||"Pending")}

     </p>

    </div>

   </div>

   <!-- ITEMS -->

   <div class="space-y-2">

   ${Array.isArray(order.items)
    ?order.items.map(item=>`

     <div class="flex justify-between gap-3
     bg-slate-950/60 rounded-xl p-3">

      <div>

       <p class="text-sm font-semibold">
        ${esc(item.name)}
       </p>

       <p class="text-[10px] text-slate-500">
        ${esc(item.qty)} × ${money(item.unitPrice)}
       </p>

      </div>

      <b class="text-sm text-amber-400">
       ${money(item.subtotal)}
      </b>

     </div>

    `).join("")
    :""
   }

   </div>

   <!-- TOTAL -->

   <div class="border-t border-slate-800 mt-4 pt-4
   flex justify-between">

    <span class="text-xs text-slate-500">
     BILL TOTAL
    </span>

    <strong class="text-xl text-amber-400">
     ${money(order.total)}
    </strong>

   </div>

   <!-- CONTROLS -->

   <div class="grid grid-cols-2 gap-2 mt-4">

    ${
     next
     ?
     `
     <button
     onclick="nextStatus('${esc(order.orderId)}')"
     class="py-3 rounded-xl bg-slate-800
     hover:bg-slate-700 text-xs font-black">
     → ${esc(next)}
     </button>
     `
     :
     `
     <div></div>
     `
    }

    ${
     order.paymentStatus!=="Paid"
     ?
     `
     <button
     onclick="markPaid('${esc(order.orderId)}')"
     class="py-3 rounded-xl
     bg-emerald-500/10
     border border-emerald-500/30
     text-emerald-300 text-xs font-black">
     MARK PAID
     </button>
     `
     :
     `
     <button
     onclick="clearBill('${esc(order.orderId)}')"
     class="py-3 rounded-xl
     bg-amber-500 hover:bg-amber-400
     text-black text-xs font-black">
     CLEAR BILL
     </button>
     `
    }

   </div>

   ${
    (
     order.status==="Served"||
     order.status==="Completed"
    ) &&
    order.paymentStatus==="Paid"
    ?
    `
    <button
    onclick="clearBill('${esc(order.orderId)}')"
    class="w-full mt-2 py-3 rounded-xl
    bg-amber-500 hover:bg-amber-400
    text-black text-xs font-black">
    CLEAR & CLOSE TABLE BILL
    </button>
    `
    :""
   }

  </article>

  `;

 }).join("");

}

/* AUTH */

auth.onAuthStateChanged(async user=>{

 if(user){

  document.getElementById("connection").textContent=
  "CHECKING STAFF ACCESS...";

  try{

   const staffSnapshot=
   await db.ref("staff/"+user.uid).once("value");

   if(staffSnapshot.exists()){

    document.getElementById("loginPanel")
    .classList.add("hidden");

    document.getElementById("staffPanel")
    .classList.remove("hidden");

    document.getElementById("connection").textContent=
    "● STAFF CONNECTED";

    renderOrders();

   }else{

    document.getElementById("loginPanel")
    .classList.remove("hidden");

    document.getElementById("staffPanel")
    .classList.add("hidden");

    document.getElementById("connection").textContent=
    "UNAUTHORIZED";

    await auth.signOut();

    document.getElementById("loginError").textContent=
    "This Firebase account is not registered as staff.";

   }

  }catch(error){

   console.error(error);

   document.getElementById("connection").textContent=
   "DATABASE ERROR";

  }

 }else{

  document.getElementById("loginPanel")
  .classList.remove("hidden");

  document.getElementById("staffPanel")
  .classList.add("hidden");

  document.getElementById("connection").textContent=
  "NOT SIGNED IN";

 }

});

/* LIVE ORDERS */

db.ref("orders").on("value",snapshot=>{

 orders=snapshot.val()||{};

 if(auth.currentUser){

  renderOrders();

 }

});

</script>

</body>
</html>
