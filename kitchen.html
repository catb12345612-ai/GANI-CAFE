<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe | Smart Kitchen & Kiosk AI</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    :root { 
      --bg-dark: #050505; 
      --card-bg: #11131a; 
      --accent-gold: #f59e0b; 
      --accent-emerald: #10b981; 
      --accent-blue: #3b82f6; 
      --accent-ai: #8b5cf6;
      --danger: #ef4444; 
      --text-light: #f9fafb; 
      --text-muted: #9ca3af; 
      --border-color: #272a35; 
    }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    
    /* Header & Nav */
    header { background: rgba(17, 19, 26, 0.9); backdrop-filter: blur(10px); border-bottom: 1px solid var(--border-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; position: sticky; top: 0; z-index: 100;}
    .brand { font-size: 1.5rem; font-weight: 800; background: linear-gradient(90deg, var(--accent-gold), var(--accent-ai)); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
    .nav-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
    .tab-btn { background: #1f2937; border: 1px solid transparent; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; transition: all 0.3s; }
    .tab-btn:hover { background: #374151; }
    .tab-btn.active { background: rgba(139, 92, 246, 0.15); color: var(--accent-ai); border-color: var(--accent-ai); box-shadow: 0 0 10px rgba(139,92,246,0.2); }
    
    .content-area { flex: 1; padding: 20px; overflow-y: auto; }
    
    /* Grid Layouts */
    .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(340px, 1fr)); gap: 18px; }
    
    /* Cards */
    .ticket-card { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; display: flex; flex-direction: column; overflow: hidden; transition: transform 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
    .ticket-head { padding: 15px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; background: rgba(255,255,255,0.02); }
    .ticket-body { padding: 15px; flex: 1; display: flex; flex-direction: column; gap: 12px; font-size: 1.05rem; }
    .ticket-actions { padding: 12px; background: rgba(0,0,0,0.5); display: flex; gap: 8px; flex-wrap: wrap; align-items: center;}
    
    /* Buttons */
    .btn-act { flex: 1; min-width: 90px; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; transition: opacity 0.2s; }
    .btn-act:hover { opacity: 0.8; }
    .btn-outline { background: transparent; border: 1px solid var(--text-muted); color: var(--text-light); }
    
    /* Forms & Inputs */
    .form-box { background: var(--card-bg); padding: 25px; border-radius: 12px; border: 1px solid var(--border-color); }
    input, select, textarea { width: 100%; padding: 10px; margin-top: 5px; margin-bottom: 15px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; outline: none; }
    input:focus, textarea:focus { border-color: var(--accent-ai); }

    /* Customer Kiosk specific */
    .kiosk-container { display: grid; grid-template-columns: 2fr 1fr; gap: 20px; }
    @media (max-width: 800px) { .kiosk-container { grid-template-columns: 1fr; } }
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 15px; align-content: start; }
    .menu-card { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 12px; text-align: center; cursor: pointer; transition: 0.2s; }
    .menu-card:hover { border-color: var(--accent-gold); transform: translateY(-3px); }
    .cart-section { background: var(--card-bg); border: 1px solid var(--border-color); border-radius: 12px; padding: 20px; height: fit-content; position: sticky; top: 20px;}
    .cart-item { border-bottom: 1px solid var(--border-color); padding-bottom: 10px; margin-bottom: 10px; }
    .cart-item-note { font-size: 0.85rem; padding: 5px; background: #1a1c23; border: 1px solid #333; margin-top: 5px; width: 100%; color: var(--accent-gold); }

    /* Tags & Alerts */
    .special-note { background: rgba(245, 158, 11, 0.1); border-left: 3px solid var(--accent-gold); padding: 6px 10px; font-size: 0.9rem; color: var(--accent-gold); margin-top: 4px; border-radius: 0 4px 4px 0;}
    .badge-paid { background: rgba(16,185,129,0.2); color: var(--accent-emerald); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; border: 1px solid var(--accent-emerald); }
    .badge-unpaid { background: rgba(239,68,68,0.2); color: var(--danger); padding: 3px 8px; border-radius: 4px; font-size: 0.8rem; border: 1px solid var(--danger); }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍳 GANI CAFE | SMART SYSTEM</div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabKiosk" onclick="switchTab('kiosk')">🛍️ Customer Kiosk</button>
      <button class="tab-btn" id="tabKds" onclick="switchTab('kds')">🔴 Kitchen (KDS)</button>
      <button class="tab-btn" id="tabMenu" onclick="switchTab('menu')">📦 Menu & Stock</button>
      <button class="tab-btn" id="tabTally" onclick="switchTab('tally')">📊 Analytics</button>
    </div>
  </header>

  <div class="content-area">
    
    <!-- 1. CUSTOMER KIOSK VIEW -->
    <div id="viewKiosk">
      <h2 style="margin-bottom: 15px; color: var(--accent-gold);">Place Your Order</h2>
      <div class="kiosk-container">
        <!-- Menu Items -->
        <div class="menu-grid" id="kioskMenuGrid"></div>
        
        <!-- Cart & Checkout -->
        <div class="cart-section">
          <h3 style="margin-bottom: 15px; display: flex; justify-content: space-between;">
            Your Tray <span id="cartTotal" style="color: var(--accent-emerald);">₹0</span>
          </h3>
          <div id="cartItemsContainer" style="min-height: 150px; max-height: 400px; overflow-y: auto;">
            <p style="color:var(--text-muted); font-size: 0.9rem;">Select items from the menu to build your order.</p>
          </div>
          
          <div style="margin-top: 15px;">
            <label style="font-size: 0.9rem; color: var(--text-muted);">Dining Preference</label>
            <select id="kioskTableSelect">
              <option value="Takeaway">Takeaway / Parcel</option>
              <option value="Table 1">Table 1</option>
              <option value="Table 2">Table 2</option>
              <option value="Table 3">Table 3</option>
            </select>
          </div>

          <button class="btn-act" style="width: 100%; background: var(--accent-emerald); font-size: 1.1rem; padding: 12px; margin-top: 10px;" onclick="placeCustomerOrder()">
            Confirm Order & Download Bill
          </button>
        </div>
      </div>
    </div>

    <!-- 2. LIVE KDS VIEW -->
    <div id="viewKds" style="display: none;">
      <div style="margin-bottom: 15px; color: var(--text-muted); display:flex; justify-content: space-between;">
        <span>Real-time kitchen clearance & payment status.</span>
      </div>
      <div class="kds-grid" id="kdsTicketsContainer"></div>
    </div>

    <!-- 3. MENU & STOCK VIEW -->
    <div id="viewMenu" style="display: none;">
      <div style="display: flex; gap: 20px; flex-wrap: wrap;">
        <div class="form-box" style="flex: 1; min-width: 300px;">
          <h2 style="margin-bottom: 15px;">➕ Add Item</h2>
          <input type="text" id="newItemName" placeholder="Item Name (e.g. Masala Dosa)">
          <input type="number" id="newItemPrice" placeholder="Price (₹)">
          <button class="btn-act" style="background:var(--accent-ai); width: 100%;" onclick="addNewMenuItem()">Save to Menu</button>
        </div>
        <div class="form-box" style="flex: 2; min-width: 300px;">
          <h2 style="margin-bottom: 15px;">📦 Current Stock</h2>
          <div id="stockListContainer"></div>
        </div>
      </div>
    </div>

    <!-- 4. DAILY TRACKER VIEW -->
    <div id="viewTally" style="display: none;">
      <div class="form-box">
        <h2 style="font-size: 2rem;">Total Revenue: <span id="totalRevenueLabel" style="color:var(--accent-emerald);">₹0</span></h2>
        <p id="totalOrdersCountLabel" style="color: var(--text-muted); margin-top: 5px; margin-bottom: 20px;">Total Orders: 0</p>
        <button class="btn-act btn-outline" onclick="downloadEndOfDayReport()">📥 Export EOD Report</button>
      </div>
    </div>

  </div>

  <script>
    // --- FIREBASE INIT ---
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM", authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066", storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507", appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };
    if (!firebase.apps.length) { firebase.initializeApp(firebaseConfig); }
    const db = firebase.database();

    // --- GLOBAL STATE ---
    let ordersData = [];
    let menuData = [];
    let currentCart = [];

    function initSystem() {
      // Listen to Menu
      db.ref("menu").on("value", snapshot => {
        const val = snapshot.val();
        menuData = val ? Object.values(val).filter(i => i && typeof i === 'object') : [];
        renderStockList();
        renderKioskMenu();
      });

      // Listen to Orders
      db.ref("orders").on("value", snapshot => {
        const val = snapshot.val();
        ordersData = val ? Object.values(val).filter(o => o && typeof o === 'object') : [];
        renderKds(); 
        renderTally();
      });
    }

    // --- TAB SWITCHING ---
    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      ["viewKiosk", "viewKds", "viewMenu", "viewTally"].forEach(v => document.getElementById(v).style.display = "none");
      
      const tabId = "tab" + tab.charAt(0).toUpperCase() + tab.slice(1);
      const viewId = "view" + tab.charAt(0).toUpperCase() + tab.slice(1);
      
      document.getElementById(tabId).classList.add("active");
      document.getElementById(viewId).style.display = "block";
    }

    // ==========================================
    // 1. CUSTOMER KIOSK LOGIC
    // ==========================================
    function renderKioskMenu() {
      const grid = document.getElementById("kioskMenuGrid");
      const availableItems = menuData.filter(m => m.inStock !== false);
      
      if(availableItems.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1/-1; color: var(--text-muted);">Menu is currently empty or out of stock.</div>`;
        return;
      }

      grid.innerHTML = availableItems.map(item => `
        <div class="menu-card" onclick="addToCart('${item.id}', '${item.name.replace(/'/g, "\\'")}', ${item.price})">
          <h3 style="margin-bottom: 5px;">${item.name}</h3>
          <span style="color: var(--accent-gold); font-weight: bold;">₹${item.price}</span>
          <div style="margin-top:10px; font-size:0.8rem; color:var(--accent-ai);">+ Add to Tray</div>
        </div>
      `).join("");
    }

    function addToCart(id, name, price) {
      currentCart.push({ id, name, price, qty: 1, note: "" });
      renderCart();
    }

    function updateCartNote(index, note) { currentCart[index].note = note; }
    function removeFromCart(index) { currentCart.splice(index, 1); renderCart(); }

    function renderCart() {
      const container = document.getElementById("cartItemsContainer");
      const totalEl = document.getElementById("cartTotal");
      
      if(currentCart.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted); font-size: 0.9rem;">Tray is empty.</p>`;
        totalEl.innerText = "₹0";
        return;
      }

      let total = 0;
      container.innerHTML = currentCart.map((item, index) => {
        total += item.price;
        return `
        <div class="cart-item">
          <div style="display:flex; justify-content: space-between; align-items:center;">
            <strong>${item.name}</strong>
            <div style="display:flex; align-items:center; gap: 10px;">
              <span style="color:var(--accent-emerald);">₹${item.price}</span>
              <button onclick="removeFromCart(${index})" style="background:transparent; border:none; color:var(--danger); cursor:pointer;">✖</button>
            </div>
          </div>
          <input type="text" class="cart-item-note" placeholder="Instructions (e.g. Less sugar, extra spicy...)" 
                 value="${item.note}" onchange="updateCartNote(${index}, this.value)">
        </div>
      `}).join("");
      
      totalEl.innerText = `₹${total}`;
    }

    function placeCustomerOrder() {
      if(currentCart.length === 0) return alert("Please add items to your tray first!");
      
      const orderId = "ORD_" + Date.now();
      const tableNo = document.getElementById("kioskTableSelect").value;
      const totalAmt = currentCart.reduce((sum, item) => sum + item.price, 0);
      
      const orderPayload = {
        orderId,
        tableNo,
        items: currentCart,
        totalAmount: totalAmt,
        kitchenStatus: "Pending",
        paymentStatus: "Unpaid", // Default to unpaid until cashier collects
        clearanceStatus: "Active",
        timestamp: Date.now()
      };

      // Save to Firebase
      db.ref(`orders/${orderId}`).set(orderPayload).then(() => {
        // Auto-download bill for the customer
        generateCustomerTextBill(orderPayload);
        
        // Reset Kiosk
        currentCart = [];
        renderCart();
        alert("Order sent to Kitchen! Your bill has been downloaded.");
      });
    }

    function generateCustomerTextBill(order) {
      let text = `================================\n`;
      text += `      GANI CAFE - CUSTOMER BILL\n`;
      text += `================================\n`;
      text += `Order ID: ${order.orderId}\n`;
      text += `Dining:   ${order.tableNo}\n`;
      text += `Date:     ${new Date().toLocaleString()}\n`;
      text += `--------------------------------\n`;
      
      order.items.forEach(i => {
        text += `1x ${i.name.padEnd(20)} ₹${i.price}\n`;
        if(i.note && i.note.trim() !== "") {
          text += `   *Note: ${i.note}\n`;
        }
      });
      
      text += `--------------------------------\n`;
      text += `TOTAL AMOUNT TO PAY: ₹${order.totalAmount}\n`;
      text += `Status: ${order.paymentStatus.toUpperCase()}\n`;
      text += `================================\n`;
      text += ` Please show this at the counter. \n`;

      triggerDownload(text, `Bill_${order.orderId}.txt`);
    }

    // ==========================================
    // 2. KITCHEN DISPLAY & ADMIN LOGIC
    // ==========================================
    function renderKds() {
      const container = document.getElementById("kdsTicketsContainer");
      const list = ordersData.filter(o => o.clearanceStatus !== "Cleared");
      
      if (list.length === 0) { 
        container.innerHTML = `<div style="text-align:center; padding: 40px; color: var(--text-muted); width: 100%; grid-column: 1/-1;">✅ Kitchen is clear. Waiting for orders...</div>`; 
        return; 
      }

      container.innerHTML = list.map(o => {
        const isPaid = o.paymentStatus === 'Paid';
        const payBadge = `<span class="${isPaid ? 'badge-paid' : 'badge-unpaid'}">${isPaid ? 'PAID' : 'UNPAID'}</span>`;
        
        return `
        <div class="ticket-card" style="border-color: ${isPaid ? 'var(--border-color)' : 'rgba(239,68,68,0.5)'}">
          <div class="ticket-head">
            <div>
              <strong style="font-size:1.1rem; color:var(--accent-gold);">${o.tableNo}</strong><br>
              <span style="font-size:0.8rem; color:var(--text-muted);">${o.orderId.substring(0,10)}</span>
            </div>
            <div style="text-align: right;">
              <span style="color:${o.kitchenStatus === 'Ready' ? 'var(--accent-emerald)' : 'var(--accent-blue)'}; font-weight: bold;">${o.kitchenStatus}</span><br>
              ${payBadge}
            </div>
          </div>
          <div class="ticket-body">
            ${(o.items || []).map(i => `
              <div>
                <div style="display:flex; justify-content:space-between;">
                  <span><strong>1x</strong> ${i.name}</span>
                </div>
                ${i.note ? `<div class="special-note">⚠️ ${i.note}</div>` : ''}
              </div>
            `).join("")}
          </div>
          <div class="ticket-actions">
            <!-- Payment Toggle -->
            <button class="btn-act btn-outline" style="flex:1; border-color:${isPaid ? 'var(--text-muted)' : 'var(--accent-emerald)'}; color:${isPaid ? 'var(--text-muted)' : 'var(--accent-emerald)'}" 
              onclick="togglePayment('${o.orderId}', ${!isPaid})">
              ${isPaid ? 'Mark Unpaid' : '💰 Mark Paid'}
            </button>
            
            <!-- Kitchen Flow -->
            ${o.kitchenStatus === 'Pending' ? 
              `<button class="btn-act" style="background:var(--accent-blue);" onclick="updateStatus('${o.orderId}', 'Preparing')">Start Prep</button>` : 
              o.kitchenStatus === 'Preparing' ? 
              `<button class="btn-act" style="background:var(--accent-gold);" onclick="updateStatus('${o.orderId}', 'Ready')">Mark Ready</button>` : 
              `<button class="btn-act" style="background:var(--accent-emerald);" onclick="attemptClearance('${o.orderId}', '${o.paymentStatus}')">✔ Clear Order</button>`}
          </div>
        </div>
      `}).join("");
    }

    function updateStatus(id, status) { db.ref(`orders/${id}/kitchenStatus`).set(status); }
    function togglePayment(id, setPaid) { db.ref(`orders/${id}/paymentStatus`).set(setPaid ? "Paid" : "Unpaid"); }
    
    function attemptClearance(id, paymentStatus) {
      if(paymentStatus !== 'Paid') {
        const confirmClear = confirm("⚠️ WARNING: This bill is marked as UNPAID. Are you sure you want to clear this order from the kitchen?");
        if(!confirmClear) return;
      }
      db.ref(`orders/${id}/clearanceStatus`).set("Cleared");
    }

    // ==========================================
    // 3. MENU / ADMIN UTILS
    // ==========================================
    function addNewMenuItem() {
      const name = document.getElementById("newItemName").value.trim();
      const price = parseFloat(document.getElementById("newItemPrice").value);
      if (!name || isNaN(price)) return alert("Item Name and Price are mandatory.");
      
      const id = "itm_" + Date.now();
      db.ref(`menu/${id}`).set({ id, name, price, inStock: true });
      document.getElementById("newItemName").value = '';
      document.getElementById("newItemPrice").value = '';
    }

    function renderStockList() {
      const container = document.getElementById("stockListContainer");
      if (menuData.length === 0) { container.innerHTML = `<p style="color:var(--text-muted);">No items in menu.</p>`; return; }
      
      container.innerHTML = menuData.map(item => `
        <div style="display:flex; justify-content:space-between; align-items: center; padding:12px; border:1px solid var(--border-color); margin-bottom:8px; border-radius:8px; background: rgba(0,0,0,0.2);">
          <div>
            <strong>${item.name}</strong> <span style="color:var(--accent-gold);">₹${item.price}</span>
          </div>
          <button class="btn-act" style="max-width:100px; padding:6px; background:${item.inStock !== false ? 'rgba(239,68,68,0.2)' : 'rgba(16,185,129,0.2)'}; color:${item.inStock !== false ? 'var(--danger)' : 'var(--accent-emerald)'};" 
            onclick="db.ref('menu/${item.id}/inStock').set(${item.inStock === false})">
            ${item.inStock !== false ? 'Mark Out' : 'Restock'}
          </button>
        </div>
      `).join("");
    }

    function renderTally() {
      const totalRev = ordersData.reduce((acc, o) => acc + (Number(o.totalAmount) || 0), 0);
      document.getElementById("totalRevenueLabel").innerText = `₹${totalRev.toLocaleString()}`;
      document.getElementById("totalOrdersCountLabel").innerText = `Total Orders processed: ${ordersData.length}`;
    }

    function downloadEndOfDayReport() {
      let text = `GANI CAFE - END OF DAY REPORT\nDate: ${new Date().toLocaleDateString()}\n\n`;
      const paidOrders = ordersData.filter(o => o.paymentStatus === 'Paid');
      const unpaidOrders = ordersData.filter(o => o.paymentStatus !== 'Paid');
      
      text += `Total Orders: ${ordersData.length}\n`;
      text += `Paid Orders: ${paidOrders.length}\n`;
      text += `Unpaid/Pending Orders: ${unpaidOrders.length}\n`;
      text += `Total Generated Revenue: ₹${ordersData.reduce((a, o) => a + o.totalAmount, 0)}\n\n`;
      triggerDownload(text, `GaniCafe_EOD_Report.txt`);
    }

    function triggerDownload(content, filename) {
      const blob = new Blob([content], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = filename;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);
    }

    // Boot Up
    window.onload = initSystem;
  </script>
</body>
</html>
