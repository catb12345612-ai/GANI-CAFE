<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Kitchen Command Center & Tally</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --gold: #d97706; --bg: #0f172a; --card-bg: rgba(30, 41, 59, 0.7);
      --text: #f8fafc; --text-muted: #94a3b8; --green: #10b981; --red: #ef4444;
    }
    body { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; background: var(--bg); background-image: radial-gradient(circle at top right, #1e293b, #0f172a); color: var(--text); margin: 0; padding: 20px; }
    
    header { background: rgba(15, 23, 42, 0.85); backdrop-filter: blur(12px); padding: 15px 25px; border-radius: 14px; display: flex; justify-content: space-between; align-items: center; border: 1px solid rgba(255,255,255,0.1); margin-bottom: 25px; box-shadow: 0 4px 20px rgba(0,0,0,0.4); }
    .brand { display: flex; align-items: center; gap: 12px; }
    .logo { font-size: 28px; background: linear-gradient(135deg, #d97706, #f59e0b); border-radius: 50%; width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; box-shadow: 0 0 15px rgba(217,119,6,0.4); }
    
    .nav-tabs { display: flex; gap: 10px; flex-wrap: wrap; }
    .nav-btn { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 10px 20px; border-radius: 20px; font-weight: 700; cursor: pointer; transition: all 0.3s; }
    .nav-btn.active { background: var(--gold); color: #000; border-color: var(--gold); box-shadow: 0 0 15px rgba(217,119,6,0.3); }

    .section-view { display: none; }
    .section-view.active { display: block; }

    /* Summary Cards */
    .stats-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 15px; margin-bottom: 25px; }
    .stat-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); padding: 20px; border-radius: 14px; backdrop-filter: blur(5px); }
    .stat-card h4 { margin: 0 0 8px 0; font-size: 13px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 1px; }
    .stat-card .val { font-size: 26px; font-weight: 800; color: var(--gold); margin: 0; }

    /* Tables */
    .data-table-container { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; overflow: hidden; backdrop-filter: blur(5px); margin-bottom: 25px; }
    table { width: 100%; border-collapse: collapse; text-align: left; font-size: 14px; }
    th { background: rgba(15, 23, 42, 0.8); color: var(--gold); padding: 14px 18px; font-weight: 700; border-bottom: 1px solid rgba(255,255,255,0.1); }
    td { padding: 14px 18px; border-bottom: 1px solid rgba(255,255,255,0.05); }
    tr:last-child td { border-bottom: none; }

    /* Filter subtabs */
    .filter-tabs { display: flex; gap: 8px; margin-bottom: 20px; }
    .filter-btn { background: rgba(255,255,255,0.05); border: 1px solid rgba(255,255,255,0.1); color: var(--text-muted); padding: 6px 16px; border-radius: 8px; font-size: 13px; font-weight: 600; cursor: pointer; }
    .filter-btn.active { background: var(--gold); color: #000; border-color: var(--gold); }

    /* Orders Grid */
    .orders-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 20px; }
    .order-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 14px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; }
    .order-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 12px; border-bottom: 1px solid rgba(255,255,255,0.08); padding-bottom: 10px; }
    .badge { padding: 4px 10px; border-radius: 20px; font-size: 11px; font-weight: 800; text-transform: uppercase; }
    .badge-pending { background: rgba(239, 68, 68, 0.2); color: var(--red); border: 1px solid var(--red); }
    .badge-preparing { background: rgba(217, 119, 6, 0.2); color: var(--gold); border: 1px solid var(--gold); }
    .badge-completed { background: rgba(16, 185, 129, 0.2); color: var(--green); border: 1px solid var(--green); }

    .action-btns { display: flex; gap: 8px; margin-top: 15px; }
    .btn { flex: 1; padding: 10px; border-radius: 8px; font-weight: 700; font-size: 12px; cursor: pointer; border: none; text-transform: uppercase; }
    .btn-prep { background: var(--gold); color: #000; }
    .btn-done { background: var(--green); color: #000; }
    .btn-stock { background: #334155; color: #fff; margin-top: 10px; width: 100%; }

    /* Menu stock grid */
    .menu-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 15px; }
    .menu-item-card { background: var(--card-bg); border: 1px solid rgba(255,255,255,0.08); border-radius: 12px; padding: 15px; text-align: center; }
    .menu-item-card img { width: 70px; height: 70px; border-radius: 50%; object-fit: cover; margin-bottom: 10px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">
      <div class="logo">🍳</div>
      <div>
        <h1 style="font-size:18px; margin:0;">GANI CAFE KITCHEN</h1>
        <p style="font-size:11px; margin:0; color:var(--text-muted);">Command Center & Tally Ledger</p>
      </div>
    </div>
    <div class="nav-tabs">
      <button class="nav-btn active" onclick="switchTab('orders', this)">Live Orders 🔥</button>
      <button class="nav-btn" onclick="switchTab('tally', this)">📊 Sales Tally Ledger</button>
      <button class="nav-btn" onclick="switchTab('feedback', this)">⭐ Customer Feedback</button>
      <button class="nav-btn" onclick="switchTab('menu', this)">⚙️ Stock Manager</button>
    </div>
  </header>

  <!-- 1. LIVE ORDERS SECTION -->
  <div id="section-orders" class="section-view active">
    <div id="live-orders-container" class="orders-grid">
      <p style="color: var(--text-muted);">Loading active orders...</p>
    </div>
  </div>

  <!-- 2. SALES TALLY LEDGER SECTION -->
  <div id="section-tally" class="section-view">
    <div class="filter-tabs">
      <button class="filter-btn active" onclick="setTallyFilter('day', this)">Today</button>
      <button class="filter-btn" onclick="setTallyFilter('week', this)">This Week</button>
      <button class="filter-btn" onclick="setTallyFilter('month', this)">This Month</button>
      <button class="filter-btn" onclick="setTallyFilter('year', this)">This Year</button>
      <button class="filter-btn" onclick="setTallyFilter('all', this)">All-Time</button>
    </div>

    <div class="stats-grid">
      <div class="stat-card">
        <h4>Total Revenue</h4>
        <p class="val">₹<span id="tally-revenue">0</span></p>
      </div>
      <div class="stat-card">
        <h4>Total Orders</h4>
        <p class="val" id="tally-orders-count">0</p>
      </div>
      <div class="stat-card">
        <h4>Items Sold</h4>
        <p class="val" id="tally-items-count">0</p>
      </div>
    </div>

    <h3 style="margin-bottom: 12px; color: var(--gold);">Product-wise Sales Tally</h3>
    <div class="data-table-container">
      <table>
        <thead>
          <tr>
            <th>Product Name</th>
            <th>Category</th>
            <th>Units Sold</th>
            <th>Revenue Generated</th>
          </tr>
        </thead>
        <tbody id="tally-product-tbody">
          <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No sales data for this period.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 3. CUSTOMER FEEDBACK SECTION -->
  <div id="section-feedback" class="section-view">
    <div class="data-table-container">
      <table>
        <thead>
          <tr>
            <th>Table</th>
            <th>Rating</th>
            <th>Comment</th>
            <th>Time</th>
          </tr>
        </thead>
        <tbody id="feedback-tbody">
          <tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No feedback received yet.</td></tr>
        </tbody>
      </table>
    </div>
  </div>

  <!-- 4. STOCK MANAGER SECTION -->
  <div id="section-menu" class="section-view">
    <div id="menu-stock-container" class="menu-grid"></div>
  </div>

  <!-- Audio Alert for New Orders / Feedback -->
  <audio id="alert-sound" src="https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3" preload="auto"></audio>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW45oIWKrKEn523lxN2oWY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.appspot.com",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let allOrders = {};
    let menuData = {};
    let allFeedback = {};
    let currentTallyFilter = 'day';
    let previousOrderCount = null;

    // Navigation Tab Switcher
    function switchTab(tabId, btn) {
      document.querySelectorAll('.section-view').forEach(s => s.classList.remove('active'));
      document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
      document.getElementById('section-' + tabId).classList.add('active');
      btn.classList.add('active');
      if (tabId === 'tally') calculateTally();
    }

    // Load Menu Data
    db.ref('menu').on('value', (snapshot) => {
      menuData = snapshot.val() || {};
      renderStockManager();
      if (document.getElementById('section-tally').classList.contains('active')) {
        calculateTally();
      }
    });

    // Load Orders Data
    db.ref('orders').on('value', (snapshot) => {
      allOrders = snapshot.val() || {};
      let orderKeys = Object.keys(allOrders);
      
      // Play sound on brand new pending order
      if (previousOrderCount !== null && orderKeys.length > previousOrderCount) {
        document.getElementById('alert-sound').play().catch(e => console.log(e));
      }
      previousOrderCount = orderKeys.length;

      renderLiveOrders();
      if (document.getElementById('section-tally').classList.contains('active')) {
        calculateTally();
      }
    });

    // Load Feedback Data
    db.ref('feedback').on('value', (snapshot) => {
      allFeedback = snapshot.val() || {};
      renderFeedback();
    });

    // 1. Render Live Orders
    function renderLiveOrders() {
      const container = document.getElementById('live-orders-container');
      container.innerHTML = "";
      let keys = Object.keys(allOrders);

      if (keys.length === 0) {
        container.innerHTML = `<p style="color:var(--text-muted);">No active orders right now.</p>`;
        return;
      }

      keys.reverse().forEach(id => {
        let order = allOrders[id];
        if (order.status === 'Completed' || order.status === 'Cancelled') return; // Hide past orders from kitchen queue

        let badgeClass = order.status === 'Pending' ? 'badge-pending' : 'badge-preparing';
        let itemsHtml = order.items.map(item => `<li>${item}</li>`).join('');

        container.innerHTML += `
          <div class="order-card">
            <div>
              <div class="order-header">
                <span style="font-weight: 800; font-size: 16px; color: var(--gold);">Table ${order.table}</span>
                <span class="badge ${badgeClass}">${order.status}</span>
              </div>
              <p style="font-size:12px; color:var(--text-muted); margin:0 0 8px 0;">Pay: <strong>${order.paymentMode}</strong></p>
              <ul style="margin: 0 0 15px 0; padding-left: 20px; line-height: 1.6;">${itemsHtml}</ul>
            </div>
            <div>
              <div style="font-weight: 800; font-size: 16px; margin-bottom: 10px;">Total: ₹${order.total}</div>
              <div class="action-btns">
                <button class="btn btn-prep" onclick="updateOrderStatus('${id}', 'Preparing')">Prepare 👨‍🍳</button>
                <button class="btn btn-done" onclick="updateOrderStatus('${id}', 'Completed')">Complete ✅</button>
              </div>
            </div>
          </div>`;
      });
    }

    function updateOrderStatus(orderId, status) {
      db.ref(`orders/${orderId}`).update({ status: status });
    }

    // 2. Sales Tally Engine (Day, Week, Month, Year, All)
    function setTallyFilter(filter, btn) {
      currentTallyFilter = filter;
      document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
      btn.classList.add('active');
      calculateTally();
    }

    function calculateTally() {
      let now = new Date();
      let totalRev = 0;
      let totalOrdersCount = 0;
      let totalUnitsSold = 0;
      let productSales = {}; // { productName: { cat, qty, rev } }

      // Initialize product mapping from menu
      Object.keys(menuData).forEach(id => {
        let item = menuData[id];
        productSales[item.name] = { cat: item.cat || 'General', qty: 0, rev: 0, price: item.price };
      });

      Object.keys(allOrders).forEach(id => {
        let order = allOrders[id];
        if (!order.timestamp) return;

        let orderDate = new Date(order.timestamp);
        let includeOrder = false;

        if (currentTallyFilter === 'day') {
          includeOrder = orderDate.toDateString() === now.toDateString();
        } else if (currentTallyFilter === 'week') {
          // Within last 7 days
          let diffTime = Math.abs(now - orderDate);
          let diffDays = diffTime / (1000 * 60 * 60 * 24);
          includeOrder = diffDays <= 7;
        } else if (currentTallyFilter === 'month') {
          includeOrder = orderDate.getMonth() === now.getMonth() && orderDate.getFullYear() === now.getFullYear();
        } else if (currentTallyFilter === 'year') {
          includeOrder = orderDate.getFullYear() === now.getFullYear();
        } else if (currentTallyFilter === 'all') {
          includeOrder = true;
        }

        if (includeOrder) {
          totalRev += (order.total || 0);
          totalOrdersCount++;

          // Parse items e.g., ["2x Masala Chai", "1x Bun Maska"]
          if (order.items && Array.isArray(order.items)) {
            order.items.forEach(itemStr => {
              let match = itemStr.match(/^(\d+)x\s+(.+)$/);
              if (match) {
                let qty = parseInt(match[1]);
                let name = match[2].trim();
                totalUnitsSold += qty;

                if (!productSales[name]) {
                  productSales[name] = { cat: 'Cafe Item', qty: 0, rev: 0, price: 0 };
                }
                productSales[name].qty += qty;
                // find unit price or estimate
                let unitPrice = productSales[name].price || (order.total / totalUnitsSold); 
                productSales[name].rev += qty * unitPrice;
              }
            });
          }
        }
      });

      // Update Summary Cards
      document.getElementById('tally-revenue').innerText = totalRev.toLocaleString();
      document.getElementById('tally-orders-count').innerText = totalOrdersCount;
      document.getElementById('tally-items-count').innerText = totalUnitsSold;

      // Render Product Tally Table
      let tbody = document.getElementById('tally-product-tbody');
      tbody.innerHTML = "";

      let sortedProducts = Object.keys(productSales).sort((a, b) => productSales[b].qty - productSales[a].qty);
      let hasSales = false;

      sortedProducts.forEach(prodName => {
        let p = productSales[prodName];
        if (p.qty > 0) {
          hasSales = true;
          tbody.innerHTML += `
            <tr>
              <td><strong>${prodName}</strong></td>
              <td><span style="font-size:11px; color:var(--gold); text-transform:uppercase;">${p.cat}</span></td>
              <td>${p.qty}</td>
              <td>₹${p.rev.toLocaleString()}</td>
            </tr>`;
        }
      });

      if (!hasSales) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No sales recorded for this timeframe.</td></tr>`;
      }
    }

    // 3. Render Feedback
    function renderFeedback() {
      let tbody = document.getElementById('feedback-tbody');
      tbody.innerHTML = "";
      let keys = Object.keys(allFeedback);

      if (keys.length === 0) {
        tbody.innerHTML = `<tr><td colspan="4" style="text-align:center; color:var(--text-muted);">No feedback received yet.</td></tr>`;
        return;
      }

      keys.reverse().forEach(id => {
        let fb = allFeedback[id];
        let stars = '★'.repeat(fb.rating) + '☆'.repeat(5 - fb.rating);
        let timeStr = new Date(fb.timestamp).toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' });
        tbody.innerHTML += `
          <tr>
            <td><strong>Table ${fb.table}</strong></td>
            <td style="color: var(--gold);">${stars}</td>
            <td>${fb.comment}</td>
            <td style="color: var(--text-muted); font-size:12px;">${timeStr}</td>
          </tr>`;
      });
    }

    // 4. Stock Manager
    function renderStockManager() {
      const container = document.getElementById('menu-stock-container');
      container.innerHTML = "";
      Object.keys(menuData).forEach(id => {
        let item = menuData[id];
        let inStock = item.inStock !== false;
        let btnText = inStock ? '🟢 In Stock' : '🔴 Out of Stock';
        let btnColor = inStock ? 'background: rgba(16,185,129,0.2); color: var(--green); border: 1px solid var(--green);' : 'background: rgba(239,68,68,0.2); color: var(--red); border: 1px solid var(--red);';

        container.innerHTML += `
          <div class="menu-item-card">
            <img src="${item.img}">
            <h4 style="margin:5px 0; font-size:14px;">${item.name}</h4>
            <p style="color:var(--gold); font-weight:700; margin:0 0 10px 0;">₹${item.price}</p>
            <button class="btn" style="${btnColor} width:100%;" onclick="toggleStock('${id}', ${inStock})">${btnText}</button>
          </div>`;
      });
    }

    function toggleStock(id, currentStatus) {
      db.ref(`menu/${id}`).update({ inStock: !currentStatus });
    }
  </script>
</body>
</html>
