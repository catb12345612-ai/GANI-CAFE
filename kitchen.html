<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Kitchen Command & Records</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #05070b; --card-bg: #0d1322; --border: #1a253a;
      --cyan: #06b6d4; --orange: #f59e0b; --green: #10b981; --text: #f8fafc;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; flex-wrap: wrap; gap: 15px; }
    header h1 { margin: 0; color: var(--orange); font-size: 22px; text-transform: uppercase; }
    
    /* Analytics & Tally Dashboard */
    .dashboard-stats { display: grid; grid-template-columns: repeat(auto-fit, minmax(180px, 1fr)); gap: 15px; margin-bottom: 20px; }
    .stat-box { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; border-top: 4px solid var(--cyan); }
    .stat-box h3 { margin: 0 0 5px 0; font-size: 12px; color: #94a3b8; text-transform: uppercase; }
    .stat-box p { margin: 0; font-size: 22px; font-weight: bold; color: var(--green); }

    /* Item Sales Tally Section */
    .tally-section { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 25px; }
    .tally-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(200px, 1fr)); gap: 10px; margin-top: 10px; }
    .tally-card { background: #1e293b; border: 1px solid var(--border); padding: 10px 15px; border-radius: 8px; display: flex; justify-content: space-between; align-items: center; }

    /* Stock & Inventory Section */
    .stock-section { background: var(--card-bg); border: 1px solid var(--border); padding: 15px; border-radius: 10px; margin-bottom: 25px; }
    .stock-grid { display: flex; gap: 10px; overflow-x: auto; padding-top: 10px; }
    .stock-item { background: #1e293b; border: 1px solid var(--border); padding: 8px 12px; border-radius: 8px; font-size: 13px; display: flex; align-items: center; gap: 8px; white-space: nowrap; }
    .stock-toggle { cursor: pointer; padding: 2px 8px; border-radius: 4px; font-weight: bold; font-size: 11px; border: none; }
    .in-stock { background: var(--green); color: #000; }
    .out-stock { background: #ef4444; color: #fff; }

    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; border-left: 6px solid var(--orange); }
    .card.preparing { border-left-color: var(--cyan); }
    .item-list { list-style: none; padding: 0; margin: 12px 0; font-size: 14px; font-weight: bold; }
    .item-list li { padding: 5px 0; border-bottom: 1px dashed var(--border); }
    
    .btn { border: none; padding: 10px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 12px; text-transform: uppercase; width: 100%; margin-top: 8px; }
    .btn-prep { background: var(--cyan); color: #000; }
    .btn-serve { background: var(--green); color: #000; }
    .btn-clear { background: #334155; color: #fff; }
    .btn-verify { background: var(--orange); color: #000; margin-bottom: 5px; }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Gani Cafe Command & Records</h1>
    <div style="background:#1e293b; padding:8px 15px; border-radius:8px; border:1px solid var(--cyan);">
      <span style="font-size:12px; color:var(--cyan);">LIVE ORDERS: <strong id="active-count" style="color:#fff;">0</strong></span>
    </div>
  </header>

  <!-- REVENUE TALLY DASHBOARD -->
  <div class="dashboard-stats">
    <div class="stat-box">
      <h3>📅 Today's Revenue</h3>
      <p id="rev-today">₹0</p>
    </div>
    <div class="stat-box" style="border-top-color: var(--orange);">
      <h3>🗓️ Monthly Revenue</h3>
      <p id="rev-month" style="color: var(--orange);">₹0</p>
    </div>
    <div class="stat-box" style="border-top-color: var(--green);">
      <h3>📈 Yearly Revenue</h3>
      <p id="rev-year">₹0</p>
    </div>
  </div>

  <!-- ITEM-WISE QUANTITIES SOLD TODAY -->
  <div class="tally-section">
    <h3 style="margin:0; font-size:14px; color:var(--cyan);">📦 Today's Item-Wise Quantity Tally (What Sold Today)</h3>
    <div class="tally-grid" id="item-tally-container">
      <p style="color:#64748b; font-size:13px; margin:5px 0;">No items sold yet today.</p>
    </div>
  </div>

  <!-- STOCK & INVENTORY CONTROLS -->
  <div class="stock-section">
    <h3 style="margin:0; font-size:14px; color:var(--orange);">Kitchen Stock Management (Click to Toggle Availability)</h3>
    <div class="stock-grid" id="stock-container"></div>
  </div>

  <!-- LIVE ORDERS KITCHEN GRID -->
  <div class="grid" id="orders-grid"></div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW45oIWKrKEn523lxN2oWY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.appspot.com",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
      measurementId: "G-F7TXYZBYKY"
    };

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let previousActiveCount = 0;

    // Loud High-Tech Kitchen Alarm Synth (Plays when a new order arrives)
    function playAlarm() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch(e) {}
    }

    // Render Stock Toggles in Kitchen
    db.ref('menu').on('value', snapshot => {
      const menu = snapshot.val() || {};
      const container = document.getElementById('stock-container');
      container.innerHTML = "";
      Object.keys(menu).forEach(id => {
        let item = menu[id];
        let btnClass = item.inStock !== false ? 'in-stock' : 'out-stock';
        let btnText = item.inStock !== false ? 'In Stock' : 'Out of Stock';
        container.innerHTML += `
          <div class="stock-item">
            <span>${item.name}</span>
            <button class="stock-toggle ${btnClass}" onclick="toggleStock('${id}', ${item.inStock !== false})">${btnText}</button>
          </div>`;
      });
    });

    function toggleStock(id, currentState) {
      db.ref(`menu/${id}`).update({ inStock: !currentState });
    }

    // Listen to Orders, Calculate Revenues & Item Tally
    db.ref('orders').on('value', (snapshot) => {
      const data = snapshot.val() || {};
      const grid = document.getElementById('orders-grid');
      grid.innerHTML = "";

      let todayRev = 0, monthRev = 0, yearRev = 0;
      let todayItemCounts = {};
      const now = new Date();
      const currentDay = now.toDateString();
      const currentMonth = now.getMonth();
      const currentYear = now.getFullYear();

      const orders = Object.values(data).filter(o => o.status !== 'Cleared');
      document.getElementById('active-count').innerText = orders.length;

      // Trigger alarm sound if a new order arrives
      if (orders.length > previousActiveCount) {
        playAlarm();
      }
      previousActiveCount = orders.length;

      // Analyze all orders for revenue and item counts
      Object.values(data).forEach(o => {
        if (o.timestamp) {
          const orderDate = new Date(o.timestamp);
          const amt = Number(o.total) || 0;

          // Calculate completed/cleared revenues
          if (o.status === 'Cleared') {
            if (orderDate.toDateString() === currentDay) todayRev += amt;
            if (orderDate.getMonth() === currentMonth && orderDate.getFullYear() === currentYear) monthRev += amt;
            if (orderDate.getFullYear() === currentYear) yearRev += amt;
          }

          // Tally item quantities for TODAY across all orders
          if (orderDate.toDateString() === currentDay && o.items) {
            o.items.forEach(itemStr => {
              let parts = itemStr.split('x ');
              let qty = parseInt(parts[0]) || 1;
              let itemName = parts.slice(1).join('x ') || itemStr;
              todayItemCounts[itemName] = (todayItemCounts[itemName] || 0) + qty;
            });
          }
        }
      });

      // Update Revenue UI
      document.getElementById('rev-today').innerText = `₹${todayRev}`;
      document.getElementById('rev-month').innerText = `₹${monthRev}`;
      document.getElementById('rev-year').innerText = `₹${yearRev}`;

      // Update Item Tally UI
      const tallyContainer = document.getElementById('item-tally-container');
      tallyContainer.innerHTML = "";
      const itemKeys = Object.keys(todayItemCounts);
      if (itemKeys.length === 0) {
        tallyContainer.innerHTML = `<p style="color:#64748b; font-size:13px; margin:5px 0;">No items sold yet today.</p>`;
      } else {
        itemKeys.forEach(name => {
          tallyContainer.innerHTML += `
            <div class="tally-card">
              <span style="font-size:13px; font-weight:bold;">${name}</span>
              <span style="font-size:15px; color:var(--green); font-weight:800;">${todayItemCounts[name]} sold</span>
            </div>`;
        });
      }

      // Render Active Orders Grid
      orders.reverse().forEach(order => {
        let itemsHtml = order.items.map(i => `<li>✔️ ${i}</li>`).join('');
        let statusClass = order.status === 'Preparing' ? 'preparing' : '';
        
        let paymentBadge = order.paymentStatus === 'Verified' 
          ? '<span style="color:var(--green); font-size:12px;">✅ Payment Confirmed</span>' 
          : '<span style="color:#ef4444; font-size:12px;">⚠️ Payment Pending Verification</span>';

        let actionBtn = '';
        if (order.status === 'Pending') {
          actionBtn = `<button class="btn btn-prep" onclick="updateStatus('${order.orderId}', 'Preparing')">Start Cooking 🔥</button>`;
        } else if (order.status === 'Preparing') {
          actionBtn = `<button class="btn btn-serve" onclick="updateStatus('${order.orderId}', 'Served')">Mark Served 🚀</button>`;
        } else if (order.status === 'Served') {
          actionBtn = `
            ${order.paymentStatus !== 'Verified' ? `<button class="btn btn-verify" onclick="verifyPayment('${order.orderId}')">Confirm Payment Received 💵</button>` : ''}
            <button class="btn btn-clear" onclick="updateStatus('${order.orderId}', 'Cleared')">Bill Paid & Clear ✅</button>`;
        }

        let timeStr = new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        grid.innerHTML += `
          <div class="card ${statusClass}">
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #1a253a; padding-bottom:8px;">
              <strong style="color:var(--orange); font-size:16px;">TABLE #${order.table}</strong>
              <span style="font-size:11px; color:#64748b;">${timeStr}</span>
            </div>
            <ul class="item-list">${itemsHtml}</ul>
            <div style="margin: 8px 0; font-size:13px;">
              <strong>${order.paymentMode} - ₹${order.total}</strong><br>
              ${paymentBadge}
            </div>
            ${actionBtn}
          </div>`;
      });
    });

    function updateStatus(orderId, newStatus) {
      db.ref(`orders/${orderId}`).update({ status: newStatus });
    }

    function verifyPayment(orderId) {
      db.ref(`orders/${orderId}`).update({ paymentStatus: 'Verified' });
    }
  </script>
</body>
</html>
