<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Kitchen Command</title>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-app.js"></script>
  <script src="https://www.gstatic.com/firebasejs/8.10.1/firebase-database.js"></script>
  <style>
    :root {
      --bg: #05070b; --card-bg: #0d1322; --border: #1a253a;
      --cyan: #06b6d4; --orange: #f59e0b; --green: #10b981; --text: #f8fafc;
    }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 20px; }
    header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid var(--border); padding-bottom: 15px; margin-bottom: 20px; }
    header h1 { margin: 0; color: var(--orange); font-size: 24px; letter-spacing: 1px; text-transform: uppercase; }
    .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr)); gap: 15px; }
    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 15px; border-left: 6px solid var(--orange); box-shadow: 0 5px 15px rgba(0,0,0,0.5); }
    .card.preparing { border-left-color: var(--cyan); }
    .item-list { list-style: none; padding: 0; margin: 12px 0; font-size: 15px; font-weight: bold; }
    .item-list li { padding: 6px 0; border-bottom: 1px dashed var(--border); }
    .btn { border: none; padding: 10px 15px; border-radius: 6px; font-weight: 800; cursor: pointer; font-size: 13px; text-transform: uppercase; width: 100%; margin-top: 10px; transition: 0.2s; }
    .btn-prep { background: var(--cyan); color: #000; }
    .btn-serve { background: var(--green); color: #000; }
    .btn-clear { background: #334155; color: #fff; }
    
    .dev-footer { margin-top: 40px; text-align: center; font-size: 12px; color: #64748b; padding: 20px 0; border-top: 1px solid var(--border); }
    .dev-footer strong { color: var(--cyan); }
  </style>
</head>
<body>

  <header>
    <h1>⚡ Gani Cafe KDS</h1>
    <div style="background:#1e293b; padding:10px 20px; border-radius:8px; border:1px solid var(--cyan);">
      <span style="font-size:14px; color:var(--cyan); font-weight:bold;">LIVE ORDERS: <span id="active-count" style="font-size:18px; color:#fff;">0</span></span>
    </div>
  </header>

  <div class="grid" id="orders-grid"></div>

  <div class="dev-footer">
    &copy; 2026 <strong>GANI CAFE</strong>. Kitchen Command Module.<br>
    Developed with ❤️ by <strong>Syed Zeeshaan Ali</strong><br>
    IG: <strong>@syedzeeshaanali07</strong> | 📞 <strong>+91 7989698613</strong>
  </div>

  <script>
    // --- FIREBASE CONFIGURATION ---
   // Import the functions you need from the SDKs you need
import { initializeApp } from "firebase/app";
import { getAnalytics } from "firebase/analytics";
// TODO: Add SDKs for Firebase products that you want to use
// https://firebase.google.com/docs/web/setup#available-libraries

// Your web app's Firebase configuration
// For Firebase JS SDK v7.20.0 and later, measurementId is optional
const firebaseConfig = {
  apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
  authDomain: "gani-cafe-52066.firebaseapp.com",
  projectId: "gani-cafe-52066",
  storageBucket: "gani-cafe-52066.firebasestorage.app",
  messagingSenderId: "292009300507",
  appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe",
  measurementId: "G-F7TXYZBYKY"
};

// Initialize Firebase
const app = initializeApp(firebaseConfig);
const analytics = getAnalytics(app);
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let previousCount = 0;

    // Loud High-Tech Kitchen Alarm Synth
    function playAlarm() {
      try {
        const ctx = new (window.AudioContext || window.webkitAudioContext)();
        const osc = ctx.createOscillator();
        const gain = ctx.createGain();
        osc.type = 'square';
        osc.frequency.setValueAtTime(880, ctx.currentTime);
        osc.frequency.setValueAtTime(1760, ctx.currentTime + 0.15);
        gain.gain.setValueAtTime(0.5, ctx.currentTime);
        gain.gain.exponentialRampToValueAtTime(0.01, ctx.currentTime + 0.4);
        osc.connect(gain); gain.connect(ctx.destination);
        osc.start(); osc.stop(ctx.currentTime + 0.4);
      } catch(e){}
    }

    db.ref('orders').on('value', (snapshot) => {
      const data = snapshot.val();
      const grid = document.getElementById('orders-grid');
      grid.innerHTML = "";

      if (!data) {
        document.getElementById('active-count').innerText = 0;
        return;
      }

      // Filter out Cleared orders so they leave the screen
      const orders = Object.values(data).filter(o => o.status !== 'Cleared');
      document.getElementById('active-count').innerText = orders.length;

      // Ring bell only if new order arrived
      if (orders.length > previousCount) playAlarm();
      previousCount = orders.length;

      orders.reverse().forEach(order => {
        let itemsHtml = order.items.map(i => `<li>✔️ ${i}</li>`).join('');
        let statusClass = order.status === 'Preparing' ? 'preparing' : '';
        
        let actionBtn = '';
        if (order.status === 'Pending') {
          actionBtn = `<button class="btn btn-prep" onclick="updateStatus('${order.orderId}', 'Preparing')">Start Cooking 🔥</button>`;
        } else if (order.status === 'Preparing') {
          actionBtn = `<button class="btn btn-serve" onclick="updateStatus('${order.orderId}', 'Served')">Mark Served 🚀</button>`;
        } else if (order.status === 'Served') {
          actionBtn = `<button class="btn btn-clear" onclick="updateStatus('${order.orderId}', 'Cleared')">Bill Paid & Clear ✅</button>`;
        }

        let timeStr = new Date(order.timestamp).toLocaleTimeString([], {hour: '2-digit', minute:'2-digit'});

        grid.innerHTML += `
          <div class="card ${statusClass}">
            <div style="display:flex; justify-content:space-between; border-bottom:1px solid #1a253a; padding-bottom:10px;">
              <strong style="color:var(--orange); font-size:18px;">TABLE #${order.table}</strong>
              <span style="font-size:12px; color:#64748b;">${timeStr}</span>
            </div>
            <ul class="item-list">${itemsHtml}</ul>
            <div style="display:flex; justify-content:space-between; align-items:center; margin-top:10px;">
              <div>
                <span style="font-size:10px; color:#64748b; display:block;">PAYMENT</span>
                <strong style="font-size:14px; color:#fff;">${order.paymentMode} - ₹${order.total}</strong>
              </div>
            </div>
            ${actionBtn}
          </div>`;
      });
    });

    function updateStatus(orderId, newStatus) {
      db.ref(`orders/${orderId}`).update({ status: newStatus });
    }
  </script>
</body>
</html>
