<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe | Kitchen Admin</title>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>
  <style>
    :root { --bg-dark: #070a12; --card-bg: #111827; --accent-gold: #f59e0b; --accent-emerald: #10b981; --accent-blue: #3b82f6; --danger: #ef4444; --text-light: #f9fafb; --text-muted: #9ca3af; --border-color: #1f2937; }
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, sans-serif; }
    body { background: var(--bg-dark); color: var(--text-light); min-height: 100vh; display: flex; flex-direction: column; }
    header { background: var(--card-bg); border-bottom: 1px solid var(--border-color); padding: 15px 25px; display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 15px; }
    .brand { font-size: 1.5rem; font-weight: 800; color: var(--accent-gold); }
    .nav-tabs { display: flex; gap: 10px; }
    .tab-btn { background: #1f2937; border: none; color: #fff; padding: 8px 16px; border-radius: 6px; cursor: pointer; font-weight: bold; }
    .tab-btn.active { background: var(--accent-gold); color: #000; }
    .content-area { flex: 1; padding: 20px; overflow-y: auto; }
    
    .kds-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 18px; }
    .ticket-card { background: var(--card-bg); border: 2px solid var(--border-color); border-radius: 10px; display: flex; flex-direction: column; }
    .ticket-head { padding: 12px; border-bottom: 1px solid var(--border-color); display: flex; justify-content: space-between; align-items: center; }
    .ticket-body { padding: 14px; flex: 1; display: flex; flex-direction: column; gap: 8px; }
    .ticket-actions { padding: 10px; background: #000; display: flex; gap: 8px; }
    .btn-act { flex: 1; padding: 10px; border: none; border-radius: 6px; font-weight: bold; cursor: pointer; color: #fff; }
    
    .tables-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(140px, 1fr)); gap: 15px; }
    .table-box { background: var(--card-bg); border: 1px solid var(--border-color); padding: 15px; border-radius: 8px; text-align: center; cursor: pointer; }
    .table-box.occupied { border-color: var(--danger); background: rgba(239,68,68,0.1); }
    
    .form-box { background: var(--card-bg); padding: 20px; border-radius: 8px; border: 1px solid var(--border-color); max-width: 500px; }
    input, select { width: 100%; padding: 10px; margin-top: 8px; margin-bottom: 12px; background: #000; border: 1px solid var(--border-color); color: #fff; border-radius: 6px; }
  </style>
</head>
<body>

  <header>
    <div class="brand">🍳 GANI CAFE KITCHEN</div>
    <div class="nav-tabs">
      <button class="tab-btn active" id="tabKds" onclick="switchTab('kds')">Live Orders</button>
      <button class="tab-btn" id="tabMenu" onclick="switchTab('menu')">Manage Menu</button>
      <button class="tab-btn" id="tabTables" onclick="switchTab('tables')">Tables</button>
      <button class="tab-btn" id="tabTally" onclick="switchTab('tally')">Sales Tally</button>
    </div>
  </header>

  <div class="content-area">
    <div id="viewKds">
      <div class="kds-grid" id="kdsTicketsContainer"></div>
    </div>

    <div id="viewMenu" style="display: none;">
      <h2>Add / Manage Menu Items</h2>
      <div style="display: flex; gap: 20px; flex-wrap: wrap; margin-top: 15px;">
        <div class="form-box">
          <input type="text" id="newItemName" placeholder="Item Name">
          <input type="text" id="newItemCat" placeholder="Category (e.g. Chai, Snacks)">
          <input type="number" id="newItemPrice" placeholder="Price">
          <input type="text" id="newItemImg" placeholder="Image URL (Optional)">
          <button class="btn-act" style="background:var(--accent-emerald);" onclick="addNewMenuItem()">Save Item</button>
        </div>
        <div style="flex:1; min-width:300px; max-height: 500px; overflow-y: auto;" id="stockListContainer"></div>
      </div>
    </div>

    <div id="viewTables" style="display: none;">
      <div class="tables-grid" id="tablesGridContainer"></div>
    </div>

    <div id="viewTally" style="display: none;">
      <div class="form-box" style="max-width: 100%;">
        <h2>Total Revenue: <span id="totalRevenueLabel" style="color:var(--accent-emerald);">₹0</span></h2>
        <p id="totalOrdersCountLabel">Total Orders: 0</p>
        <div id="salesBreakdownContainer" style="margin-top:15px;"></div>
      </div>
    </div>
  </div>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM", authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066", storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507", appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe", measurementId: "G-F7TXYZBYKY"
    };
    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    let ordersData = [];
    let menuData = [];
    let tablesData = {};

    function initKitchen() {
      db.ref("orders").on("value", snapshot => {
        const val = snapshot.val();
        ordersData = val ? Object.values(val).filter(o => o && typeof o === 'object') : [];
        renderKds(); renderTally();
      });

      db.ref("menu").on("value", snapshot => {
        const val = snapshot.val();
        menuData = val ? Object.values(val).filter(i => i && typeof i === 'object') : [];
        renderStockList();
      });

      db.ref("tables").on("value", snapshot => {
        tablesData = snapshot.val() || {}; renderTables();
      });
    }

    function switchTab(tab) {
      document.querySelectorAll(".tab-btn").forEach(b => b.classList.remove("active"));
      ["viewKds", "viewMenu", "viewTables", "viewTally"].forEach(v => document.getElementById(v).style.display = "none");
      document.getElementById("tab" + tab.charAt(0).toUpperCase() + tab.slice(1)).classList.add("active");
      document.getElementById("view" + tab.charAt(0).toUpperCase() + tab.slice(1)).style.display = "block";
    }

    function renderKds() {
      const container = document.getElementById("kdsTicketsContainer");
      const list = ordersData.filter(o => o.clearanceStatus !== "Cleared");
      if (list.length === 0) { container.innerHTML = `<p>No active orders.</p>`; return; }

      container.innerHTML = list.map(o => `
        <div class="ticket-card">
          <div class="ticket-head">
            <div><strong>${o.orderId}</strong><br><span style="color:var(--accent-gold);">${o.tableNo}</span></div>
            <span>${o.kitchenStatus}</span>
          </div>
          <div class="ticket-body">
            ${(o.items || []).map(i => `<div>${i.qty}x ${i.name}</div>`).join("")}
            <hr style="border-color:var(--border-color);"><div style="font-size:0.85rem;">Total: ₹${o.totalAmount} (${o.paymentMethod})</div>
          </div>
          <div class="ticket-actions">
            ${o.kitchenStatus === 'Pending' ? `<button class="btn-act" style="background:var(--accent-blue);" onclick="updateStatus('${o.orderId}', 'Preparing')">Start Prep</button>` 
            : o.kitchenStatus === 'Preparing' ? `<button class="btn-act" style="background:var(--accent-emerald);" onclick="updateStatus('${o.orderId}', 'Ready')">Mark Ready</button>` 
            : `<button class="btn-act" style="background:var(--danger);" onclick="clearOrder('${o.orderId}')">Clear Order</button>`}
          </div>
        </div>
      `).join("");
    }

    function updateStatus(id, status) { db.ref(`orders/${id}/kitchenStatus`).set(status); }
    function clearOrder(id) { db.ref(`orders/${id}/clearanceStatus`).set("Cleared"); }

    function renderStockList() {
      document.getElementById("stockListContainer").innerHTML = menuData.map(item => `
        <div style="display:flex; justify-content:space-between; padding:10px; border:1px solid var(--border-color); margin-bottom:5px; border-radius:6px;">
          <div><strong>${item.name || 'Unknown'}</strong> - ₹${item.price || 0}</div>
          <button class="btn-act" style="max-width:80px; background:${item.inStock !== false ? 'var(--danger)' : 'var(--accent-emerald)'}" onclick="toggleStock('${item.id}', ${item.inStock === false})">
            ${item.inStock !== false ? 'Out' : 'In'}
          </button>
        </div>
      `).join("");
    }

    function toggleStock(id, newStatus) { db.ref(`menu/${id}/inStock`).set(newStatus); }

    function addNewMenuItem() {
      const name = document.getElementById("newItemName").value.trim();
      const cat = document.getElementById("newItemCat").value.trim();
      const price = parseFloat(document.getElementById("newItemPrice").value);
      const img = document.getElementById("newItemImg").value.trim() || "https://images.unsplash.com/photo-1544787219-7f47ccb76574?w=300";

      if (!name || !cat || isNaN(price)) return alert("Please fill name, category and price.");
      const id = "custom_" + Date.now();
      db.ref(`menu/${id}`).set({ id, name, category: cat, price, inStock: true, img });
      alert("Added!");
    }

    function renderTables() {
      let html = "";
      for (let i = 1; i <= 10; i++) {
        const tKey = `Table ${i}`; const isOcc = tablesData[tKey] === 'Occupied';
        html += `<div class="table-box ${isOcc ? 'occupied' : ''}" onclick="toggleTable('${tKey}', ${!isOcc})"><h3>Table ${i}</h3><p>${isOcc ? 'OCCUPIED' : 'AVAILABLE'}</p></div>`;
      }
      document.getElementById("tablesGridContainer").innerHTML = html;
    }
    function toggleTable(tKey, setOcc) { db.ref(`tables/${tKey}`).set(setOcc ? 'Occupied' : 'Available'); }

    function renderTally() {
      const totalRev = ordersData.reduce((acc, o) => acc + (Number(o.totalAmount) || 0), 0);
      document.getElementById("totalRevenueLabel").innerText = `₹${totalRev}`;
      document.getElementById("totalOrdersCountLabel").innerText = `Total Orders: ${ordersData.length}`;
    }

    window.onload = initKitchen;
  </script>
</body>
</html>
