<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Command Center</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
  <style>
    @media print {
      body * { visibility: hidden; }
      #printArea, #printArea * { visibility: visible; }
      #printArea { position: absolute; left: 0; top: 0; width: 100%; padding: 20px; }
      .no-print { display: none !important; }
      .print-shadow-none { box-shadow: none !important; border: 1px solid #ddd; }
    }
  </style>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

  <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50 no-print">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black uppercase text-amber-500">Gani Cafe</h1>
        <p class="text-xs font-bold text-slate-400 uppercase">Command Center</p>
      </div>
      <div class="flex space-x-2">
        <button onclick="switchTab('orders')" id="tab-orders" class="px-4 py-2 rounded font-black bg-amber-600 text-white shadow">Orders</button>
        <button onclick="switchTab('inventory')" id="tab-inventory" class="px-4 py-2 rounded font-black bg-slate-800 text-slate-300">Inventory</button>
        <button onclick="switchTab('dashboard')" id="tab-dashboard" class="px-4 py-2 rounded font-black bg-slate-800 text-slate-300">Dashboard & History</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- 1. LIVE ORDERS -->
    <section id="view-orders">
      <h2 class="text-xl font-black uppercase mb-6 text-slate-800">Live Tables</h2>
      <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- 2. INVENTORY & MENU -->
    <section id="view-inventory" class="hidden no-print">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        <div class="lg:col-span-1">
          <div class="bg-white p-6 rounded-2xl shadow border">
            <h3 class="text-lg font-black mb-4 uppercase border-b pb-2">Add New Item</h3>
            <div class="space-y-3">
              <input type="text" id="itemName" placeholder="Item Name" class="w-full border rounded p-3 bg-slate-50 font-bold">
              <div class="flex space-x-2">
                <input type="number" id="itemPrice" placeholder="Price ₹" class="w-1/2 border rounded p-3 bg-slate-50 font-bold">
                <select id="itemCategory" class="w-1/2 border rounded p-3 bg-slate-50 font-bold">
                  <option value="Chai">Chai</option><option value="Biryani">Biryani</option>
                </select>
              </div>
              <input type="text" id="itemImage" placeholder="Image URL (optional)" class="w-full border rounded p-3 bg-slate-50">
              <button onclick="addMenuItem()" class="w-full bg-slate-900 text-white font-black py-3 rounded hover:bg-slate-800">Add to Menu</button>
            </div>
          </div>
        </div>
        <div class="lg:col-span-2">
          <h3 class="text-lg font-black mb-4 uppercase">Stock Control</h3>
          <div id="inventoryList" class="space-y-3"></div>
        </div>
      </div>
    </section>

    <!-- 3. DASHBOARD & DAILY HISTORY (PDF Printable) -->
    <section id="view-dashboard" class="hidden">
      <div class="flex justify-between items-center mb-6 no-print">
        <h2 class="text-xl font-black uppercase tracking-wide">Sales & History</h2>
        <button onclick="window.print()" class="bg-emerald-600 text-white px-5 py-2 rounded-lg font-bold shadow-lg hover:bg-emerald-700">Download Report (PDF)</button>
      </div>

      <div id="printArea" class="bg-white p-8 rounded-2xl shadow-lg border border-slate-200 print-shadow-none">
        <h1 class="text-3xl font-black text-center mb-2 text-slate-900">Gani Cafe</h1>
        <p class="text-center text-slate-500 font-bold mb-8 uppercase">Official Sales Report</p>
        
        <!-- Totals Summary -->
        <div class="grid grid-cols-2 md:grid-cols-4 gap-6 text-center mb-10">
          <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Today's Sales</p>
            <p id="tallyDaily" class="text-3xl font-black text-emerald-600">₹0</p>
          </div>
          <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">This Week</p>
            <p id="tallyWeekly" class="text-3xl font-black text-blue-600">₹0</p>
          </div>
          <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">This Month</p>
            <p id="tallyMonthly" class="text-3xl font-black text-amber-600">₹0</p>
          </div>
          <div class="bg-slate-50 p-6 rounded-xl border border-slate-100">
            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">This Year</p>
            <p id="tallyYearly" class="text-3xl font-black text-slate-800">₹0</p>
          </div>
        </div>

        <!-- Today's Itemized List -->
        <div>
          <h3 class="text-lg font-black uppercase text-slate-800 border-b-2 border-slate-200 pb-2 mb-4">Today's Completed Orders</h3>
          <table class="w-full text-left text-sm border-collapse">
            <thead class="bg-slate-100 text-slate-500 uppercase font-bold text-[10px] tracking-widest">
              <tr>
                <th class="p-3 border-b">Time</th>
                <th class="p-3 border-b">Table</th>
                <th class="p-3 border-b">Order ID</th>
                <th class="p-3 border-b w-1/2">Items Sold</th>
                <th class="p-3 border-b text-right">Amount</th>
              </tr>
            </thead>
            <tbody id="dailyLogsTable" class="divide-y divide-slate-100">
              <!-- Logs inject here -->
            </tbody>
          </table>
        </div>

      </div>
    </section>

  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };
    
    // YOUR GOOGLE SCRIPT URL
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/library/d/1HD9e-FLxTT9MQe5tsqn1xPI8VVJw8Sl2ynVgDuPrznzm5Y-71a2FJsIm/1";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();
    const fallbackImg = "https://images.unsplash.com/photo-1546069901-ba9599a7e63c?w=400&q=80";

    function switchTab(tab) {
      document.getElementById('view-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('view-inventory').classList.toggle('hidden', tab !== 'inventory');
      document.getElementById('view-dashboard').classList.toggle('hidden', tab !== 'dashboard');
      
      const activeCls = "px-4 py-2 rounded font-black bg-amber-600 text-white shadow";
      const inactiveCls = "px-4 py-2 rounded font-black bg-slate-800 text-slate-300";
      
      document.getElementById('tab-orders').className = tab === 'orders' ? activeCls : inactiveCls;
      document.getElementById('tab-inventory').className = tab === 'inventory' ? activeCls : inactiveCls;
      document.getElementById('tab-dashboard').className = tab === 'dashboard' ? activeCls : inactiveCls;
    }

    // --- KITCHEN LIVE ORDERS ---
    db.ref('orders').on('child_added', () => {
       try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e){}
    });

    db.ref('orders').on('value', snap => {
      const grid = document.getElementById('kitchenGrid');
      grid.innerHTML = '';
      const orders = snap.val() || {};
      
      Object.entries(orders).forEach(([id, order]) => {
        let borderColor = order.status === 'pending' ? 'border-amber-500' : (order.status === 'cooking' ? 'border-blue-500' : 'border-emerald-500');
        let statusBadge = order.status === 'pending' ? 'bg-amber-100 text-amber-700' : (order.status === 'cooking' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700');
        
        let actionButton = '';
        if (order.status === 'pending') {
          actionButton = `<button onclick="updateOrderStatus('${id}', 'cooking')" class="w-full bg-blue-600 text-white py-3 rounded-lg font-black active:scale-95">Accept & Cook</button>`;
        } else if (order.status === 'cooking') {
          actionButton = `<button onclick="updateOrderStatus('${id}', 'served')" class="w-full bg-emerald-600 text-white py-3 rounded-lg font-black active:scale-95">Serve Food</button>`;
        } else if (order.status === 'served') {
          actionButton = `<button onclick="clearAndSaveBill('${id}')" class="w-full bg-slate-900 text-white py-3 rounded-lg font-black border-2 border-emerald-500 active:scale-95 shadow-[0_0_15px_rgba(16,185,129,0.5)]">Payment Received - Clear Bill</button>`;
        }

        grid.innerHTML += `
          <div class="bg-white p-5 rounded-xl shadow border-t-4 ${borderColor} flex flex-col justify-between h-full">
            <div>
              <div class="flex justify-between items-center border-b pb-3 mb-3">
                <span class="font-black text-2xl">Table ${order.table}</span>
                <span class="text-xs font-black uppercase ${statusBadge} px-2 py-1 rounded">${order.status}</span>
              </div>
              <p class="font-bold text-sm leading-loose">${order.items.replace(/,/g, '<br>')}</p>
            </div>
            <div class="mt-4 pt-4 border-t">
              <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-black text-slate-400 uppercase">Bill Amount</span>
                <span class="font-black text-2xl text-amber-600">₹${order.total}</span>
              </div>
              ${actionButton}
            </div>
          </div>
        `;
      });
    });

    function updateOrderStatus(id, status) {
      db.ref('orders/' + id).update({ status: status });
    }

    // --- AUTO BILL, LOGS & CLEAR ---
    function getTallyKeys() {
      const d = new Date();
      const day = d.getDay();
      const diff = d.getDate() - day;
      const weekStart = new Date(d.setDate(diff));
      return {
        daily: new Date().toISOString().split('T')[0], 
        weekly: weekStart.toISOString().split('T')[0], 
        monthly: new Date().toISOString().substring(0,7),
        yearly: new Date().toISOString().substring(0,4)
      };
    }

    async function clearAndSaveBill(id) {
      const snap = await db.ref('orders/' + id).once('value');
      const order = snap.val();
      if (!order) return;
      
      // 1. Download Kitchen Receipt Text File
      let bill = `=== GANI CAFE ===\nTable: ${order.table}\nDate: ${new Date().toLocaleString()}\n------------------\n${order.items.split(', ').join('\n')}\n------------------\nTOTAL PAID: Rs. ${order.total}\n=================`;
      const blob = new Blob([bill], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Bill_Table${order.table}_${order.orderId}.txt`;
      a.click();

      // 2. Update Tallies
      const keys = getTallyKeys();
      const amount = Number(order.total);
      db.ref(`tallies/daily/${keys.daily}`).transaction(val => (val || 0) + amount);
      db.ref(`tallies/weekly/${keys.weekly}`).transaction(val => (val || 0) + amount);
      db.ref(`tallies/monthly/${keys.monthly}`).transaction(val => (val || 0) + amount);
      db.ref(`tallies/yearly/${keys.yearly}`).transaction(val => (val || 0) + amount);

      // 3. Save to Today's Dashboard List (Time of order completion)
      const timeNow = new Date().toLocaleTimeString('en-IN', { hour: '2-digit', minute: '2-digit' });
      db.ref(`daily_logs/${keys.daily}/${order.orderId}`).set({
        time: timeNow,
        table: order.table,
        items: order.items,
        total: order.total
      });

      // 4. Send to Google Sheets Archive
      fetch(GOOGLE_SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) });
      
      // 5. Delete from live Kitchen Screen
      db.ref('orders/' + id).remove();
    }

    // --- DASHBOARD LISTENERS (Totals & History) ---
    function listenToDashboard() {
      const keys = getTallyKeys();
      
      // Listen for Totals
      db.ref(`tallies/daily/${keys.daily}`).on('value', s => document.getElementById('tallyDaily').innerText = `₹${s.val() || 0}`);
      db.ref(`tallies/weekly/${keys.weekly}`).on('value', s => document.getElementById('tallyWeekly').innerText = `₹${s.val() || 0}`);
      db.ref(`tallies/monthly/${keys.monthly}`).on('value', s => document.getElementById('tallyMonthly').innerText = `₹${s.val() || 0}`);
      db.ref(`tallies/yearly/${keys.yearly}`).on('value', s => document.getElementById('tallyYearly').innerText = `₹${s.val() || 0}`);

      // Listen for Today's Logs (The morning to night history)
      db.ref(`daily_logs/${keys.daily}`).on('value', snap => {
        const table = document.getElementById('dailyLogsTable');
        table.innerHTML = '';
        const logs = snap.val() || {};
        
        if(Object.keys(logs).length === 0) {
          table.innerHTML = `<tr><td colspan="5" class="p-6 text-center text-slate-400 font-bold uppercase tracking-widest border-b">No orders completed today yet.</td></tr>`;
          return;
        }

        // Render logs (newest at the top)
        Object.entries(logs).reverse().forEach(([orderId, log]) => {
          table.innerHTML += `
            <tr class="hover:bg-slate-50 transition-colors">
              <td class="p-3 border-b text-slate-500 font-bold">${log.time}</td>
              <td class="p-3 border-b font-black text-slate-800">T-${log.table}</td>
              <td class="p-3 border-b text-xs font-mono text-slate-400">${orderId}</td>
              <td class="p-3 border-b text-slate-700 font-semibold">${log.items}</td>
              <td class="p-3 border-b font-black text-emerald-600 text-right">₹${log.total}</td>
            </tr>
          `;
        });
      });
    }
    listenToDashboard();

    // --- INVENTORY ---
    db.ref('menu').on('value', snap => {
      const list = document.getElementById('inventoryList');
      list.innerHTML = '';
      const menuData = snap.val() || {};

      Object.entries(menuData).forEach(([id, item]) => {
        list.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${item.in_stock ? 'border-emerald-500' : 'border-red-500'} flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <img src="${item.image}" onerror="this.src='${fallbackImg}'" class="w-16 h-16 rounded-lg object-cover bg-slate-200">
              <div>
                <h4 class="font-black text-slate-800">${item.name}</h4>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${item.category}</p>
                <p class="text-amber-600 font-black">₹${item.price}</p>
              </div>
            </div>
            <button onclick="toggleStock('${id}', ${item.in_stock})" class="px-4 py-2 rounded-lg font-black text-xs uppercase ${item.in_stock ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">
              ${item.in_stock ? 'In Stock' : 'Sold Out'}
            </button>
          </div>
        `;
      });
    });

    function addMenuItem() {
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const category = document.getElementById('itemCategory').value;
      const image = document.getElementById('itemImage').value || fallbackImg;
      
      if(name && price) {
        db.ref('menu').push({ name: name, price: Number(price), category: category, image: image, in_stock: true });
        document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = ''; document.getElementById('itemImage').value = '';
      }
    }

    function toggleStock(id, status) {
      db.ref('menu/' + id).update({ in_stock: !status });
    }
  </script>
</body>
</html>
