<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Gani Cafe - Kitchen Command</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/9.22.1/firebase-database-compat.js"></script>
</head>
<body class="bg-slate-100 font-sans antialiased text-slate-800">

  <!-- Header -->
  <header class="bg-slate-900 text-white shadow-xl sticky top-0 z-50">
    <div class="max-w-7xl mx-auto px-6 py-4 flex justify-between items-center">
      <div>
        <h1 class="text-2xl font-black tracking-wider uppercase text-amber-500">Gani Cafe</h1>
        <p class="text-xs font-bold text-slate-400 tracking-widest uppercase">Kitchen & Cashier Terminal</p>
      </div>
      <div class="flex space-x-2">
        <button onclick="switchTab('orders')" id="tab-orders" class="px-5 py-2 rounded-lg font-black bg-amber-600 text-white shadow-md">Orders</button>
        <button onclick="switchTab('inventory')" id="tab-inventory" class="px-5 py-2 rounded-lg font-black bg-slate-800 text-slate-300">Inventory</button>
      </div>
    </div>
  </header>

  <main class="max-w-7xl mx-auto px-6 py-8">

    <!-- 1. LIVE ORDERS -->
    <section id="view-orders">
      <div class="flex justify-between items-center mb-6">
        <h2 class="text-xl font-black uppercase text-slate-800 tracking-wide">Live Tables (Max 10)</h2>
      </div>
      <div id="kitchenGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></div>
    </section>

    <!-- 2. INVENTORY & MENU -->
    <section id="view-inventory" class="hidden">
      <div class="grid grid-cols-1 lg:grid-cols-3 gap-8">
        
        <!-- Add Item -->
        <div class="lg:col-span-1">
          <div class="bg-white p-6 rounded-2xl shadow-md border border-slate-200">
            <h3 class="text-lg font-black mb-4 uppercase border-b pb-2">Add New Item</h3>
            <div class="space-y-3">
              <input type="text" id="itemName" placeholder="Item Name" class="w-full border rounded-lg p-3 bg-slate-50 font-bold">
              <div class="flex space-x-2">
                <input type="number" id="itemPrice" placeholder="Price ₹" class="w-1/2 border rounded-lg p-3 bg-slate-50 font-bold">
                <select id="itemCategory" class="w-1/2 border rounded-lg p-3 bg-slate-50 font-bold">
                  <option value="Chai">Chai</option><option value="Biryani">Biryani</option>
                </select>
              </div>
              <input type="text" id="itemImage" placeholder="Image URL (optional)" class="w-full border rounded-lg p-3 bg-slate-50">
              <button onclick="addMenuItem()" class="w-full bg-slate-900 text-white font-black py-3 rounded-xl hover:bg-slate-800">Add to Menu</button>
            </div>
          </div>
        </div>

        <!-- Inventory List -->
        <div class="lg:col-span-2">
          <h3 class="text-lg font-black mb-4 uppercase">Stock Control</h3>
          <div id="inventoryList" class="space-y-3"></div>
        </div>
      </div>
    </section>
  </main>

  <script>
    const firebaseConfig = {
      apiKey: "AIzaSyDKolbW4S6olWKrKEn523Lxn2owY_YQFBM",
      authDomain: "gani-cafe-52066.firebaseapp.com",
      databaseURL: "https://gani-cafe-52066-default-rtdb.asia-southeast1.firebasedatabase.app",
      projectId: "gani-cafe-52066",
      storageBucket: "gani-cafe-52066.firebasestorage.app",
      messagingSenderId: "292009300507",
      appId: "1:292009300507:web:cf524330c2ff4ef4e39ebe"
    };
    
    // YOUR GOOGLE SCRIPT WEB APP URL
    const GOOGLE_SHEET_URL = "https://script.google.com/macros/library/d/1HD9e-FLxTT9MQe5tsqn1xPI8VVJw8Sl2ynVgDuPrznzm5Y-71a2FJsIm/1";

    firebase.initializeApp(firebaseConfig);
    const db = firebase.database();

    function switchTab(tab) {
      document.getElementById('view-orders').classList.toggle('hidden', tab !== 'orders');
      document.getElementById('view-inventory').classList.toggle('hidden', tab !== 'inventory');
      document.getElementById('tab-orders').className = tab === 'orders' ? "px-5 py-2 rounded-lg font-black bg-amber-600 text-white shadow-md" : "px-5 py-2 rounded-lg font-black bg-slate-800 text-slate-300";
      document.getElementById('tab-inventory').className = tab === 'inventory' ? "px-5 py-2 rounded-lg font-black bg-amber-600 text-white shadow-md" : "px-5 py-2 rounded-lg font-black bg-slate-800 text-slate-300";
    }

    // --- ORDER WORKFLOW ---
    db.ref('orders').on('child_added', () => {
       try { new Audio('https://assets.mixkit.co/active_storage/sfx/2869/2869-preview.mp3').play(); } catch(e){}
    });

    db.ref('orders').on('value', snap => {
      const grid = document.getElementById('kitchenGrid');
      grid.innerHTML = '';
      const orders = snap.val() || {};
      
      Object.entries(orders).forEach(([id, order]) => {
        let borderColor = order.status === 'pending' ? 'border-amber-500' : (order.status === 'cooking' ? 'border-blue-500' : 'border-emerald-500');
        let statusBadge = order.status === 'pending' ? 'bg-amber-100 text-amber-700' : (order.status === 'cooking' ? 'bg-blue-100 text-blue-700' : 'bg-emerald-100 text-emerald-700');
        
        let actionButton = '';
        if (order.status === 'pending') {
          actionButton = `<button onclick="updateOrderStatus('${id}', 'cooking')" class="w-full bg-blue-600 text-white py-3 rounded-xl font-black shadow-md hover:bg-blue-700 active:scale-95">Accept & Cook</button>`;
        } else if (order.status === 'cooking') {
          actionButton = `<button onclick="updateOrderStatus('${id}', 'served')" class="w-full bg-emerald-600 text-white py-3 rounded-xl font-black shadow-md hover:bg-emerald-700 active:scale-95">Food Ready & Serve</button>`;
        } else if (order.status === 'served') {
          // This confirms payment, saves the bill, and clears the screen.
          actionButton = `<button onclick="clearAndSaveBill('${id}')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-black shadow-md hover:bg-slate-800 active:scale-95 border-2 border-emerald-500">Confirm Payment & Clear</button>`;
        }

        grid.innerHTML += `
          <div class="bg-white p-5 rounded-2xl shadow-lg border-t-4 ${borderColor} flex flex-col justify-between h-full">
            <div>
              <div class="flex justify-between items-center border-b pb-3 mb-3">
                <span class="font-black text-2xl">Table ${order.table}</span>
                <span class="text-xs font-black uppercase ${statusBadge} px-3 py-1 rounded-md tracking-wider">${order.status}</span>
              </div>
              <p class="font-bold text-sm text-slate-600 mb-5 leading-loose">${order.items.replace(/,/g, '<br>')}</p>
            </div>
            <div class="mt-auto pt-4 border-t">
              <div class="flex justify-between items-center mb-4">
                <span class="text-xs font-black text-slate-400 uppercase">Bill Amount</span>
                <span class="font-black text-2xl text-amber-600">₹${order.total}</span>
              </div>
              ${actionButton}
            </div>
          </div>
        `;
      });
    });

    function updateOrderStatus(id, status) {
      db.ref('orders/' + id).update({ status: status });
    }

    async function clearAndSaveBill(id) {
      const snap = await db.ref('orders/' + id).once('value');
      const order = snap.val();
      if (!order) return;
      
      // 1. Generate local receipt text file
      let bill = `=== GANI CAFE RECEIPT ===\nTable: ${order.table}\nDate: ${new Date().toLocaleString()}\n------------------\n`;
      order.items.split(', ').forEach(i => { bill += `${i}\n`; });
      bill += `------------------\nTOTAL PAID: Rs. ${order.total}\n=====================\n`;
      
      const blob = new Blob([bill], { type: 'text/plain' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `Bill_Table${order.table}_${order.orderId}.txt`;
      document.body.appendChild(a);
      a.click();
      document.body.removeChild(a);

      // 2. Send to Google Sheets
      fetch(GOOGLE_SHEET_URL, { method: "POST", mode: "no-cors", headers: { "Content-Type": "application/json" }, body: JSON.stringify(order) });
      
      // 3. Clear from Firebase (Updates customer phone & clears kitchen screen)
      db.ref('orders/' + id).remove();
    }

    // --- INVENTORY MANAGEMENT ---
    db.ref('menu').on('value', snap => {
      const list = document.getElementById('inventoryList');
      list.innerHTML = '';
      const menuData = snap.val() || {};

      Object.entries(menuData).forEach(([id, item]) => {
        list.innerHTML += `
          <div class="bg-white p-3 rounded-xl shadow-sm border-l-4 ${item.in_stock ? 'border-emerald-500' : 'border-red-500'} flex items-center justify-between">
            <div class="flex items-center space-x-4">
              <img src="${item.image}" class="w-16 h-16 rounded-lg object-cover bg-slate-200">
              <div>
                <h4 class="font-black text-slate-800">${item.name}</h4>
                <p class="text-[10px] font-black text-slate-400 uppercase tracking-widest">${item.category}</p>
                <p class="text-amber-600 font-black">₹${item.price}</p>
              </div>
            </div>
            <button onclick="toggleStock('${id}', ${item.in_stock})" class="px-4 py-2 rounded-lg font-black text-xs uppercase ${item.in_stock ? 'bg-emerald-100 text-emerald-700' : 'bg-red-100 text-red-700'}">
              ${item.in_stock ? 'In Stock' : 'Sold Out'}
            </button>
          </div>
        `;
      });
    });

    function addMenuItem() {
      const name = document.getElementById('itemName').value;
      const price = document.getElementById('itemPrice').value;
      const category = document.getElementById('itemCategory').value;
      const image = document.getElementById('itemImage').value || "https://images.pexels.com/photos/1640777/pexels-photo-1640777.jpeg?auto=compress&cs=tinysrgb&w=400";
      
      if(name && price) {
        db.ref('menu').push({ name: name, price: Number(price), category: category, image: image, in_stock: true });
        document.getElementById('itemName').value = ''; document.getElementById('itemPrice').value = ''; document.getElementById('itemImage').value = '';
      }
    }

    function toggleStock(id, status) {
      db.ref('menu/' + id).update({ in_stock: !status });
    }
  </script>
</body>
</html>
